  - {type: variant, offset: 5, length: 0, content: '', WYG: 司隨時加減庻免百姓每歲不安其今年輕貨及年支米等臣請准狀處分謹録奏聞論舜廟狀永㤗二年奏勑依右謹按地圖舜陵在九疑之山舜廟在太陽之溪舜陵古老以失太陽溪今不知處秦漢已來置廟山下年代寖逺祠宇不存毎有詔書令州縣致祭奠酹荒野恭命而已豈有盛德大業百王師表殁於荒裔陵廟皆無臣謹遵舊制於州西山上已立廟訖持乞天恩許蠲免近廟一兩家令歲時拂灑示為恒式豈獨表聖人至德及於萬代實欲彰陛下𤣥澤及於無窮謹録奏聞舉處士張季秀狀永㤗二年奏勑依臣州僻在嶺隅其實邊裔土風貪於貨賂舊俗多習吏事獨季秀能介直自全退守亷讓文學為業不求人知寒餒切身彌更守分貴其所尚願老山林臣切以兵興已來人皆趨競茍利分寸不愧其心則如季秀者不可不加褒異臣特望天恩令州縣取其穩便與造草舍十数間給水田一兩頃免其當戸徭役令得保遂其志此實明朝旌退讓之道亦為士庻識亷耻之方謹録奏聞次山集巻十欽定四庫全書次山集巻十一唐}
