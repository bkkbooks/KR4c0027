  - {type: variant, offset: 7, length: 596, content: 文集後序李商隱次山有文編有後集有元子三書皆自爲之序次山見譽于公弱夫蘇氏始有名見取于公後楊公始得進士第見憎于第五琦元載故其將兵不得授作官不至逹母老不得盡其養母䘮不得終其哀間二十年其文危苦激切悲憂酸傷于性命之際自古心經㔾下若干篇是外曾孫遼東李惲辭收得之聚爲元文後編次山之作其綿遠長大以自然爲祖元氣爲根變化移易之太虚無狀大賁無色寒暑攸出鬼神有職南斗北斗東龍西虎方嚮物色欻何從生啞鐘復鳴黃雉變雄山相朝捧水信潮汐若大壓然不覺其興若大醉然不覺其醒其疾怒急擊快利勁果出行萬里不見其敵高歌酣顔入飮于朝斷章摘句如振始生狼子豹孫競于跳走剪餘斬殘程露血􅍺其詳緩柔潤壓抑趨儒如以一國買人一笑如以萬世換人一朝重屋深宮但見其脊牽繂長河不知其載死而更生夜而更明衣裳鍾石雅在宮藏其正聽嚴毅不滓不濁如坐正人照彼佞者子從其翁婦從其姑𥪡麾爲門懸木爲牙張葢乘車屹不敢入將刑斷死帝不得赦其碎細分擘切截纎顆如墜地碎若大咽餘鋸取朽靈櫟蟒出毒刺眼楚齒不見可視顧顚踣錯襍汙潴傷損如在危處如出夢中其總旨會源條綱正目若國大治若年大熟君君堯舜人人羲皇上之視下不知有尊下之望上不知有簒辮頭鑿齒扶服臣僕融風彩露飄零委落耋老者在童齓者蕃邪人佞夫指之觸之薫薰熈熈不識其故吁不得盡其極也而論者徒曰次山不師孔氏爲非嗚呼孔氏于道德仁義外有何物百千萬年聖賢相隨于塗中耳次山之書曰三皇用眞而耻聖五帝用聖而耻明三皇用明而耻察嗟嗟此書可以無書孔氏固聖矣次山安在其必師之邪, WYG: 撰}
