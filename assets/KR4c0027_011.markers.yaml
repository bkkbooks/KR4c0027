  - {type: variant, offset: 1, length: 0, content: '', WYG: 其見在百姓產業稍成逃亡歸復似可存活即請依常例處分伏願陛下以臣所奏下議有司茍若臣所見愚僻不合時政干亂紀度事渉虚妄忝官尸禄欺上罔下是臣之罪合正典刑謹錄奏聞奏免科率等狀永泰二年奏勑依當}
  - {type: page-break, offset: 1, content: '', id: KR4c0027_WYG_010-12a, image: WYG1071/WYG1071-0573c.png}
  - {type: variant, offset: 2, length: 0, content: '', WYG: 奏永㤗元年配貢上都錢物總一十三萬二千六百三十三貫三十五文四萬一千二十六貫四百八十九文請據見在堪差科徴送九萬一千六百六貫五百四十六文配率請放免以前件如前臣當州前年陷賊一百餘日百姓被焚燒殺掠幾盡去年又賊逼州界防捍一百餘日賊攻永州陷邵州臣州獨全者為百姓捍賊今年賊過桂州又團練六七十日丁壯在軍中老弱餽糧餉三年已來人實疲苦臣一州當嶺南三州之界守捉四十餘處嶺南諸州不與賊戰毎年賊動臣州是境上之州若臣州陷破則湖南為不守之地在於徴賦稍合優矜今使司配率錢物多於去年一倍已上州縣徴納送者多於去年二分已下申請矜減使司未許伏望陛下以臣所奏令有類會諸}
