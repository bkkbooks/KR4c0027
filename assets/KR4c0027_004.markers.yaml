  - {type: variant, offset: 3035, length: 1, content: 次, WYG: 結撰引極三首有序引極興也喻也引之言演極之言盡演意盡物引興極喻故曰引極思元極天曠􅀈莫郎反兮杳泱烏朗反茫氣浩浩兮色蒼蒼上何有兮人不測積清寥兮成元極彼元極兮靈且異思一見兮藐忙招反難致思不從兮空自傷心慅蘇遭反􅻺兮意惶懹思假翼兮鸞鳳乗長風兮上羾古送反揖元氣兮本深實餐至和兮永終日望仙府}
  - {type: page-break, offset: 3035, content: '', id: KR4c0027_WYG_005-1b, image: WYG1071/WYG1071-0534b.png}
  - {type: variant, offset: 3037, length: 0, content: '', WYG: 鑿落兮眇嶔岑雲溶溶兮木棽棽中何有兮人不覩逺欹差兮閟仙府彼仙府兮深且幽望一至兮藐無由望不從兮知如何心混混兮意渾和思假足兮虎豹超阻絶兮凌趠諸教反詣仙府兮從羽人餌五靈兮保清真懷潛君海浩淼兮汩洪溶流藴藴兮濤洶洶下何有兮人不聞深溢漭兮居潛君彼潛君兮聖且神思一見兮藐無因思不從兮空踟蹰心囘迷兮意縈紆思假鱗兮鯤龍激沆湖浪反浪兮奔從拜潛君兮索𤣥寶佩元符兮軌皇道演興四首有序商餘山有太靈古祠傳云豢龍氏祠大帝所立祠在少餘西乳之下邑人修之以祈田予因為招祠訟閔之}
  - {type: page-break, offset: 3037, content: '', id: KR4c0027_WYG_005-2a, image: WYG1071/WYG1071-0534c.png}
  - {type: page-break, offset: 3037, content: '', id: KR4c0027_WYG_005-2b, image: WYG1071/WYG1071-0534d.png}
  - {type: variant, offset: 3038, length: 4, content: 集卷第四, WYG: 以演興辭曰招太靈招太靈兮山之顛山屹􅙣兮水淪漣祠之䄤洛代反墮壞也兮眇何年木脩脩兮草鮮鮮嗟魑魅兮淫厲自古昔兮崇祭禧太靈兮端清予願致夫精誠久愵奴厯反兮㤝㤝處龍反招捃􅀈郎丁反兮呼風風之聲兮起飅飅吹𤣥雲兮散而浮望太靈兮儼而安澹油溶兮都清閑初祀山之乳兮葺太祠木孫為桷兮木母榱雲纓為􅦲莫到反門樞之横梁兮愚木栭洞淵禪兮揭巍巍塗木蘭兮蒔市之反糅蔫被弱草兮禘礿聯仡許訖反渾洪兮馥闐闐管化石兮洞刳天翹修釤兮棹蕪殳靈巫􅀈力軌反兮舞顒干薦天􅀈羊至反字音皆未詳兮酒陽泉獻水芸兮飯霜秈相然反與太靈兮千萬年訟木魅登高峯兮俯幽谷心悴悴倉卒反兮念羣木見樗栲兮相陰覆憐梫榕上七林下余封兮不豐茂見榛梗之森梢閔樅橎上土恭下甫元兮合蠧槢以八反橈橈女教反兮未堅椲韋鬼反桹桹力唐反兮可屈樒美畢反林樽上而寸下兹損兮不香拔丰茸兮已實豈元化之不均兮非雨露之偏殊諒理性之不等於順時兮不如瘱於計反吾心以㝠想終念此兮不怡佁徒充反以書義考之當作侗予莫識天地之意兮願截惡木之根傾梟獍之古巢取闕童以為薪割大木使飛焰徯枯腐之燒焚實非吾心之不仁惠也豈恥夫善惡之相紛且欲畚三河之膏壤禆濟水之清漣將封灌乎善木令橚橚息逐反以梴梴丑然反尚畏乎衆善之未茂兮為衆惡之所挑凌思聚義以為曹令敷扶以相勝取方所以柯如兮吾將出於南荒求壽藤與燔木吾將出於東方祈有德而來歸輔神檉與堅香且憂顒之翩翩又愁㺠以主反之奔馳及陰陽兮不和惡此土之失時令神檉兮不茂使堅香兮不滋重嗟惋兮何補毎齋心以精意切援祝於神明冀感通於天地猶恐衆妖兮木魅魍魎兮山精上誤感於靈心經紿于言兮不聽敢引佩以指水誓吾心兮自明閔岭中郎丁反登羣山以延想吾獨閔乎岭中彼岭中兮何有有天含之玉峰殊閟絶之極顛上聞産乎翠茸欲採之以將壽眇不知夫所從大淵藴藴兮絶嶘士眼反岌岌非梯梁以通險當無路兮可入彼猛毒兮曹聚必憑託乎阻脩常儗儗兮伺人又如何兮不愁彼妖精兮變怪必假見於風雨常閃閃而伺人又如何兮不苦欲仗仁兮託信將徑往兮不難久懹懹以㥄惋上力膺下鳥段却遲迴而永歎懼太靈兮不知以予心為永惟若不可乎遂已吾終保夫直方則必䝉皮篻莫招反以為矢絃母筱以周反以為弧化毒銅以為㦸刺棘竹以為殳得猛烈之材獲與之而並驅且舂刺乎惡毒又引射夫妖怪盡羣類兮使無令善仁兮不害然後採梫榕以駕深收樅橞胡桂反兮梯險躋予身之飄飄承予步之􅀈􅀈以冉反入岭中而登玉峰極閟絶而求翠茸將吾壽兮隨所從思未得兮馬如龍獨翳蔽於山顛久低囘而愠瘀空仰訟於上𤣥彼至精兮必應寧古有而今無將與身而皆亡豈言之而已乎七不如七篇有序元子常自愧不如孩孺不如宵寐又不如病又不如醉有思慮不如靜而閒有喜愛不如忘其情及}
