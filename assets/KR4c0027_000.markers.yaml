  - {type: variant, offset: 0, length: 315, content: 元次山集序史若水曰自吾得元子而文思益古夫太上有質而無文其次有質而有文其次文浮其質文浮其質道之敝也故林放問禮之本孔子大之物之生也先質而後文故質也者生乎天者也文也者生乎人者也質也者先天而作者也文也者後天而述者也故人之扵斯文也不難扵文而難扵質不難扵華而難扵朴不難扵巧而難扵拙余自北逰觀藝扵燕冀之都得元子而異焉欲質不欲野欲朴不欲陋欲拙不欲固卓然自成其家者也唐之大家風斯下矣其駸駸乎中古而不已矣乎其泯而不傳将文末之世爾矣乎兩廣總戎太保武定侯郭公世臣武而好文余謂之元子公讀之若有契焉曰嗟嗟次山浩然剛大憤世疾邪者也安得百十次山以噴俗爾獨文乎㢤遂以余本次而刻之俾余叙其說云爾正徳丁丑孟冬十有三日賜進士出身翰林院編脩國史經筵官湛若水書于西樵之煙霞洞, WYG: 巻}
