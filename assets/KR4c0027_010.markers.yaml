  - {type: variant, offset: 0, length: 3982, content: 唐元次山文集卷第十爲董江夏自陳表臣某言月日勑使某官某乙至賜臣制書示臣云云伏見詔㫖感深驚懼臣豈草木不知天心頃者潼闗失守皇輿不安四方之人無所繫命及永王承制出鎮荆南婦人童子忻奉王教意其然者人未離心臣謂此時可奮臣節王𥘉見臣謂臣可任遂授臣江夏郡太守近日王以冦盗侵偪總兵東下旁牒郡縣皆言巡撫今諸道節度以爲王不奉詔兵臨郡縣疑王之議聞扵朝廷臣則王所授官有兵防禦鄰郡並邑疑臣順王旬日之間致身無地臣本受王之命為王奉詔王所授臣之官為臣許國忠正之分臣實未虧蒼黄之中死㡬無所不圗今日得逹聖聴今臣年六十老母在堂縦未䏻奉義捐生則豈忍兩忘忠孝臣少以文學為諸生所多中年自頥逸在山澤聖明無事甘為外臣無何以鄙僻之故反為人知遂汚官次以至今日臣又頃年貶謫罪未昭洗今所授官復越班秩罷歸待罪是臣之分今陛下以王室艱難寄臣方面亦已忘身許國誓扵皇天伏惟陛下念臣懇至謹因勑使某官奉表以聞臣某云云謹言辭監察御史表上元元年進臣某言臣伏奉某月日勑除臣監察御史裏行依前充山南東道節度叅謀忽承天澤不勝慶喜負荷恩任伏增憂懼臣在至徳元年舉家逃難生㡬扵死出自賊庭逺如海濵敢望冠冕陛下過聴疑臣有才謀可用謂臣以忠正可嘉枉以公詔徴臣延問當時之事言未可取榮寵已殊事未可行授任過次其時以康元狡逆陛下憂勞臣亦不辭疲駑奉宣聖㫖招集士卒師旅未成又逢張瑾姦凶再驚江漢臣恐陛下憂無制變遂曾表請用兵陛下嘉臣懇愚頻降恩詔聖私殊甚特加超擢至今臣自布衣未踰數月官沗風憲任兼戎旅今不勞兵革凶竪伏辜臣不可終以無䏻苟安非望自姦臣逆命扵今六年愧無才䏻苟求祿位分符佩印不知慙羞戮辱及之死将不悔陛下忍而從者其可勝言臣才弱識下非智無謀循涯顧分實自知耻臣老母多病又無弟兄漂流殊郷孤弱相養伏願陛下矜臣愚鈍不合齒扵朝列念臣老母令臣得以奉養則聖朝無辱官之士山澤有純孝之臣不任悃𣢾之至謹遣某官奉表陳請以聞臣云云謹言為吕荆南謝病表臣某言臣自去秋疾疹以至今日轉加羸弱庶事不理某月日附某官口奏請替某月日又進狀陳情未蒙允許伏増憂懼陛下應以臣乆曾驅策未忍替臣臣實憂陛下方隅切湏鎮守臣不䏻起止四十餘日艱虞之際實慮變生今淮西敗散唐鄧危急在臣病癈豈敢偷安伏望天恩即與臣替儻餘生尚在得至闕庭犬馬之心死生願畢不勝懇欵之至謹遣某官奉表陳乞以聞云云請節度使表寳應元年進臣某言臣自以愚弱無堪逺跡江湖全身之外無所兾望陛下過聴徴臣顧問今臣起家數月之内官忝臺省爾来三歲無益効用愧耻之甚在臣無踰臣竊以荆南是國家安危之地伏願陛下不輕易任人陛下若獨任武臣則州縣不理若獨任文吏則戎事多闕自兵興巳来今八年矣使戰争未息百姓勞弊多因任使不當致使敗亡伏惟陛下審擇重臣即日鎮撫全陛下上㳺之地救愚臣不逮之急謹遣某官奉表以聞乞免官歸養表臣某言臣以為才不稱任位過其量不自知分禍辱皆及臣才不如人量實𥚹僻踰越秩次沗辱衣冠人亦有慙臣自知愧臣少以愚弱不願為吏書學自業老扵儒家今迹在軍中日預戎事此過臣才分近扵禍辱者矣臣常恐荒浪失扵禮法自逸山澤預扵生類今穢汚臺省紊亂時憲此過臣才分近扵禍辱者矣伏惟陛下察臣才分不令亂官則貪冐苟進之徒自臣知耻陛下若官不失人則天下自理故曰天下理亂繫之官人臣以為官人之難無敢易者陛下焉可易扵臣㢤臣無兄弟老母乆病所願免官奉養生死願足上不敢汚陛下朝列是臣之忠下不欲貽老母憂懼是臣之孝願全忠孝扵今日免禍辱扵将来伏惟陛下許臣免官許臣奉飬在臣慶幸無以比喻謹遣某官奉表陳請以聞云云謝上表廣徳二年道州進臣某言去年九月勑授道州刺史屬西戎侵軼至十二月臣始扵鄂州授勑牒即日赴任臣州先𬒳西原賊屠䧟節度使巳差官攝刺史兼又聞奏臣在道路待恩命者三月臣以五月二十二日到州上訖耆老見臣俯伏而泣官吏見臣以無菜色城池井邑但生荒草登髙極望不見人煙嶺南數州與臣接近餘冦蟻聚尚未歸降臣見招輯流亡率勸貧弱保守城邑畲種山林兾望秋後少可全活臣愚以為今日刺史若無武略以制暴亂若無文才以救疲弊若不清㢘以身率下若不變通以救時湏一州之人不叛則亂将作矣豈止一州者乎臣料今日州縣堪征稅者無㡬巳破敗者實多百姓戀墳墓者蓋少思流亡者乃衆則刺史宜精選御名擇以委任之固不可拘限官次得之貨賄出之權門者也凡授刺史特望陛下一年問其流亡歸復㡬何田疇墾闢㡬何二年問畜養比𥘉年㡬倍可稅比𥘉年㡬倍三年計其功過必行賞罰則人皆不敢兾望僥倖苟有所求臣實孱弱辱陛下符節陛下必當御名擇臣固宜廢歸山野供給井稅臣不任懇欵之至謹遣某官奉表陳謝以聞再謝上表永樂二年進臣某言某伏奉某月日勑再授臣道州刺史以某月日到州上訖臣前日在官雖百姓不至流亡而歸復者十無一二雖冦盗不犯邉鄙而不䏻兵救鄰州雖賦歛僅䏻供給而有司不無罪狀雖人吏似從教令而風俗未䏻移易臣又多病不無假故水旱灾沴毎嵗不兔疾疫死傷臣州尤甚以臣自訟合抵刑憲聖朝寛貸猶宜奪官陛下過聴重有授任伏恐守㢘譲者以臣為苟安禄位抱公直者以臣為内懐私僻有材識者辱臣扵臺隷之下用刑法者罪臣扵程式之中臣所以不敢即日辭免待陛下按驗虚實然後歸罪有司今四方兵革未寧賦歛未息百姓流亡轉甚官吏侵尅日多實不合使凶庸貪猥之徒凢弱下愚之類以貨賂權勢而為州縣長官伏望陛下特加察問舉其功過必行賞罰以安蒼生誰不自私臣實不敢所言狂直朝夕待罪不任懇𣢾之至謹遣某官奉表陳謝廣徳二年賀赦表臣某言伏奉某月日赦宣示百姓訖伏惟陛下以慈恵馭兆庶以謙譲化天下凢所赦宥皆允人望凡所敦勸皆合大經生識之類不勝大幸臣方領陛下州縣守陛下符節不得稱慶下位蹈舞闕庭不任歡戀之至永泰元年賀赦表臣某言某月日恩赦至州宣示百姓訖百姓貧弱者多勞苦日乆忽蒙恵澤更相喜賀歡呼忭躍不自禁止伏惟陛下増脩典禮弘正紀度勞謙慈恵與人更新此實興王之盛烈明主之至徳戴履天地誰不慶幸臣方守州縣不得蹈舞闕庭無任歡忻之至請省官狀乾元三年上來大夫唐鄧等州縣官右方城縣奮萬餘戸今二百戸已下其南陽向城等縣更破碎扵方城每縣正員官及攝官共有六十人以前件如前自經逆亂州縣殘破唐鄧兩州實為尤甚荒草千里是其疆畎萬室空虚是其井邑亂骨相枕是其百姓孤老寡弱是其遺人哀而恤之尚恐冤怨肆其侵暴實恐流亡今賊冦慿凌鎮兵資其給飬今河路阻絶郵驛在其供承若不觸事救之無以勞勉其苦爲之計者在先省官其方城湖陽等縣正官及攝官并戸口多少具狀如前毎縣伏望量留令并佐官一人餘並望勒停謹錄狀上請給将士父母粮狀上元元年上來大夫當軍将二千人父随子者四人母随子者二十八人以前件如前将士父母等皆因䘮亂不知所歸在扵軍中爲日亦乆夫孝而仁者可與言忠信而忠信者可以全義勇豈有責其忠信使之義勇而不勸之孝慈恤以仁恵今軍中有父母者皆共分衣食先其父母寒餒日甚未甞有辭其将士父母等伏望各量事給其衣食則義有所存恩有所及俾人感勸實在扵此謹錄狀上請收飬孤弱狀上元元年上來大夫當軍孤弱小兒都七十六人張季秀等三十九人無父母周國良等三十七人有父兄在軍以前件狀如前小兒等無父母者郷國淪䧟親戚俱亡誰家可歸傭丐未得有父兄者其父兄自經艱難乆從征戌多以忠義遭逢誅賊有遺孤弱子不忍棄之力相恤飬以至今日乞令諸将有孤兒投軍者許收驅使有孤弱子弟者許令存飬當軍小兒先取回殘及回易雜利給飬謹錄狀上舉吕著作狀寳應元年奏故荆南節度觀察使江陵尹兼御史大夫吕諲姪男季重右見任祕書省著作郎以前件狀吕某立身無私歷官清儉身没之後家無餘財長男㓜小未了家事前件姪質性純厚識理通敏仁孝之性不慙古人自其疾甚不視事向五六十日軍府之事皆季重諮問事無大小處之無情以臣所見季重不獨為賢子弟今時榖湧貴道路多虞漂流異郷無以自給伏望天恩與季重便近州一正員官令其恤飬孤㓜謹錄奏聞伏聴勑㫖奏免科率狀廣徳二年奏勑依當州准勑及租庸等使徴率錢物都計一十三萬六千三百八十八貫八百文一十三萬二千四百八十貫九百文嶺南西原賊未破州已前三千九百七貫九百足賊退後徴率以前件如前臣自到州見庸租等諸使文牒令徴前件錢物送納臣當州𬒳西原賊屠䧟賊停留一月餘日焚燒粮儲屋宅俘掠百姓男女驅殺牛馬老少一州㡬盡賊散後百姓歸復十不存一資産皆無人心嗷嗷未有安者若依諸使期限臣恐坐見亂亡今来未敢徴率伏待進止又嶺南諸州冦盗未盡臣州是嶺北界守捉處多若臣州不安則湖南皆亂伏望天恩自州未破巳前百姓乆負租稅及租庸等使所有徴率和市雜物一切放免自州破巳後除正租正庸及准格式合進奉徴納者請據見在戸徴送其餘科率並請放免容其見在百姓産業稍成逃亡歸復似可存活即請依常例處分伏碩陛下以臣所奏下議有司苟若臣所見愚僻不合時政千亂紀度事渉虚妄忝官尸禄欺上罔下是臣之罪合正典刑謹錄奏聞奏免科率等狀永泰二年奏勑依當州奏永泰元年配供上都錢物總一十三萬二千六百三十三貫三十五文四萬一千二十六貫四百八十九文請據見在堪差科徴送九萬一千六百六貫五百四十六文配率請放免以前件如前臣當州前年䧟賊一百餘日百姓𬒳焚燒殺掠㡬盡去年又賊逼州界防捍一百餘日賊攻永州䧟邵州臣州獨全者為百姓捍賊今年賊過桂州又團練六七十日丁壯在軍中老弱餽粮餉三年已來人實疲苦臣一州當嶺南三州之界守捉四十餘處嶺南諸州不與賊戰毎年賊動臣州是境上之州若臣州䧟破則湖南為不守之地在扵徴賦稍合優矜今使司配率錢物多扵去年一倍巳上州縣徴納送者多扵去年二分已下申請矜減使司未許伏望陛下以臣所奏令有司類㑹諸經賊䧟州㨿合差科户臣當州每年除正租正庸外更合配率㡬錢庶免使司随時加减庶免百姓每歲不安其今年䡖貨及年支米等臣請准狀處分謹錄奏聞論舜廟狀永泰二年奏勑依右謹按地圗舜陵在九疑之山舜廟在太陽之溪舜陵古老以失太陽溪今不知處秦漢巳来置廟山下年代寖逺祠宇不存每有詔書令州縣致祭奠酹荒野恭命而巳豈有盛徳大業百王師表殁扵荒裔陵廟皆無臣謹遵舊制扵州西山上已立廟訖特乞天恩許蠲免近廟一兩家令嵗時拂灑示為恒式豈獨表聖人至徳及扵萬代實欲彰陛下玄澤及扵無窮謹録奏聞舉處士張季秀狀永泰二年奏勑依臣州僻在嶺隅其實邉裔土風貪扵貨賄舊俗多習史事獨季秀䏻介直自全退守㢘譲文學為業不求人知寒餒切身彌更守分貴其所尚願老山林臣切以兵興巳来人皆趋競苟利分寸不愧其心則如季秀者不可不加褒異臣特望天恩令州縣取其穏便與造草舍十數間給水田一兩頃免其當戸徭役令得保遂其志此實聖朝旌退譲之道亦為士庶識㢘耻之方謹錄奏聞唐元次山文集卷第十, WYG: ''}
