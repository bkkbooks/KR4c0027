  - {type: line-break, offset: 0, content: '', id: KR4c0027_SBCK_005-1a01}
  - {type: variant, offset: 0, length: 1218, content: 唐元次山文集卷第五引極三首有序引極興也喻也引之言演極之言盡演意盡物引興極喻故曰引極思元極天曠漭莫朗反兮杳泱鳥朗反茫氣浩浩兮色蒼蒼上何有兮人不測積清寥兮成元極彼元極兮靈且異思一見兮藐忙招反難致思不從兮空自傷心慅蘇遭反􅻺兮意惶懹思假翼兮鸞鳯乘長風兮上羾古送反揖元氣兮本深實湌至和兮永終日望仙府山鑿落兮眇嶔岑雲溶溶兮木棽棽中何有兮人不覩逺欹差兮閟仙府彼仙府兮深且幽望一至兮藐無由望不從兮知如何心混混兮意渾和思假足兮虎豹超阻絶兮凌趠諸教反詣仙府兮從羽人餌五靈兮保清真懐潜君海浩淼兮汩洪溶流藴藴兮濤洶洶下何有兮人不聞深溢漭兮居潜君彼潜君兮聖且神思一見兮藐無因思不從兮空踟蹰心囘迷兮意縈紆思假鱗兮鯤龍激沆湖浪反浪兮奔從拜潜君兮索玄寳佩元符兮軌皇道演興四首有序啇餘山有太靈古祠傳云豢龍氏祠大帝所立祠在少餘西乳之下邑人修之以祈田予因為招祠訟閔之文以演興辭曰招太靈招太靈兮山之顛山屹屼兮水淪漣祠之䄤洺代反堕壞也兮眇何年木脩脩兮草鮮鮮嗟魑魅兮淫厲自古昔兮崇祭禧太靈兮端清予願致夫精誠乆愵奴歷反兮㤝㤝處龍反招捃郎丁反兮呼風風之聲兮起飀飀吹玄雲兮散而浮望太靈兮儼而安澹油溶兮都清閑𥘉祀山之乳兮葺太祠木孫為桷兮木母榱雲纓為􅦲莫到反門樞之横梁兮愚木㧫洞淵禪兮掲巍巍塗水蘭兮蒔市之反糅焉𬒳弱草兮禘礿聮仡許訖反渾洪兮馥闐闐管化石兮洞刳天翹脩釤兮掉蕪殳靈巫力軌反兮舞顒于薦天羊至反字音皆未詳兮酒陽泉獻水芸兮飯霜秈相然反與太靈兮千萬年訟木魅登髙峯兮俯幽谷心悴悴倉卒反兮念群木見樗栲兮相隂覆憐梫榕上七林下余封兮不豐茂見榛梗之森梢閔樅橎上土恭下甫元兮合蠧槢以八反橈橈女教反兮未堅椲韋鬼反桹桹力唐反兮可屈樒羙五反樽上而寸下兹損兮不香抜丰茸兮巳實豈元化之不均兮非雨露之偏殊諒理性之不等扵順時兮不如瘱扵計反吾心以冥想終念此兮不怡佁徒充反以書義考之當作侗予莫識天地之意兮願截惡木之根傾梟獍之古巢取御名童以為薪割大木使飛熖徯枯腐之燒焚實非吾心之不仁惠也豈耻夫善惡之相紛且欲畚三河之膏壤禆濟水之清漣将封灌乎善木令橚橚息逐反以梃梃丑然反尚畏乎衆善之未茂兮為衆惡之所挑凌思聚義以為曹令敷扶以相勝取方所以柯如兮吾将出扵南荒求夀藤與燔本吾将出扵東方祈有徳而来歸輔神檉與堅香且憂顒之翩翩又愁㺠以王反之奔馳及隂陽兮不和惡此土之失時今神檉兮不茂使堅香兮不滋重嗟惋兮何𥙷每齋心以精意切援祝扵神明冀感通於天地猶恐衆妖兮水魅魍魎兮山精上誤惑扵靈心經紿于言兮不聴敢引佩以指水誓吾心兮自明閔岭中郎丁反群山以延想吾獨閔乎岭中彼岭中兮何有有天含之玉峰殊閟絶之極顛上聞産乎翠茸欲採之以将夀眇不知夫所從大淵藴藴兮絶嶘士眼反岌岌非梯梁以通險當無路兮可入彼猛毒兮曹聚必慿託乎阻脩常儗儗兮伺人又如何兮不愁彼妖精兮變恠必假見扵風雨常閃閃而伺人又如何兮不苦欲仗仁兮託信将徑徃兮不難乆懹懹以㥄惋上力膺下鳥段却遲廻而永歎懼太靈兮不知以予心為永惟若不可乎遂巳吾終保夫直方則必蒙皮篻莫招反以為矢絃母筱以周反以為弧化毒銅以為㦸刺棘竹以為殳得, WYG: ''}
