  - {type: variant, offset: 0, length: 104, content: 唐元次山文集拾遺縣令箴古今所貴有土之官當其選授何嘗不難為其動静是人禍福為其嘘噏作人寒燠煩則人怨猛則人懼勿以賞罰因其喜怒太寛則慢豈䏻行令太簡則踈難與為政既明且㫁直焉無情清而且恵果然必行或曰闗由上官事不自我辭譲而, WYG: ''}
