front:
  text: 唐元次山文集卷第四
  hash: sha256:fe35fe5adf612046142211b0c64fc0ccf95d14f4e8f73bb35dcc2fbd372801bc
  markers:
  - {type: page-break, offset: 0, content: '', id: KR4c0027_SBCK_004-1a}
body:
  text: 舂陵行有序癸卯嵗漫叟授道州刺史道州舊四萬餘戶經賊巳來不滿四千大半不勝賦稅到官未五十日承諸使徴求符牒二百餘封皆曰失其限者罪至貶削于戲若悉應其命則州縣破亂刺史欲焉逃罪若不應命又即獲罪戾必不免也吾將守官靜以安人待罪而巳此州是舂陵故地故作舂陵行以達下情軍國多所須切責在有司有司臨郡縣刑法竟欲施供給豈不憂徴斂又可悲州小經亂亡遺人實困疲大鄉無十家大族命單羸朝餐是草根暮食是木皮出言氣欲絶言速行步遲追呼尚不忍况乃鞭朴之郵亭傳急符來往迹相追更無寬大恩但有迫促期欲令鬻兒女言發恐亂隨悉使索其家而又無生資聽彼道路言怨傷誰復知去冬山賊來殺奪幾無遺所願見王官撫養以惠慈奈何重驅逐不使存活為安人天子命符節我所持州縣忽亂亡得罪復是誰逋緩違詔令蒙責固所宜前賢量守分惡以禍福移亦云貴守官不愛能適時顧惟孱弱者正直當不虧何人采國風吾欲獻此辭賊退示官吏有序癸卯嵗西原賊入道州焚燒殺掠幾盡而去明年賊又攻永州破邵不犯此州邉鄙而退豈力能制敵歟蓋蒙其傷憐而巳諸使何為忍苦徴斂故作詩一篇以示官吏昔嵗逄太平山林二十年泉源在庭戶洞壑當門前井稅有常期日晏猶得眠忽然遭丗變數嵗親戎旃今來典斯郡山夷又紛然城小賊不屠人貧傷可憐是以陷鄰境此州獨見全使臣將王命豈不如賊焉今彼徴斂者迫之如火煎誰能絶人命以作時世賢思欲委符節引竿自刺船將家就魚麥歸老江海邉逰右溪勸學者小溪在城下形勝堪賞愛尤宜春水滿水石更殊怪長山勢回合井邑相縈帶石林繞舜祠西南正相對階庭無爭訟郊境罷守衛時時溪上來勸引辭學輩今誰不務武儒雅道將廢豈忘二三子旦夕相勉勵逰潓泉示泉上學者顧吾漫浪久不欲有所拘每到潓泉上情性可安舒草堂在山曲澄瀾涵階除松竹隂幽徑清源湧坐隅築塘列圃畦引流灌時𬞞復在郊郭外正堪靜者居愜心則自適喜尚人或殊此中若可安不佩銅虎符石魚湖上作有序潓泉南上有獨石在水中狀如逰魚魚凹處修之可以䝻舉魚反酒水涯四匝多欹石相連石上堪人坐水能浮小舫載酒又能繞石魚洄流乃命湖曰石魚湖鐫銘于湖上顯示來者又作詩以歌之吾愛石魚湖石魚在湖裏魚背有酒樽繞魚是湖水兒童作小舫載酒勝一杯座中令酒舫空去復滿來湖岸多欹石石下流寒泉醉中一盥漱快意無比焉金玉吾不須軒冕吾不愛且欲坐湖畔石魚長相對宴湖上亭作廣亭蓋小湖湖亭實清曠軒窗幽水石怪異尤難狀石樽能寒酒寒水宜𥘉漲岸曲坐客稀杯浮上搖漾逺風入簾幕淅瀝吹酒舫欲去未回時飄飄正堪望酣興思共醉促酒更相向舫去若驚鳬溶瀛滿湖浪朝來暮忘返暮歸獨惆悵誰肯愛林泉從吾老湖上引東泉作東泉人未知在我左山東引之傍山來垂流落庭中宿霧含朝光掩映如殘虹有時散成雨飄灑隨清風衆源發淵竇殊怪皆不同此流又髙懸􅡶􅡶孚袁反在長空山林何處無兹地不可逢吾欲解纓佩便為泉上翁登白雲亭出門上南山喜逐松徑行窮髙欲極逺始到白雲亭長山繞井邑登望宜新晴洲渚曲湘水縈回隨郡城九疑千萬峯嵺嵺天外青煙雲無逺近皆傍林嶺生俯視松竹間石水何幽清涵映滿軒戶姢姢如鏡明何人病惛濃積醉且未醒與我一登臨為君安性情潓陽亭作有序𥘉得潓泉則為亭于泉上因開簷霤又得石渠泉渠相宜亭更加好以亭在泉北故命之曰潓陽亭問吾常宴息泉上何處好獨有潓陽亭令人可終老前軒臨潓泉慿几漱清流外物自相擾淵淵還復休有時出東戶更欲簷下坐非我意不行石渠能留我峯石若鱗次欹垂復旋回為我引潓泉泠泠簷下來天寒宜泉溫泉寒宜大暑誰到潓陽亭其心肯思去夜宴石魚湖作風霜雖慘然出逰熙天正平聲登臨日暮歸置酒湖上亭髙燭照泉深光華溢軒楹如見海底日曈曈日始明徒紅反始欲生夜寒閉窗戶石溜何清泠若在深洞中半崖聞水聲醉人疑舫影呼指遞相驚何故有雙魚隨吾酒舫行醉昏能誕語勸醉能忘情坐無拘忌人勿限醉與醒招陶别駕家陽華作海內猒兵革騷騷十二年陽華洞中人似不知亂焉誰能家此地終老可自全草堂背巖洞幾峯軒戶前清渠匝庭堂出門仍灌田半崖盤石徑髙亭臨極顛引望見何處逶迤隴北川杉松幾萬株蒼蒼滿前山巖髙曖華陽飛溜何潺潺洞深迷逺近但覺多洄淵晝逰興未盡日暮不欲眠探燭飲洞中醉昏漱寒泉始知天下心耽愛各有遍陶家世髙逸公忍不獨然無或畢婚嫁竟為俗務牽題孟中丞茅閣小山為郡城隨水能縈紆亭亭最髙處今是西南隅杉大老猶在蒼蒼數十株垂隂滿城上枝葉何扶踈乃知四海中遺事誰謂無及觀茅閣成始覺形勝殊慿軒望熊湘雲榭連蒼梧天下正炎熱此然氷雪俱客有在中坐頌歌復何如公欲舉遺材如此佳木歟公方庇蒼生又如斯閣乎請逹謡頌聲願公且踟蹰劉侍御月夜宴會我從蒼梧來將耕舊山田踟蹰為故人且復停歸船日夕得相從轉覺和樂全愚愛涼風來明月正滿天河漢望不見幾星猶粲然中夜興欲酣改坐臨清川未醉恐天旦更歌促繁絃歡娛不可逢請君莫言旋别孟校書吾聞近南海乃是魑魅鄉忽見孟夫子歡然逰此方忽喜海風來海帆又欲張漂漂隨所去不念歸路長君有失母兒愛之似阿陽始解隨人行不欲離君傍相勸早旋歸此言慎勿忘别何員外誰能守清躅誰能嗣丗儒吾見何君饒為人有是夫黜官二十年未曾暫﨑嶇終不病貧賤寥寥無所拘忽然逢知巳數月領官符猶是尚書郎收賦來江湖人皆悉蒼生隨意極所須比盜無兵甲似偷又不如公能獨寬大使之力自輸吾欲探時謡為公伏奏書但恐抵忌諱未知肯聽無不然且相送醉歡于坐隅窊樽詩巉巉小山石數峰對窊亭窊石堪為樽狀類不可名巡回數尺間如見小蓬瀛樽中酒𥘉漲始有島嶼生豈無日觀峯直下臨滄𬈑愛之不覺醉醉卧還自醒醒醉在樽畔始為吾性情若以形勝論坐隅臨郡城平湖近階砌逺山復青青異木幾十株枝條冒簷楹盤根滿石上皆作龍蛇形酒堂貯釀器戶牖皆罌瓶此樽可常滿誰是陶淵明登九疑第二峯九疑第二峯其上有仙壇杉松映飛泉蒼蒼在雲端何人居此處云是魯女冠不知幾百嵗宴坐餌金丹相傳羽化時雲鶴滿峯巒婦中有髙人相望空長歎宿洄溪翁宅長松萬株繞茅舍怪石寒泉近簷下老翁八十猶能行將領兒孫行拾稼吾羡老翁居處幽吾愛老翁無所求時俗是非何足道得似老翁吾即休石魚湖上醉歌有序漫叟以公田米釀酒因休暇則載酒于湖上時取一醉歡醉中據湖岸引臂向魚取酒使舫載之遍飲坐者意疑倚巴丘酌于君山之上諸子環洞庭而坐酒舫泛泛然觸波濤而往來者乃作歌以長之石魚湖似洞庭夏水欲滿君山青山為樽水為沼酒徒歷歷坐洲島長風連日作大浪不能廢人運酒舫我持長瓢坐巴丘酌飲四坐以散愁宿無為觀九疑山深幾千里峰谷﨑嶇人不到山中舊有仙姥家十里飛泉繞丹竈如今道士三四人茹芝鍊玉學輕身霓裳羽蓋傍臨壑飄飄似欲來雲鶴無為洞口作無為洞口春水滿無為洞傍春雲白愛此踟蹰不能去令人悔作衣冠客洞傍山僧皆學禪無求無欲亦忘年欲問其心不能問我到此中得無悶朝陽巖下歌朝陽巖下湘水深朝陽洞口寒泉清零陵徒有先賢傳水石為娛安可羡長歌一曲留相勸説洄溪招退者在州南江華縣長松亭亭滿四山山間乳竇流清泉洄溪正在此山裏乳水松膏常灌田松膏乳水田肥良稻苗如蒲米粒長麋色如珈玉液酒酒熟猶聞松節香溪邉老翁年幾許長男頭白孫嫁女問言只食松田米無藥無方向人語浯溪石下多泉源盛暑大寒冬大溫屠蘇宜在水中石洄溪一曲自當門吾今欲作洄溪翁誰能住我舍西東勿憚山深與地僻羅浮尚有葛仙翁宿丹崖翁宅扁舟欲到瀧口湍春水湍瀧上水難投竿朱泊丹崖下得與崖翁盡一歡丹崖之亭當石顛破竹半山引寒泉泉流掩映在木杪有若白鳥飛林間往往隨風作霧雨濕人巾履滿庭前丹崖翁愛丹崖棄官幾年崖下家兒孫棹船抱酒甕醉裏長歌揮釣車吾將求退與翁逰學翁歌醉在魚舟官吏隨人往未得却望丹崖慙復羞欵乃曲五首有序大曆丁未中漫叟以軍事詣都使還州逢春水舟行不進作欵乃五曲舟子唱之蓋欲取適于道路耳詞曰偶存名迹在人間順俗與時未安間來謁大官兼問政扁舟却入九疑山湘江二月春水平滿月和風宜夜行唱橈欲過平陽戌守吏相呼問姓名千里楓林煙雨深無朝無暮有猿吟停橈靜聽曲中意好是雲山韶濩音零陵郡北湘水東浯溪形勝滿湘中溪口石顛堪自逸誰能相伴作漁翁下瀧船似入深淵上瀧船似欲升天瀧南始到九疑郡應絶髙人乘興船唐元次山文集卷第四
