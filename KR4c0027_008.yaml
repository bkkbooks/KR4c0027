front:
  text: 唐元次山文集卷第八
  hash: sha256:ce7b759c230d4df90ead3fce20f47f3423af548d74c3720eb4c0c3adc84c8b63
  markers:
  - {type: page-break, offset: 0, content: '', id: KR4c0027_SBCK_008-1a}
body:
  text: 時議三篇有表臣某言臣自以昏庸無堪逸浪江海陛下忽降公詔逺徴愚臣陸下豈不以凶逆未除盜賊屢起百姓勞苦力用不足將社稷大計與天下圖之者乎荒野賤臣始見軒陛又拘限忌諱不能悉下情以上聞則陛下又安用煩勞車乘招禮賢異臣實不能當君子之羞受小人之辱故編輿皂之説為三篇名曰時議敢以上聞抵冒天威謹伏待罪臣結頓首謹上乾元二年九月日前進士元結表上時議上篇時之議者或相問曰往年逆亂之兵東窮江海南極淮漢西抵秦塞北盡幽都今趙衛之疆悉為盜有凶勇之徒在四方者幾百餘萬如屯守二京從衛魁帥者不計當時之兵可謂強矣當時人心巳不固矣天子獨以數騎僅至靈武引聚餘弱慿陵強冦頓軍岐陽師及渭西曾不踰時竟摧堅鋭復兩京逃降逆類悉收河南州縣今河北隴隂姦逆尚餘今山谷江湖稍多亡命今所在盜賊屢犯州縣今天下百姓咸轉流亡今臨敵將士多喜奔散今賢士君子不求任使天子往在靈武至于鳳翔無今日兵革而能勝敵無今日禁制而無亡命無今日威令而盜賊不起無今日財用而百姓不亡無今日封賞而將士不散無今日朝廷而人思任使何哉豈天子能以弱制強不能以強制弱豈天子能以危求安而忍以未安忘危時之議者或相對曰此非難言甚易言矣天子往年悲恨陵廟為凶逆傷汚怨憤上皇忽南幸巴蜀哀傷宗戚多見誅害驚惶聖躬動息無所是以勤勞不辭親撫士卒與人權位信而不疑渴聞忠直過則喜改如此所以能以弱制強以危求安今天子重城深宫謙和而居冕旒清晨纓佩而朝太官具味當時而食太常修樂和聲而聽軍國機務參詳而進萬姓疾苦時或不聞而廄有良馬宫有美女輿服禮物日月以備休符佳瑞相繼而有朝廷歌頌盛德大業四方貢賦尤異品物公族􅊚戚喜荷帝恩諧臣戲官怡愈天顔而文武大臣至于公卿庶官皆權位爵賞名實之外自已過望此所以不能以強制弱忍以未安忘危若天子能視今日之安如靈武之危事無大小皆若靈武何冦盜強弱可言當天下日無事矣時論中篇時之議者或相謂曰吾聞道路云云説士人共自謀曰昔我奉天子拒凶逆勝敵則家國兩全不勝則家國兩亡所以生死決戰是非極諌今吾屬名位巳重財貨巳足爵賞巳厚勤勞巳極天下若安吾何苦哉天下若不安吾屬外無仇讎相害內無窮賤相迫何苦更當鋒刃以近死乎何苦更忤人主以近禍乎又聞之曰嗚呼吾州里有忠義之者仁信之者方直之者今或有病父老母孤兒寡婦如身能存者力役乞丐凍餒不足况于死者父母妻子人誰哀之又聞曰今天下殘破蒼生危急受賦役者多寡弱貧獨流亡死生悲憂道路亦極矣天下若安我等豈無隴畝以自處若不安我等不復以忠義仁信方直死矣縱有益于我者安則隨之人且如此其然何故時之議者相對曰今國家非欲其然蓋失于太明太信而然耳夫太明則見其內情將藏內情則罔惑生焉罔上惑下能令必信信可必矣故太信焉太信之中至姦元惡卓然而存如此使朝廷遂亡公直天下遂失忠信蒼生遂益冤怨如公直亡矣忠信失矣冤怨生矣豈天子大臣之所喜乎將欲理之能無端內吾屬議于野者又何所及時議下篇時之議者或相問曰今天子思安蒼生思滅姦逆思致太平方力圗之非不勤勞于今四年而説者異之何哉時之議者或相對曰如天子所思如説者所異天子大臣非不知之凡有制誥皆嘗言及言雖殷勤事皆不行前後再三頗類諧戲今或有仁恤之詔憂勤之誥人皆族立黨語指而議之其由何哉以言而不行之故也天子不知其然以為言雖不行足堪沮勸嗚呼沮勸之道在明審均當而必行也必不行矣有言何為自太古巳來致理興化未有言之不行而能至矣若天子能追行巳言之令必行將來之法且免天下無端雜徭且除天下隨時弊法且去天下拘忌煩令必任天下賢異君子屏斥天下姦邪小人然後推仁信威令與之不惑此帝王常道何為不及管仲論自兵興巳來今三年論者多云得如管仲者一人以輔人主當見天下太平矣元子異之曰嗚呼何是言之誤耶彼管仲者人耳止可與議私家畜養之計止可以修鄉里畎澮之事如此仲當少容與焉至如相諸侯材量亦似不足致齊及霸材量極矣使仲見帝王之道興國之禮則天子之國不衰諸侯之國不盛如曰不然請有所説仲之相齊及齊疆富則合請其君恢復王室節正諸侯君若惑之則引禍福以喻之如約諸侯之説君既聽矣然後約諸侯曰今王室將卑諸侯更疆文王風化殘削向盡武王疆域割奪無幾禮樂不知其由征伐何因而出我是故謹疆域勉日夜望振兵威可臨列國得與諸侯會盟一旦能新復天子之正朔更定天子之封畿上奉天子復先王之風化下令諸侯復先公之制度以為何如若皆不從我則以兵臨于魯魯不敢不從則與魯西臨宋鄭宋鄭從則與三國北臨燕衛燕衛從則與諸國西臨秦晉秦晉從則與七國以尺簡約吳楚吳楚從則天下無不從之國然後定約若有果不從者則約從者曰吾屬以禮義尊天子以法度正諸侯使小國不常患弱大國不敢怙疆此誠長世之䇿若天子國亡則諸侯交爭兵戈相臨誰為強弱則安得世世禮讓相服宗廟血食我是故力勸諸侯尊天子今謀國猶豫宜往問之君不從約則與諸侯率兵伐之分其疆土遷其子孫留百里之地奉其宗社下為諸侯廣子孫之業上為天子除不順之臣何如如此則諸侯誰敢不從然後定天子封畿諸侯疆域輿服器玩禮樂法度征賦貢輸自齊魯節正節正即定乃共盟曰有二約者當請命天子廢其驕凶以立恭順廢其荒惑以立明哲敢不聽者伐而分之如𥘉約制定于是諸侯先各造邸于天子之都諸侯乃相率朝覲已而從天子齋戒拜宗廟禮畢天子誓曰于戲王室之卑久矣豫不敢望皇天后土之所覆載將旦暮皂隸于諸侯不可則願全肌骨下見先王今諸侯不忘先王之大德不忘先公之忠烈共力正王室俾豫主先王宗祀豫若昏荒淫虐不納諫諍失先王法度上不能奉宗祀下不能安人民爾諸侯當理爾軍卒修爾矛戟約爾列國罪豫凶惡嗣立明辟豫若能日勉孱弱力遵先王法度上奉宗祀下安人民爾諸侯當保爾疆域安爾人民修爾貢賦共子郊祀豫有此誓豈云及豫將及來世豫敢以此誓誓于宗廟豫敢以此誓誓于天地諸侯聞天子之誓相率盟曰天子有誓俾我諸侯世世得力扶王室使先王先公德業永長諸侯其各銘天子之誓傳之後嗣我諸侯重自約曰諸侯有昏惑當如前盟若天子昏惑不嗣虐亂天下諸侯當力共規諷諌諍如甚不可則我諸侯共率禮兵及王之畿復諫諍如𥘉又甚不可進禮兵及王之郊終不可進禮兵及王之宫兵及王之宫矣當以宗廟之憂咨之當以人民之怨咨之當以天子昔誓咨之當以諸侯昔盟咨之以不敢欺先王先公告之以不敢欺皇天后土告之然後如天子昔誓如諸侯昔盟使管仲能如此則周之天子未為奴矣諸侯之國則未亡矣秦于天下未至是矣如曰仲才及也君不從也仲智及也時不可也則仲曽是謀也乎君不從之也歟仲曾是為也乎時之不可也歟况今日之兵不可以禮義節制不可以盟誓禁止如仲之輩欲何為矣文粹矣作乎寱五計反論元子天寶中曾預宴于諌大夫之座酒盡而無以續之大夫歎曰諌議散冗者貧無以繼酒嗟哉元子醉中議之曰大夫頗能用一謀令大夫尊重如侍中威權等司隸何若大夫問謀對曰得寱婢一人在人主左右以寱言先諷則可請有所説大夫不聞古有邰土來反侯侯家得寱婢寐則寱言言則侯輒鞭之如是一歲婢寱如故侯無如婢何有夷奴每厭勞辱寐則假寱其言似不怨而若忠信侯聞問之則曰素有寱病寐中寱言非所知也引寱婢自辨辭説云云侯疑學婢鞭之不止髠之鉗之奴寱愈甚奴于是重窺侯意先事寱説説侯之過警以禍福侯又無如奴何客有知侯禍機因寱奴之先扣侯門諌侯以改過免禍侯納客為上賔復方六反其奴命曰寱良氏子孫世在于邰大夫誠能學奴效婢假寱言以譏諫人主悔過追誤與天下如新大夫見尊重威權何止侍中司隸大夫乃歎曰嗚呼吾謂今之士君子曾不如邰侯夷奴丐論天寶戊子中元子逰長安與丐者為友或曰君友丐者不太下乎對曰古人鄉無君子則與雲山為友里無君子則與松竹為友坐無君子則與琴酒為友出逰于國見君子則友之丐者今之君子吾恐不得與之友也丐者丐論子能聽乎吾既與丐者相友喻求罷丐友相喻曰子羞吾為丐耶有可羞者亦曾知之未也嗚呼于今之世有丐者丐宗屬于人丐嫁娶于人丐名位于人丐顔色于人甚者則丐權家奴齒以售邪妄丐權家婢顔以容媚惑有自富丐貧自貴丐賤于刑丐命命不可得就死丐時就時丐息至死丐全形而終有不可丐者更有甚者丐家族于僕圉丐性命于臣妾丐宗廟而不取丐妻子而無辭有如此者不為羞哉吾所以丐人之棄衣丐人之棄食提罌倚杖在于路傍且欲與天下之人為同類耳不然則無顔容行于人間夫丐衣食貧也以貧乞丐心不慙迹與人同示無異也此君子之道君子不欲全道耶幸不在山林亦宜且罌杖隨我作丐者之狀貌學丐者之言辭與丐者之相逢使丐者之無耻庶幾世始能相容吾子無矯然取不容也于戲丐者言語如斯可為編為丐論以輔時規漫論并序乾元巳亥至寶應壬寅蒙時人相誚議曰元次山嘗漫有所為且漫辭官漫聞議云云因作漫論論曰世有規檢大夫持規之徒來問叟曰公漫然何為對曰漫為何似然對曰漫然規者怒曰人以漫指公者是他家惡公之辭何得翻不惡漫而稱漫為漫何檢括漫何操持漫何是非漫不足凖漫不足規漫無所用漫無所施漫也何效漫焉何師公髮巳白無終惑之叟俯首而謝曰吾不意公之説漫而至于此意如所説漫焉足耻吾當于漫終身不羞著書作論當為漫流于戲九流百氏有定限耶吾自分張獨為漫家規檢之徒則奈我何化虎論都昌縣大夫張粲君英將之官與其友賈德方元次山别且曰吾邑多山澤可致麕鹿為二賢羞賔客何如及到官書與二友曰待我化行旬月使虎為鹿豺為麕梟為鷓鴣蝦蟇為兔將以豐江外庖厨豈獨與德方次山之羞賔客也德方對曰嗚呼兵興嵗久戰爭日甚生人怨痛何時休息君英之化豈及豺虎將恐虎窟公城豺逰公庭梟集公楹群蛙匝公而鳴敢以不然之論返化君英賈德方報君英化虎之論宜豈直望化虎哉次山請啇之君英所謂待吾化豺虎然後羞于屬也其意蓋欲待朝廷化小人為君子化諂媚為公直化姦逆為忠信化競進為退讓化刑法為典禮化仁義為道德使天下之人皆涵純朴豈止化虎而羞我哉德方未量君英耶次山故編所言為化虎之論辨惑二篇有序議者多惑朱公叔第五興先所為故引之作辨惑二篇以喻惑者其意亦欲將辨惑與時人為勸懼之方上篇昔南陽朱公叔為冀州刺史百城長吏多懼罪自去公叔不舉法彈理之聽其去官而已惑者曰公叔才逹者也苟能威畏苟能逃罪當下自新之令不問前時之過公叔之為也是哉辨者曰嗚呼先王作法令蓋欲禁貪邪絶凶暴使人不得苟免是以惡蒙異丗之誅善及子孫之賞若法令不行則無以沮勸苟失沮勸則賞罰何為嗚呼先王懼人民自相侵害故官人以理之加其爵祿使其富貴蓋為其能理養人民者也彼乃絶理養之心以殺奪為務去而不理而曰是乎豈有冠冕軒車佩符持節取先王典禮以為盜具將天下法令而為盜資乎致使金寶千囊財貨百車令彼盜類各為富家公叔不理奈何咨嗟下篇昔第五興先為詔使舉奏刺史二千石蒙削免者甚衆興先以奉使稱職獲遷官焉惑者曰興先能紏劾過惡直哉使臣遷秩次也宜乎辨者曰夫理人貴久其法明其禁使人知常且長也漢家法不常耶禁不長耶何得興先暴將威令急操刑獄使蒙戮辱者如斯多乎若漢家天下法禁皆如冀州四方詔使皆如興先則亂生于令出禍作于遣使誰為惑者聽我啇之嗚呼畏陷人于法故先于禁制有抵犯者理而刑之示其必常也人始知懼先王欲人自御名故為善者賞之俾人勸而無懼然後乃理所以施賞罰于人民令似衣冠不可脫去如此殷勤乃能措刑殺致太平耳故曰賞善而不罰惡則亂罰惡而不賞善亦亂賞罰不行與過差必止若如此漢家之法在乎興先之為是也乎衆人之惑喻無喻友天寶丁亥中詔徴天下士人有一藝者皆得詣京師就選相國晉公林甫以草野之士猥多恐泄漏當時之機議于朝廷曰舉人多卑賤愚瞶五拜反不識禮度恐有良士反言汙濁聖聽于是奏待制者悉令尚書長官考試御史中丞監之試如常吏如吏部試詩賦論䇿巳而布衣之士無有第者遂表賀人主以為野無遺賢元子時在舉中將東歸鄉人有苦貧賤者欲留長安依記時權徘徊相謀因諭之曰昔丗巳來共尚丘園潔白之士蓋為其能外獨自全不和不就飢寒切之不為勞苦自守窮賤甘心不辭忽天子有命聘之玄纁東帛以先意薦論擁篲以導道欲有所問如咨師傅聽其言則可為規戒考其行則可為師範用其材則可約經濟與之權位乃社稷之臣君能忘此而欲隨逐駑駘入棧櫪中食下廄藖麧上侯辨反下下沒反為人後騎負皂隸受鞭䇿耶人生不方正忠信以顯榮則介潔靜和以終老鄉人于是與元子偕歸于戲貴不專權罔惑上下賤能守分不苟求取始為君子因喻鄉人得及林甫言意可存編為喻友唐元次山文集卷第八
