front:
  text: 唐元次山文集卷第五
  hash: sha256:8b449ba60d016b7750349245b2dbb42406838460945077ff9f8e06e7c1b49785
  markers:
  - {type: page-break, offset: 0, content: '', id: KR4c0027_SBCK_005-1a}
body:
  text: 引極三首有序引極興也喻也引之言演極之言盡演意盡物引興極喻故曰引極思元極天曠漭莫朗反兮杳泱鳥朗反茫氣浩浩兮色蒼蒼上何有兮人不測積清寥兮成元極彼元極兮靈且異思一見兮藐忙招反難致思不從兮空自傷心慅蘇遭反􅻺兮意惶懹思假翼兮鸞鳯乘長風兮上羾古送反揖元氣兮本深實餐至和兮永終日望仙府山鑿落兮眇嶔岑雲溶溶兮木棽棽中何有兮人不覩逺欹差兮閟仙府彼仙府兮深且幽望一至兮藐無由望不從兮知如何心混混兮意渾和思假足兮虎豹超阻絶兮凌趠諸教反詣仙府兮從羽人餌五靈兮保清真懷潛君海浩渺兮汩洪溶流藴藴兮濤洶洶下何有兮人不聞深溢漭兮居潛君彼潛君兮聖且神思一見兮藐無因思不從兮空踟蹰心回迷兮意縈紆思假鱗兮鯤龍激沆湖浪反浪兮奔從拜潛君兮索玄寶佩元符兮軌皇道演興四首有序啇餘山有太靈古祠傳云豢龍氏祠大帝所立祠在少餘西乳之下邑人修之以祈田豫因為招祠訟閔之文以演興辭曰招太靈招太靈兮山之顛山屹屼兮水淪漣祠之䄤洺代反墮壞也兮眇何年木修修兮草鮮鮮嗟魑魅兮淫厲自古昔兮崇祭禧太靈兮端清豫願致夫精誠久愵奴歷反兮㤝㤝處龍反招捃郎丁反兮呼風風之聲兮起飀飀吹玄雲兮散而浮望太靈兮儼而安淡油溶兮都清間𥘉祀山之乳兮葺太祠木孫為桷兮木母榱雲纓為􅦲莫到反門樞之橫梁兮愚木㧫洞淵禪兮揭巍巍塗水蘭兮蒔市之反糅焉𬒳弱草兮禘礿聮仡許訖反渾洪兮馥闐闐管化石兮洞刳天翹修釤兮掉蕪殳靈巫力軌反兮舞顒于薦天羊至反字音皆未詳兮酒陽泉獻水藝兮飯霜秈相然反與太靈兮千萬年訟木魅登髙峯兮俯幽谷心悴悴倉卒反兮念群木見樗栲兮相隂覆憐梫榕上七林下余封兮不豐茂見榛梗之森梢閔樅橎上土恭下甫元兮合蠧槢以八反橈橈女教反兮未堅椲韋鬼反桹桹力唐反兮可屈樒美五反樽上而寸下兹損兮不香拔丰茸兮巳實豈元化之不均兮非雨露之偏殊諒理性之不等于順時兮不如瘱于計反吾心以冥想終念此兮不怡佁徒充反以書義考之當作侗豫莫識天地之意兮願截惡木之根傾梟獍之古巢取御名童以為薪割大木使飛熖徯枯腐之燒焚實非吾心之不仁惠也豈耻夫善惡之相紛且欲畚三河之膏壤禆濟水之清漣將封灌乎善木令橚橚息逐反以梃梃丑然反尚畏乎衆善之未茂兮為衆惡之所挑凌思聚義以為曹令敷扶以相勝取方所以柯如兮吾將出于南荒求夀藤與燔本吾將出于東方祈有德而來歸輔神柳與堅香且憂顒之翩翩又愁㺠以王反之奔馳及隂陽兮不和惡此土之失時今神柳兮不茂使堅香兮不滋重嗟惋兮何輔每齋心以精意切援祝于神明冀感通於天地猶恐衆妖兮水魅魍魎兮山精上誤惑于靈心經紿于言兮不聽敢引佩以指水誓吾心兮自明閔嶺中郎丁反群山以延想吾獨閔乎嶺中彼嶺中兮何有有天含之玉峰殊閟絶之極顛上聞産乎翠茸欲採之以將夀眇不知夫所從大淵藴藴兮絶嶘士眼反岌岌非梯梁以通險當無路兮可入彼猛毒兮曹聚必慿託乎阻修常擬擬兮伺人又如何兮不愁彼妖精兮變怪必假見于風雨常閃閃而伺人又如何兮不苦欲仗仁兮託信將徑往兮不難久懹懹以㥄惋上力膺下鳥段却遲回而永歎懼太靈兮不知以豫心為永惟若不可乎遂巳吾終保夫直方則必蒙皮篻莫招反以為矢絃母筱以周反以為弧化毒銅以為戟刺棘竹以為殳得其甚也不如草木此意多顯于元子者或曰訂如是他丁反不如則不如也不如如者止于此乎元于于是系之于人事縯以淺反之于此喻始為七不如不如之義始極也第一元子以為人之毒也毒于鄉毒于國毒于鳥獸毒于草木不如毒其形毒其命毒其姻戚毒其家族者爾于戲毒可頌也乎哉毒有甚焉何如第二元子以為人之媚也媚于時媚于君媚于朋友媚于鄉縣不如媚于廄媚于室媚于市肆媚于道路者爾于戲媚可頌也乎哉媚有甚焉何如第三元子以為人之詐也詐于忠詐于信詐于仁義詐于正直不如詐于愚詐于弱詐于貧賤詐于退讓者爾于戲詐可頌也乎哉詐有甚焉何如第四元子以為人之惑也惑于邪惑于佞惑于姦惡惑于凶暴不如惑于狂惑于誕惑于玩弄惑于諧戲者爾于戲惑可頌也乎哉惑有甚焉何如第五元子以為人之貪也貪于權貪于位貪于取求貪于聚積不如貪于德貪于道貪于間和貪于靜順者爾于戲貪可頌也乎哉貪有甚焉何如第六元子以為人之溺也溺于聲溺于色溺于圎曲溺于妖妄不如溺于仁溺于讓溺于方直溺于忠信者爾于戲溺可頌也乎哉溺有甚焉何如第七元子以為人之忍也忍于毒忍于媚忍于詐惑忍于貪溺不如忍于貧忍于苦忍于棄汚忍于病廢者爾于戲忍可頌也乎哉忍有甚焉何如訂古五篇有序天寶癸巳元子作訂古訂古前丗君臣父子兄弟夫婦朋友之道于戲上古失之中古亂之至于近世有窮極凶惡者矣或曰欲如之何對曰將如之何吾且聞之訂之嗟之傷之泣而恨之而巳也第一吾觀君臣之間且有猜忌而聞疑懼其由禪讓革代之道誤也故後世有劫篡廢放之惡興焉嗚呼即有孤弱將安託哉即有功業將安保哉第二吾觀父子之際且有悲感而聞痛恨其由聽讒受亂之意惑也故後世有幽毒囚殺之患起焉嗚呼即有深慈將安興哉即有至孝將安訴哉第三吾觀兄弟之中且有鬪爭而聞殘忍其由分國異家之教薄也故後世有隂謀誅戮之害生焉嗚呼即有友悌將安用哉即有恭順將安全哉第四吾觀夫婦之道且有冤怨而聞嫌妬其由耽淫惑亂之情多也故後世有滅身亡家之禍發焉嗚呼即有信義將安及哉即有柔順將安守哉第五吾觀朋友之義且有邪詐而聞忌患其由趍勢近利之心甚也故後世有窮凶極害之刑生焉嗚呼即有節分將安與哉即有方正將安容哉自述三篇有序天寶庚寅元子𥘉習靜于啇餘人聞之非非曰此狂者也見則茫然無幾人聞之是是曰此學者也見則猗然及三年人聞之參參曰此隱者也見則崖然有惑而問曰子其隱乎對曰吾豈隱者邪愚者也窮而然爾或者不喻遂為述時命以辨之先曾為述居一篇因刋而次之總命曰自述述時昔隋氏逆天地之道絶生人之命使怨痛之聲滿于四海四海之內隋人未老隋社未安而隋國巳亡何哉奢淫暴虐昏惑而巳蒸人苦之上訴皇天皇天有命于我國家六葉于兹髙皇至勤文皇至明身鑒隋室不敢滿溢清儉之深聽察之至仁惠之極泱泱洋洋為萬代則聖皇承之不言而化四十餘年天下太平禮樂化于戎夷慈惠及于草木雖奴隸齒類亦能誦周公孔父之書説陶唐虞夏之道至于歌頌謳吟婦人童子皆抒性情美辭韻指詠時物與絲竹諧會綺羅當稱况世貴之士博學君子其文學聲望安得不顯聞于當時也哉故冠冕之士傾當時大利軒車之士富當時大農由此知官不勝人逸于司領使秩次不能損又休罷以抑之尚駢肩纍趾授任不暇豫愚愚者亦當預焉日覺抵塞猒于無用乃以因慕古人清和藴純周周仲仲瘱于計反然全真上全忠孝下盡仁信內順元化外娭大和足矣如戚促蚩諸稱脂反封蒙遏滅暮為朝貴心所不喜亦由金可鎔不可使為汙腐水可濁不可使為塵糞然巴鄙語曰愚者似直弱者似仁豫殆有之夫復何疑述命元子嘗問命于清惠先生先生曰子欲知命不如平心平心不如忘情喏如酌反敬言也曰幸先生教之先生曰夫平心能正是非忘情能滅有無子何先焉曰請先忘情先生曰子見草木乎子見天地乎草木無心也天地無情也而四時自化雨露自均根柢自深枝幹自茂如是天地豈醜授而成哉草木豈憂求而生哉人之命也亦由是矣若夭若夀若貴若賤烏可強哉不可強也不可強也不如忘情忘情當學草木嗚呼上皇強化天下天下化之養之以道德道德偽薄天下亦從而偽薄嗚呼後王急濟天下天下從之救之以權宜權宜侈惡天下亦從而侈惡故赴貪徇紛急之風以至于今聖賢者兢兢然猶傷命性愚惑者慁慁然遂忘家國其由不審不通醜授憂求而已子不喻乎述居天寶庚寅元子得啇餘之山山東有谷曰餘中谷東有山曰少餘山谷中有田可耕藝者三數夫一夫百畝有泉停浸可畦稻者數十畝泉東南合肥溪溪源在少餘山下溪流出谷與潨職隆反水合匯于滍將成所居故人李才聞而來會乃歎曰吾未始知夫子之所至焉今知之矣吾聞在貧思富在賤思貴人之常情也聖賢所有然而知貧賤不可苟免富貴不可苟取上順時命乘道御和下守虛淡修已推分稱君子者始不公乎乃相與占山泉闢榛莾依山腹近泉源始為亭廡始作堂宇因而習靜適自保間夫人生于世如行長道所行有極而道無窮奔走不停夫然何適豫當乘時和望年豐耕藝山田兼僃藥石與兄弟承歡于膝下與朋友和樂于琴酒寥然順命不為物纍亦自得之分在于此也唐元次山文集第五
