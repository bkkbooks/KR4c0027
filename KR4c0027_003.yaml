front:
  text: 唐元次山文集卷第三
  hash: sha256:2ec4989cdf1d8dc50780e30776fb46b17c66f7164b4d8ae298e3c7832800da9e
  markers:
  - {type: page-break, offset: 0, content: '', id: KR4c0027_SBCK_003-1a}
body:
  text: 閔荒詩一首天寶丙戌中元子浮隋河至淮隂間其年水壞河防得隋人冤歌五篇考其歌義似冤怨時主故廣其意採其歌為閔荒詩一篇其餘載于異録煬皇嗣君位隋德滋昏幽日作及身禍以為長世謀居常耻前王不思天子逰意欲出明堂便登浮海舟令行山川改功與玄造侔河淮可支合峯􅧓生回溝封隕下澤中作山防逸流船􅦬狀龍鷁若負宫闕浮荒娛未央極始到滄海頭忽見海門山思作望海樓不知新都城巳為征戰丘當時有遺歌歌曲太冤愁四海非天獄何為非天囚天囚正凶忍為我萬姓讎人將引天釤人將持天鎪上所監下所求所欲充其心相與絶悲憂自得隋人歌每為隋君羞欲歌當陽春似覺天下秋更歌曲未終如有怨氣浮奈何昏王心不覺此怨尤遂令一夫唱四海欣提矛吾聞古賢君其道常靜柔慈惠恐不足端和忘所求嗟嗟有隋氏惛惛誰與儔系樂府十二首并序天寶辛未中元子將前世嘗可稱歎者為詩十二篇為引其義以名之總命曰系樂府古人歌詠不盡其情聲者化金石以盡之其歡怨甚耶戲音呼盡歡怨之聲者可以上感于上下化于下故元豫系之思太古東南三千里沅湘為太湖湖上山谷深有人多似愚嬰孩寄樹顛就水捕鷠于都反鱸所歡同鳥獸身意復何拘吾行遍九州此風皆巳無吁嗟聖賢教不覺久踟蹰隴上歎援車登隴坂窮髙遂停駕延望戎狄鄉巡回復悲吒滋移有情教草本猶可化聖賢禮讓風何不遍西夏父子忍猜害君臣敢欺詐所適今若斯悠悠欲安舍頌東夷嘗聞古天子朝會張新樂金石無全聲宫啇亂清濁來驚且悲歎節變何煩數始知中國人耽此亡純朴爾為外方客何為獨能覺其音若或在蹈海吾將學賤士吟南風發天和和氣天下流能使萬物榮不能變羇愁為愁亦何爾自請説此由諂競實多路苟邪皆共求常聞古君子指以為深羞正方終莫可江海有滄洲𣢾乃曲𣢾音襖乃音靄棹船之聲誰能聽𣢾乃􅍁乃感人情不恨湘波深不怨湘水清所嗟豈敢道空羡江月明昔聞扣斷舟引釣歌此聲始歌悲風起歌竟愁雲生遺曲今何在逸為漁父行貧婦詞誰知苦貧夫家有愁怨妻請君聽其詞能不為酸嘶所憐抱中兒不如山下麑空念庭前地化為人吏蹊出門望山澤回顧心復迷何時見府主長跪向之啼去鄉悲踟蹰古塞關悲歌為誰長日行見孤老羸弱相提將聞其呼怨聲聞聲問其方乃言無患苦豈棄父母鄉非不見其心仁惠誠所望念之何可説獨立為悽傷夀翁興借問多夀翁何方自修育惟云順所然忘情學草木始知世上術勞苦化金玉不見充所求空聞恣耽欲清和存王母潛濩胡故反無亂黷誰正好長生此言堪佩服農臣怨農臣何所怨乃欲干人主不識天地心徒然怨風雨將論草木患欲説昆蟲苦巡回宫闕傍其意無由吐一朝哭都市淚盡歸田畝謡頌若採之此言當可取謝大龜客來自江漢云得雙大龜且言龜甚靈問我君何疑自昔保方正顧嘗無妄私順和固鄙分全守貞常規行之恐不及此外將何為惠恩如可謝占問敢終辭古遺歎古昔有遺歎所歎何所為有國遺賢臣萬世為冤悲所遺非遺望所遺非可遺所遺非遺用所遺在遺之嗟嗟山海客全獨竟何辭心非膏濡類安得無不遺下客謡下客無黃金豈思主人憐客言勝黃金主人然不然珠玉成彩翠綺羅如嬋姢終恐見斯好有時去君前豈知保終信長使令德全風聲與時茂歌頌萬千年石宫四詠石宫春雲白白雲宜蒼苔拂雲踐石徑俗士誰能來石宫夏水寒寒水宜髙林逺風吹蘿蔓野客熙清隂石宫秋氣清清氣宜山谷落葉逐霜風幽人愛松竹石宫冬日暖暖日宜溫泉農光靜水霧逸者猶安眠與黨評事有序大理評事黨曄好間自退元子愛之作詩贈焉自顧無功勞一嵗官再遷局身班次中常竊愧耻焉加以久荒浪惛愚性頗全未知在冠冕不合無拘牽勤強所不及于人或未然豈忘惠君子恕之識見偏且欲因我心順為理化先彼云萬物情有願隨所便愛君得自遂令我空淵禪與黨侍御有序庚子中元子次山為監察御史黨茂宗罷大理評事次山愛其髙尚曾作詩一篇與之及次山未辭殿中茂宗已受監察採茂宗嘗相誚戲之意又作詩與之衆坐吾獨歡或問歡為誰髙人黨茂宗復來官憲司昔吾順元和與世行自遺茂宗正作吏日有趍走疲及吾汙冠冕茂宗方矯時誚吾順讓者乃是干進資今將問茂宗茂宗欲何辭若云吾無心此來復何為若云吾有羞于此還見嗤誰言萬類心間之不可窺吾欲喻茂宗茂宗宜聽之長轅有修轍馭者令爾馳山谷安可怨筋力當自悲嗟嗟黨茂宗可為識者規寄源休有序辛丑中元結與族弟源休皆為尚書郎在荆南府幕休以曾任湖南久理長沙結以曾逰江州將兵鎮九江自春及秋不得相見故抒神與反所懷以寄之天下未偃兵儒生預戎事功勞安可問且有忝官纍昔常以荒浪不敢學為吏况當在兵家言之豈容易忽然向三嵗境外為偏帥時多尚矯詐進退多欺二縱有一直方則上似姦智誰為明信者能辨此勞畏與瀼溪鄰里有序乾元元年元子將家自全于瀼溪上元二年領荆南之兵鎮于九江方在軍旅與瀼溪鄰里不得如往時相見逰又知瀼溪之人日轉窮困故作詩與之昔年苦逆亂舉族來南奔日行幾十里愛君此山村峰谷呀回映誰家無泉源修竹多夾路扁舟皆到門瀼溪中曲濵其陽有間園鄰里昔贈我許之及子孫我嘗有匱乏鄰里能相分我嘗有不安鄰里能相存斯人轉貧弱力役非無冤終以瀼濵訟無之天下論喻瀼溪鄉舊逰往年在瀼濵瀼人皆忘情今來逰瀼鄉瀼人見我驚我心與瀼人豈有辱與榮瀼人異其心應為我冠纓昔賢惡如此所以辭公卿貧窮老鄉里自休還力耕况曾經逆亂日猒聞戰爭尤愛一溪水而能存讓名終當來其濵飲啄全此生忝官引天下昔無事僻居養愚鈍山野性所安熙然自全順忽逢暴兵起閭巷見軍陳將家瀛海濵自棄同芻糞往在乾元𥘉聖人啓休運公車詣魏闕天子垂清問敢誦王者針亦獻當時論朝廷愛方直明主嘉忠信屢授不次官曾與專征印兵家未曾學榮利非所徇偶得凶醜降功勞愧分寸爾來將四嵗慙耻言可盡請取冤者辭為吾忝官引冤辭何者苦萬邑餘灰燼冤辭何者悲生人盡鋒刃冤辭何者甚力役遇勞困冤辭何者深孤弱亦哀恨無謀救冤者祿位安可近而可愛軒裳其心又干進此言非作戒此言敢貽訓實欲辭無能歸耕守吾分樊上漫作漫家郎亭下復在樊水邉去郭五六里扁舟到門前山竹繞茅舍庭中有寒泉西邉雙石峰引望堪忘年四鄰皆漁父近渚多間田且欲學耕釣于斯求老焉酬裴雲客自猒久荒浪于時無所任耕釣以為事來家樊水隂甚醉或漫歌甚間亦漫吟不知愚僻意稱得雲客心雲客方持斧與人正相臨符印隨坐起守位常森森縱能有相招豈暇來山林酬孟武昌苦雪積雪間山路有人到庭前云是孟武昌令獻苦雪篇長吟未及終不覺為悽然古之賢逹者與世竟何異不能救時患諷諭以全意知公惜春物豈非愛時和知公苦隂雪傷彼災患多姦凶正驅馳不合問君子林鶯與野獸無乃怨于此兵興向九嵗稼穡誰能憂何時不發卒何日不殺牛耕者日巳少耕牛日巳希皇天復何忍更又恐斃之自經危亂來觸物堪傷歎見君問我意只益胸中亂山禽飢不飛山木凍皆折懸泉化為氷寒水近不熱出門望天地天地皆昏昏時見雙峯下雪中生白雲漫問相里黃州東鄰有漁父西鄰有山僧各問其情性變之俱不能公為二千石我為山海客志業豈不同今己殊名迹相里不相類相友且相異何况天下人而欲同其意人意苟不同分寸不相容漫問軒裳客何如耕釣翁喻舊部曲漫逰樊水隂忽見舊部曲尚言軍中好猶望有所屬故令爭者心至死終不足與之一杯酒喻使燒戎服兵興向十年所見堪歎哭相逢是遺人當合識榮辱勸汝學全生隨我畬退谷雪中懷孟武昌冬來三度雪農者歡嵗稔我麥根巳濡各得在倉廪天寒未能起孺子驚人寢云有山客來籃中見冬菌生木上燒柴為溫酒煮鱖為作瀋尸甚反羹汁客亦愛杯樽思君共杯飲所嗟山路間時節寒又甚不能苦相邀興盡還就枕喻常吾直為攝官山澤多飢人閭里多壞屋戰爭且未息徴斂何時足不能救人患不合食天粟何况假一官而苟求其祿近年更長吏數月未為速來者罷而官豈得不為辱歡為辭府主從我逰退谷谷中有寒泉為爾洗塵服招孟武昌漫叟作退谷銘指曰干進之客不得逰之作抔湖銘指曰為人猒者勿泛抔湖孟士源嘗黜官無情干進在武昌不為人猒可逰退谷可泛抔湖故作詩招之風霜枯萬物退谷如春時窮冬涸江海抔湖澄清漪湖盡到谷口單船近階墀湖中更何好坐見大江水欹石為水涯半山在湖裏谷口更何好絶壑流寒泉松桂蔭茅舍白雲生坐邉武昌不干進武昌人不猒退谷正可逰抔湖任來泛湖上有水鳥見人不飛鳴谷中有山獸往往隨人行莫將車馬來令我鳥獸驚登殊亭作時節方大暑試來登殊亭慿軒未及息忽若秋氣生主人既多間有酒共我傾坐中不相異豈限醉與醒漫歌無人聽浪語無人驚時復一回望心目出四𬈑誰能守纓佩日與災患并請君誦此意令彼惑者聽漫酬賈沔州有序賈德方與漫叟者懼漫叟不能甘窮獨懼叟又須為官故作詩相喻其指曰勸爾莫作官作官不益身因德方之意遂漫酬之往年壯心在嘗欲濟時難奉詔舉州兵令得誅暴叛上將屢顛覆偏師常救亂未曾弛戈甲終日領簿案出入四五年憂勞忘昏旦無謀靜凶醜自覺愚且愞豈欲皂櫪中爭食麧與藖麧粳中可食者下沒反牛馬食餘草節曰藖下諫反去年辭職事所懼貽憂患天子許安親官又得間散自家樊水上性情尤荒慢雲山與水木似不憎吾漫以兹忘時世日益無畏憚漫醉人不嗔漫眠人不喚漫逰無逺近漫樂無早晏漫中漫亦忘名利誰能算聞君勸我意為君一長歎人誰年八十我巳過其半家中孤弱子長子未及冠且為兒童主種藥老溪澗漫歌八曲有序壬寅中漫叟得免職事漫家樊上修耕釣以自資作漫歌八曲與縣大夫孟士源欲士源唱而和之故城東漫惜故城東良田野草生説向縣大夫大夫勸我耕耕者我為先耕者相次焉誰愛故城東今為近郭田西陽城江北有大洲洲上堪力耕此中宜五榖不及西陽城城畔多野桑城中多古荒衣食可力求此外何所望大回中樊水欲東流大江又北來樊山當其南此中為大回回中魚好逰回中多釣舟漫欲作漁人終焉無所求小回中叢石橫大江人言是釣臺水石相衝激此中為小回回中浪不惡復在武昌郭來客去客船皆向此中泊將牛何處去二首將牛何處去耕彼故城東相伴有田父相歡惟牧童將牛何處去耕彼西陽城叔間修農具直者伴我耕叔間漫叟韋氏甥直者漫叟長子也將船何處去二首將船何處去釣彼大回中叔靜能鼓橈正者隨弱翁叔靜漫叟李氏甥正者漫叟次子也將船何處去送客小回南有時逢惡客非酒徒即為惡客還家亦少酣唐元次山文集卷第三
