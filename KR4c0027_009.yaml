front:
  text: 唐元次山文集卷第九
  hash: sha256:00c483aeeab430cf28ccf0c8c131882e2c4f8eee87776388415f993c8b5be2c5
  markers:
  - {type: page-break, offset: 0, content: '', id: KR4c0027_SBCK_009-1a}
body:
  text: 元魯縣墓表天寶十三年元子從兄前魯縣大夫德秀卒元子哭之哀門人叔盈問曰夫子哭從兄也哀不亦過乎禮與對曰汝知禮之過而不知情之至叔盈退謂其徒曰夫子之哭元大夫也兼師友之分亦過矣元子聞之召叔盈謂曰吾誠哀過汝所云也元大夫弱無所固壯無所專老無所存死無所餘此非人情人情所耽溺喜愛似可惡者大夫無之如戒如懼如憎如惡此其無情此非有心士君子知焉不知也吾今之哀汝知之焉而不知也嗚呼元大夫生六十餘年而卒未嘗識婦人而視錦繡不頌之何以戒荒淫侈靡之徒也哉未嘗求足而言利苟辭而便色不頌之何以戒貪猥侫媚之徒也哉未嘗主十畝之地十尺之舍十嵗之童不頌之何以戒占田千夫室宇千柱家童百指之徒也哉未嘗皂布帛而衣具五味而食不頌之何以戒綺紈梁肉之徒也哉于戲吾以元大夫德行遺來世清獨君子方直之士也歟哀丘表乾元庚子元子理兵于有泌之南泌南至德丁酉為陷邑乾元巳亥為境上殺傷勞苦言可極耶街郭亂骨如古屠肆于是收而藏之命曰哀丘或曰次山之命哀丘也哀生人將盡而亂骨不藏者乎哀壯勇巳死而名迹不顯者乎對曰非也吾哀凡人不能絶貪爭毒亂之心守正和仁讓之分至今吾有哀丘之怨歟左黃州表乾元巳亥贊善大夫左振出為黃州刺史下車黃人歌曰我𣣔逃鄉里我𣣔去墳墓左公今既來誰忍棄之去于戲天下兵興今七年矣河淮之北千里荒草自關已東海濵之南屯兵百萬不勝征稅豈獨黃人能使其人忍不去者誰曰不可頌乎後一歲黃人又歌曰吾鄉有鬼巫惑人人不知天子正尊信左公能殺之于戲近年以來以隂陽變怪將鬼神之道罔上惑下得尊重于當時者日見欺人黃之巫女亦以妖妄得蒙恩澤朝廷不敢問州縣惟其意公忿而殺之則彼可誅戮豈獨巫女如左公者誰曰不可頌乎居三年遷侍御史判金州刺史將去黃黃人多去思故為黃人作表如在氏世系左公厯官及黃之門生故吏與女巫事則南陽左公能悉記之吕公表上元二年置南都于荆州為江陵府使舊相東平吕公為江陵尹兼御史大夫分峽中湖南及武陵灃陽巴陵凡一十七州為荆南節度觀察使公理荆南三年年五十一薨于官嗚呼使公年夀之不將也天其未猒兵革不愛蒼生歟公明不盡人之私惠不取人之愛威不致人之懼令不求人之犯正不刑人之僻直不指人之恥故名不異俗迹不矯時內含端明外與常規其大雅君子全于終始者耶公所以進退其身人不知其道公所以再在台衡人不知其德頌元化者誰預頌乎于戲公將用于人而不見其用人將得于公而公忘其所得乎結等迹參名業嘗在幕下將紀盛德示于來世故刻金石留于此邦惠公禪居表泝樊水二百餘里有湧溪入溪八九里有蛇山之陽是惠公禪居禪師以無情待人之有情以有為全已之無欲各因其性分莫不與善知人困窮喻使耕織因人災患勸守仁信故閭里相化恥為弋釣日勤種植不五六年沮澤有溝塍荒皋有阡陌桑果竹園如伊洛間所以愛禪師者無全行無全道豈能及此鄉人欲增修塔廟託禪師以求福禪師亦隨人之意而制造焉直門臨溪廣堂背山庭列雙臺修廊夏寒松竹蒼蒼周流清泉岑嶺復抱衆山回旋斯亦曠絶之殊境矣吾以所疑咨于禪師禪師曰我恐人忘善以事誘人及人將善固不以事為纍吾以所惑咨于禪師禪師曰公若以惑相問我亦惑于問焉公若無惑我復何對于戲吾漫浪者也焉能盡禪師之意乎縣大夫孟彥深王文淵識名顯當世必能盡禪師之意故命之作贊贊曰聖者忘迹逹人化心惠公之妙無得而尋如山出雲如水涵月惠公得之演用不竭無情之化可洽群黎將引天下同于湧溪夏侯嶽州表癸卯嵗嶽州刺史夏侯公殁于私家門人弟子愛思不忘願旌遺德將顯來世會豫詔許優間家于樊上故為公作表庚子中公鎮嶽州豫時為尚書郎在荆南幕府嘗因廉問到公之州其時天下兵興巳六七十年矣人疲州小比太平時力役百倍公能清正寬恕靜以理之故其人安和而服説為當時法則及公罷歸州里公家與吾相鄰見公在州里與山野童孺與當道辭色均若語是非得喪語夭夀哀樂戀意淡然吾是知道勝于內者物莫能撓德充于外者事不歸于今之世誰不榮羡于公之世嗣與公官則本縣能誘公之所至其獨有乎于戲公既夀而貴保家全大夫李公狀著之矣舜祠表有唐乙已嵗使持節道州諸軍事守道州刺史元結以虞舜葬于蒼梧之九疑之山在我封內是故申明前詔立祠于州西之山南巳而刻石為表于戲孔氏作虞書明大舜德及生人之至則大舜于生人宜以類乎天地生人奉大舜宜萬世而不猒考大舜南巡之年時巳一百一十二嵗矣自中國至蒼梧亦幾有萬里蒼梧山谷深險可懼帝竟人而不回至今山下之人不知帝居之宫帝葬之陵嗚呼在有虞氏之世人民可奪其君耶人民于大舜能忘而不思耶何為來而不歸何故死于空山吾實惑而作表來者逰于此邦登乎九疑誰能不惑也歟崔潭州表乙巳嵗潭州刺史崔灌去官州人衡州司功參軍鄭浰為鄉人某等請余為崔公作表公前在澧州謡頌之聲逹于朝廷褒異之詔與人為程及領此州在今日能使孤老寡弱無悲憂單貧困窮安其鄉冨豪強家無利害賈人就食之類各得其業職役供給不匱人而當于有司若非清廉而信正直而仁則不能至於觀察御史中丞孟公奏課又第一會國家以犬戎為虞未即徴拜使蒼生正暍于歇反而去其庥廕使蒼生正渴而敝其清源時艱道逺州人等不得詣闕冤訴且欲刻石立表以彰盛德于戲刺史有土官也千里之內品刑之屬不亦多乎豈可令凶竪暴類貪夫姦黨以貨權家而至此官如崔公有者豈獨真刺史耳鄭浰之為豈苟媚其君而私于州里耶蓋懼清廉正直之道溺于時俗君子遺愛之心不顯來世故采其意而已矣張處士表永泰丙午中處士張秀卒于戲吾嘗驗古人將老死巖谷逺迹時世者不必其心皆好山林若非介直方正與時丗不合必識髙行獨與時丗不合不然則剛褊傲逸與時世不合彼若遭逢不容則身不足以為禍將家族以隨之至于傷汚毁辱何足説者故使之矯然絶丗逃其不容直為逸民竟為退士枕石飲水終身而巳當時之君欲以祿位招之有土之官𣣔以厚禮處之彼驚懼抗絶而去時之見能如此所以尤髙尚焉嗚呼處士與時不合者耶而未能矯然絶世遭以禮法相檢不見容悲夫菊圃記舂陵俗不種菊前時自逺致之植于前庭墻下及再來也菊已無矣徘徊舊圃嗟歎久之誰不知菊也芳華可賞在藥品是良藥為𬞞菜是佳𬞞縱須地趍走猶宜徙植修養而忍蹂踐至盡不愛惜乎于戲賢士君子自植其身不可不慎擇所處一旦遭人不愛重如此菊也悲傷奈何于是更為之圃重畦植之其地近宴息之堂吏人不此奔走近登望之亭旌麾不此行列縱參歌妓菊非可惡之草使有酒徒菊為助興之物為之作記以託後人并録藥經列于記後廣宴亭記樊水東盡其南乃樊山北鮮津吏𣣔于鮮上而為候舍漫叟家于樊上不醉則間乃相其地形驗之圖記故實為宴逰之處縣大夫馬公登之歎曰謝公贈伏武昌詩云樊山開廣宴非此地耶吾𣣔因而修之命曰廣宴亭何如漫叟頌之曰古人將修廢遺尤異之事為君子之道于戲天下有廢遺尤異之事如此亭者誰能修而旌之天將猒悔往乎使公方壯而有是心也當裁畜簡扎待為之頌故作此廣宴記殊亭記癸卯中扶風馬向兼理武昌以明信嚴斷惠正為理故政不待時而成于戲若明而不信嚴而不斷惠而不正雖欲理身終不自理况于人哉公能令人理使身多暇招我畏暑且為涼亭亭臨大江復出山上佳木相蔭常多清風巡回極望目不猒逺吾見公才殊政殊迹殊為此亭又殊因命之曰殊亭斫石刻記立于亭側庶幾來者無所惑焉右溪記道州城西百餘步有小溪南流數十步合營溪水抵兩岸悉皆怪石欹嵌盤屈不可名狀清流觸石洄懸激注休木異竹垂隂相蔭此溪若在山野則宜逸民退士之所逰處在人間可為都邑之勝境靜者之林亭而置州已來無人賞愛徘徊溪上為之悵然乃疏鑿蕪穢俾為亭宇植松與桂兼之香草以禆形勝為溪在州右遂命之曰右溪刻銘石上彰示來者刺史廳記天下太平方千里之內生植齒類刺史乃存亡休戚之係天下兵興方千里之內能保黎庶能攘患難在刺史爾凡刺史若無文武才略若不清廉肅下若不明惠公直則一州生類皆受災害于戲自至此州見井邑丘墟生人幾盡試問其故不覺涕下前輩刺史或有貪猥惛弱不兮是非但以衣服飲食為事數年之間蒼生蒙以私𣣔侵奪兼之公家驅迫非姦惡強冨殆無存者問之耆老前後刺史能恤養貧弱專守法令有徐公履道李公廙而巳遍問諸公善或不及徐李惡有不堪説者故為此記與刺史作戒自置州巳來諸公改授遷絀年月則舊記存焉茅閣記乙已平昌孟公鎮湖南將二歲矣以威惠理戎旅以簡易肅州縣刑政之下則無撓人故居方多間時與賔客嘗𣣔因亭引望以紓逺懷偶愛古木數株重覆城上遂作茅閣蔭其清隂長風寥寥入我軒檻扇和爽氣滿于閣中世傳衡陽暑濕鬱蒸休息于此何為不然今天下之人正苦大熱誰似茅閣蔭而庥之于戲賢人君子為蒼生之庥蔭不如是耶諸公歌詠以長之俾茅閣之什得系嗣于風雅者矣九疑圖記九疑山方二千餘里四州各近一隅世稱九峯相似望而疑之謂之九疑亦云舜登九峯疑禹而悲從臣有作九悲之歌因謂之九疑九峯殊極髙大逺望皆可見也彼如嵩華之峻﨑衡岱之方廣在九峯之下磊磊然如布棊石者可以百數中峯之下水無魚鱉林無鳥獸如蟬蠅之類聽之亦無往往見大谷長川平田深淵杉松百圍榕栝並之青莎白沙洞穴丹崖寒泉飛流異竹雜華回映之處似藏人家實有九水出于中山四水流灌于南海五水北注合為洞庭若度其髙卑比洞庭南海之岸直上可二三百里不知海內之山如九疑者幾焉或曰若然者茲山何不列于五嶽對曰五帝之前封疆尚隘衡山作嶽已出荒服今九疑之南萬里臣妾國門東望不見涯際西行幾里未盡邉陲當合以九疑為南嶽以崑崙為西嶽衡陽之輩聽逸者占為山封君表作園囿耳但苦當世議者拘限常情牽引古製不能有所改創也如何故圖九峯略載山谷傳于好事以旌異之如山中之往迹峯洞之名稱為人所傳説者並隨方題記庶幾觀者易之時永泰丙午中也寒亭記在江華縣永泰丙午中巡屬縣至江華縣大夫瞿令問咨曰縣南水石相映望之可愛相傳不可登臨俾求之得洞穴而入棧險以通之始得構茅亭于石上及亭成也所以階檻慿空下臨長江軒楹雲端上齊絶顛若旦暮景氣煙靄異色蒼蒼石墉含映水木欲名斯亭狀類不得敢請名之表示來丗于是于亭上為啇之曰今大暑登之疑天時將寒炎蒸之地而清涼可安不合命之曰寒亭歟乃為寒亭作記刻之亭背唐元次山文集卷第九
