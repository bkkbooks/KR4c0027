front:
  text: 唐元次山文集卷第六
  hash: sha256:f7d5ee88f438cc49ca325b26b42f37edc514f3b1f4c260b4f8ba21c63a8a1077
  markers:
  - {type: page-break, offset: 0, content: '', id: KR4c0027_SBCK_006-1a}
body:
  text: 贈禮部侍郎元結著翰林編修湛若水校太保武定侯郭勛編自針有時士教元子顯身之道曰于時不爭無以顯榮與丗不佞終身自病君欲求權須曲須圎君欲求位須姧須媚不能此為窮賤勿辭元子對曰不能此為乃吾之心反君此言我作自針與時仁讓人不汝上處世清介人不汝害汝若全德必忠必直汝若全行必方必正終身如此可謂君子大唐中興頌天寶十四載安祿山陷洛陽明年陷長安天子幸蜀太子即位于靈武明年皇帝移軍鳳翔其年復兩京上皇還京師于戲前代帝王有盛德大業者必見于歌頌若今歌頌大業刻之金石非老于文學其誰宜為頌曰噫嘻前朝孽臣姦驕為昏為妖邉將騁兵毒亂國經羣生失寧大駕南巡百寮竄身奉賊稱臣天將昌唐繄䁱我皇匹馬北方獨立一呼千麾萬旟我卒前驅我師其東儲皇撫戎蕩攘羣凶復服指期曾不踰時有國無之事有至難宗廟再安二聖重歡地闢天開蠲除祅災瑞慶大來凶徒逆儔涵濡天休死生堪羞功勞位尊忠烈名存澤流子孫盛德之興山髙日升萬福是膺能令大君聲容沄沄不在斯文湘江東西中直浯溪石崖天齊可磨可鐫刋此頌焉何千萬年虎蛇頌有序猗玗子逃亂在䂙英及反南人云猗玗洞中是王虎之宫中䂙之隂是均蛇之林居之三月始知王虎如古君子始知均蛇如古賢士然哉猗玗子奪其宫王虎去而不回猗玗子侵其林均蛇去而不歸借順惠讓可作頌矣虎頌猗王虎將何與方方古大王非不方于今今也惠讓不如王虎之心蛇頌猗均蛇將何與儔儔古延州非不儔于時時也順讓不如均蛇之為瀼溪銘有序乾元戊戍浪生元結始浪家瀼如恙反溪之濵瀼溪蓋湓水分稱瀼水夏瀼江海則百里為瀼湖二十里為瀼溪瀼溪浪士愛之銘之其濵于戲古人喜尚君子不見君子見如似者亦稱頌之瀼溪可謂讓矣讓君子之道也稱頌如此可遺瀼溪若天下有如似讓者吾豈先瀼溪而稱頌者乎銘曰瀼溪之瀾誰取盥焉瀼溪之漪誰取飲之盥實可矣飲豈難矣得不慚其心不如此水浪士作銘將戒何人欲不讓者漸逰瀼濵異泉銘并序天寶十三年春至夏甚旱秋至冬積雨西塞西南有回山山顛是秋崩拆有穴出泉泉垂流三四百仞浮江中可望于戲隂陽旱雨時異以至柔破至堅事異以至下處至髙理異故命斯泉曰異泉銘于泉上其意豈獨旌異而已乎銘曰何故作銘銘于異泉為其當不可閼拆石出焉何用作銘銘于異泉為其當不可下窮髙流焉君子之德顯與晦殊為此銘者忘道也歟抔薄侯反樽銘并序郎亭西乳有藂石石臨樊水漫叟橫石顛以為亭石有窊顛者因修之以藏酒士源愛之命為抔樽乃為士源作抔樽銘銘曰窊顛之石在吾亭上天全其器實有殊狀如竇而底似傾幾欹非曲非方不凖不規孟公髙賢命曰抔樽漫叟作銘當欲何言時俗僥狡日益偽薄誰能抆飲共守淳朴退谷銘并序抔湖西南是退谷谷中有泉或激或懸為竇為淵滿谷生夀木又多夀藤縈之始入谷口令人忘返時士源以漫叟退修耕釣愛逰此谷遂命曰退谷元子作銘以顯士源之意銘曰誰命退谷孟公士源孟公之意漫叟知焉公畏漫叟心進迹退公懼漫叟名顯身晦公恐漫叟辭小受大于戲退谷獨為吾規干進之客不羞逰之何人作銘銘之谷口荒浪者歟退谷漫叟抔湖銘并序抔湖東抵抔樽西侵退谷北匯樊水南涯郎亭有菱有荷有菰古胡反有蒲方一二里能浮水與漫叟自抔亭逰退谷必泛此湖以湖在抔樽之下遂命曰抔湖銘曰誰遊江海能猒其大誰泛抔湖能猒其小故曰人不猒者君子之道于戲君子人不猒之死雖千嵗其行可師可猒之類不獨為害死雖萬死獨堪汚穢或問作銘意盡此歟吾欲為人厭者勿泛抔湖五如石銘并序涍泉之陽得怪石焉左右前後及登石顛均有如似故命之曰五如石石皆有竇竇中湧泉泉詭異于七泉故命為七勝泉石有雙目一目命為洞井井與泉通一目命為洞樽樽可䝻角居反酒石尾有穴且如礲盧紅反者又如瀧所江反者泉可渟澄匝石而流入于礲中出而為瀧于戲彼能異于此安可不稱顯之銘曰五如之石何以為名請悉狀之誰為我聽左如旋龍低首回顧右如驚鴻張翅未去前如飲虎飲而蹲焉後如怒龜出洞登山若坐于顛石則如乘彼靈槎在漢之間洞井如鑿淵然泉湧澄瀾涵石彼起如動不旌尤異焉用為文刻銘石上于千萬春七泉銘并序道州東郭有泉七穴或吐于淵竇或瀪方願反于嵌臼皆澄流清漪旋沿相奏又有藂石欹缺為之島嶼殊怪相異不可名狀此邦豈丗無好事者耶而令自古荒之乃修其水木為休暇之處每至泉上便思老焉于戲凡人心若清惠而必忠孝守方直終不惑也故命五泉其一曰潓惠泉次曰􅪙忠泉次曰涍孝泉汸甫亡反泉淔株力反泉銘之泉上欲來者飲漱其流而有所感發者矣留一泉命曰漫泉蓋欲自旌漫浪不猒歡醉者也一泉出山東故命之曰東泉引來垂流更復殊異各刻銘以記之潓泉銘于戲潓泉清不可濁惠及于物何時竭涸將引官吏盥而飲之清惠不巳泉乎吾規汸泉銘古之君子方以全道吾命汸泉方以終老欲令圎者飲吾汸泉知圎非君子能學方惡圎淔泉銘曲而為王直蒙戮辱寧戮不王直而不曲我頌斯曲以命淔泉將戒來世無忘直焉􅪙泉銘不為人臣老死山谷臣于人者不就汚辱我命􅪙泉勸人事君來漱泉流願為忠臣涍泉銘沄沄涍泉流清源深堪勸人子奉親之心時世相薄而日忘聖教欲將斯泉禆助純孝漫泉銘誰愛漫泉自成小湖能浮酒舫不沒石魚漫也叟稱名泉何為旌叟于此漫歡漫醉東泉銘泉在山東以東為名愛其懸流溶溶在庭作銘者何吾意未盡將告來世無忘畎引寒泉銘并序湘江西峰直平陽江口有寒泉出于石穴峰上有老木夀藤垂隂泉上近泉堪戙徒弄反維大舟惜其蒙蔽不可得見踟蹰行修其水木泉無名稱也為其當暑大寒故命曰寒泉銘曰于戲寒泉瀛瀛江渚堪救渴暍人不之知時當大暑江流若湯寒泉一掬能清心腸誰謂仁惠不在兹水舟楫尚存為利未巳陽華岩銘并序道州江華縣東南六七里有回山南面峻秀下有大岩岩當陽端故以陽華命之吾逰處山林幾三十年所見泉石如陽華殊異而可家者未也故作名稱之縣大夫瞿令問藝兼篆籀俾依石經刻之岩下銘曰九疑萬峰不如陽華陽華嶄巉其下可家洞開為岩岩當陽端岩髙氣清洞深泉寒陽華旋回岑巔如闢溝塍松竹輝映水石尤宜逸民亦宜退士吾欲投節窮老于此懼人譏我以官矯時名迹彰顯醜如此為于戲陽華將去思來前步却望踟蹰徘徊窊樽銘道州城東有左湖湖東二十步有小石山山顛有窊石可以為樽乃為亭樽上刻銘為志銘曰片石何狀如獸之踆其背䫜窊可以為樽空而臨之長岑深壑廣亭之內如見山嶽滿而臨之曲浦回淵長瓢之下江湖在焉彼成全器誰為之力天地開鑿日月抆拭寒暑琢磨風雨潤色此器大朴尤宜直純勒銘亭下以告後人丹崖翁宅銘并序零陵瀧下三十里得丹崖翁宅俗曰赤石園有唐節者曾為瀧水令去官家于崖下自稱丹崖翁丹崖湘中水石之異者翁湘中得道之逸者愛其水石為之作銘曰瀧山未盡瀧水猶峻忽見淵洄丹崖千仞磳磳伏競反丹崖其下誰家門前斷舟籬上釣車不知幾峰為其四墉竹幽石磴泉飛戶中怪石臨淵硱硱綺兢反石顛何得石顛翁獨醉眠吾欲與翁東西茅宇飲啄終老翁亦悅許世俗常事阻人心情徘徊崖下遂刻此銘朝陽岩銘并序永泰丙午中自舂陵詣都使計兵至零陵愛其郭中有水石之異泊舟尋之得岩與洞此邦之形勝也自古荒之而無名稱以其東向遂以朝陽命焉前刺史獨孤愐為吾剪闢榛莽後攝刺史竇必為吾創制茅閣于是朝陽水石始有勝絶之名已而刻銘岩下將示來世銘曰于戲朝陽怪異難狀蒼蒼半山如在水上朝陽水石可謂幽竒岩下洞口洞中泉垂彼髙岩絶崖深洞寒泉縱僻在幽逺猶宜往焉况郡城井邑岩洞相對無人修賞競競當作竟使蕪穢刻石岩下問我何為欲零陵水石世人有知浯溪銘有序浯溪在湘水之南北匯于湘愛其勝異遂家溪畔溪世無名稱者也為自愛之故命曰浯溪銘于溪口銘曰湘水一曲淵洄傍山山開石門溪流潺潺山開如何巉巉雙石臨淵斷岸夾溪絶璧水實殊怪石又尤異吾欲求退將老兹地溪古荒溪蕪沒蓋久命曰浯溪旌吾獨有人誰逰之銘在溪口唐元次山文集卷第六
