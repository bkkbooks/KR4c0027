front:
  text: 唐元次山文集卷第十
  hash: sha256:a3680e1fb8cff0efa92098fd36fc1ee12f3496267f022cb1eb326fe8fac2d7b5
  markers:
  - {type: page-break, offset: 0, content: '', id: KR4c0027_SBCK_010-1a}
body:
  text: 為董江夏自陳表臣某言月日勑使某官某乙至賜臣制書示臣云云伏見詔旨感深驚懼臣豈草木不知天心頃者潼關失守皇輿不安四方之人無所繫命及永王承制出鎮荆南婦人童子欣奉王教意其然者人未離心臣謂此時可奮臣節王𥘉見臣謂臣可任遂授臣江夏郡太守近日王以冦盜侵逼總兵東下旁牒郡縣皆言巡撫今諸道節度以為王不奉詔兵臨郡縣疑王之議聞于朝廷臣則王所授官有兵防禦鄰郡並邑疑臣順王旬日之間致身無地臣本受王之命為王奉詔王所授臣之官為臣許國忠正之分臣實未虧蒼黃之中死幾無所不圗今日得逹聖聽今臣年六十老母在堂縱未能奉義捐生則豈忍兩忘忠孝臣少以文學為諸生所多中年自頥逸在山澤聖明無事甘為外臣無何以鄙僻之故反為人知遂汚官次以至今日臣又頃年貶謫罪未昭洗今所授官復越班秩罷歸待罪是臣之分今陛下以王室艱難寄臣方面亦已忘身許國誓于皇天伏惟陛下念臣懇至謹因勑使某官奉表以聞臣某云云謹言辭監察御史表上元元年進臣某言臣伏奉某月日勑除臣監察御史裏行依前充山南東道節度參謀忽承天澤不勝慶喜負荷恩任伏增憂懼臣在至德元年舉家逃難生幾于死出自賊庭逺如海濵敢望冠冕陛下過聽疑臣有才謀可用謂臣以忠正可嘉枉以公詔徴臣延問當時之事言未可取榮寵已殊事未可行授任過次其時以康元狡逆陛下憂勞臣亦不辭疲駑奉宣聖旨招集士卒師旅未成又逢張瑾姦凶再驚江漢臣恐陛下憂無制變遂曾表請用兵陛下嘉臣懇愚頻降恩詔聖私殊甚特加超擢至今臣自布衣未踰數月官沗風憲任兼戎旅今不勞兵革凶竪伏辜臣不可終以無能苟安非望自姦臣逆命于今六年愧無才能苟求祿位分符佩印不知慙羞戮辱及之死將不悔陛下忍而從者其可勝言臣才弱識下非智無謀循涯顧分實自知耻臣老母多病又無弟兄漂流殊鄉孤弱相養伏願陛下矜臣愚鈍不合齒于朝列念臣老母令臣得以奉養則聖朝無辱官之士山澤有純孝之臣不任悃𣢾之至謹遣某官奉表陳請以聞臣云云謹言為吕荆南謝病表臣某言臣自去秋疾疹以至今日轉加羸弱庶事不理某月日附某官口奏請替某月日又進狀陳情未蒙允許伏增憂懼陛下應以臣久曾驅策未忍替臣臣實憂陛下方隅切須鎮守臣不能起止四十餘日艱虞之際實慮變生今淮西敗散唐鄧危急在臣病廢豈敢偷安伏望天恩即與臣替儻餘生尚在得至闕庭犬馬之心死生願畢不勝懇欵之至謹遣某官奉表陳乞以聞云云請節度使表寶應元年進臣某言臣自以愚弱無堪逺迹江湖全身之外無所兾望陛下過聽徴臣顧問今臣起家數月之內官忝臺省爾來三歲無益效用愧耻之甚在臣無踰臣竊以荆南是國家安危之地伏願陛下不輕易任人陛下若獨任武臣則州縣不理若獨任文吏則戎事多闕自兵興巳來今八年矣使戰爭未息百姓勞弊多因任使不當致使敗亡伏惟陛下審擇重臣即日鎮撫全陛下上遊之地救愚臣不逮之急謹遣某官奉表以聞乞免官歸養表臣某言臣以為才不稱任位過其量不自知分禍辱皆及臣才不如人量實𥚹僻踰越秩次沗辱衣冠人亦有慙臣自知愧臣少以愚弱不願為吏書學自業老于儒家今迹在軍中日預戎事此過臣才分近于禍辱者矣臣常恐荒浪失于禮法自逸山澤預于生類今穢汚臺省紊亂時憲此過臣才分近于禍辱者矣伏惟陛下察臣才分不令亂官則貪冒苟進之徒自臣知耻陛下若官不失人則天下自理故曰天下理亂繫之官人臣以為官人之難無敢易者陛下焉可易于臣哉臣無兄弟老母久病所願免官奉養生死願足上不敢汚陛下朝列是臣之忠下不欲貽老母憂懼是臣之孝願全忠孝于今日免禍辱于將來伏惟陛下許臣免官許臣奉飬在臣慶幸無以比喻謹遣某官奉表陳請以聞云云謝上表廣德二年道州進臣某言去年九月勑授道州刺史屬西戎侵軼至十二月臣始于鄂州授勑牒即日赴任臣州先𬒳西原賊屠陷節度使巳差官攝刺史兼又聞奏臣在道路待恩命者三月臣以五月二十二日到州上訖耆老見臣俯伏而泣官吏見臣以無菜色城池井邑但生荒草登髙極望不見人煙嶺南數州與臣接近餘冦蟻聚尚未歸降臣見招輯流亡率勸貧弱保守城邑畲種山林兾望秋後少可全活臣愚以為今日刺史若無武略以制暴亂若無文才以救疲弊若不清廉以身率下若不變通以救時須一州之人不叛則亂將作矣豈止一州者乎臣料今日州縣堪征稅者無幾巳破敗者實多百姓戀墳墓者蓋少思流亡者乃衆則刺史宜精選御名擇以委任之固不可拘限官次得之貨賄出之權門者也凡授刺史特望陛下一年問其流亡歸復幾何田疇墾闢幾何二年問畜養比𥘉年幾倍可稅比𥘉年幾倍三年計其功過必行賞罰則人皆不敢兾望僥幸苟有所求臣實孱弱辱陛下符節陛下必當御名擇臣固宜廢歸山野供給井稅臣不任懇欵之至謹遣某官奉表陳謝以聞再謝上表永樂二年進臣某言某伏奉某月日勑再授臣道州刺史以某月日到州上訖臣前日在官雖百姓不至流亡而歸復者十無一二雖冦盜不犯邉鄙而不能兵救鄰州雖賦斂僅能供給而有司不無罪狀雖人吏似從教令而風俗未能移易臣又多病不無假故水旱災沴每嵗不兔疾疫死傷臣州尤甚以臣自訟合抵刑憲聖朝寬貸猶宜奪官陛下過聽重有授任伏恐守廉讓者以臣為苟安祿位抱公直者以臣為內懷私僻有材識者辱臣于臺隸之下用刑法者罪臣于程式之中臣所以不敢即日辭免待陛下按驗虛實然後歸罪有司今四方兵革未寧賦斂未息百姓流亡轉甚官吏侵尅日多實不合使凶庸貪猥之徒凡弱下愚之類以貨賂權勢而為州縣長官伏望陛下特加察問舉其功過必行賞罰以安蒼生誰不自私臣實不敢所言狂直朝夕待罪不任懇𣢾之至謹遣某官奉表陳謝廣德二年賀赦表臣某言伏奉某月日赦宣示百姓訖伏惟陛下以慈惠馭兆庶以謙讓化天下凡所赦宥皆允人望凡所敦勸皆合大經生識之類不勝大幸臣方領陛下州縣守陛下符節不得稱慶下位蹈舞闕庭不任歡戀之至永泰元年賀赦表臣某言某月日恩赦至州宣示百姓訖百姓貧弱者多勞苦日久忽蒙惠澤更相喜賀歡呼忭躍不自禁止伏惟陛下增修典禮弘正紀度勞謙慈惠與人更新此實興王之盛烈明主之至德戴履天地誰不慶幸臣方守州縣不得蹈舞闕庭無任歡欣之至請省官狀乾元三年上來大夫唐鄧等州縣官右方城縣奮萬餘戶今二百戶已下其南陽向城等縣更破碎于方城每縣正員官及攝官共有六十人以前件如前自經逆亂州縣殘破唐鄧兩州實為尤甚荒草千里是其疆畎萬室空虛是其井邑亂骨相枕是其百姓孤老寡弱是其遺人哀而恤之尚恐冤怨肆其侵暴實恐流亡今賊冦慿凌鎮兵資其給飬今河路阻絶郵驛在其供承若不觸事救之無以勞勉其苦為之計者在先省官其方城湖陽等縣正官及攝官并戶口多少具狀如前每縣伏望量留令并佐官一人餘並望勒停謹録狀上請給將士父母糧狀上元元年上來大夫當軍將二千人父隨子者四人母隨子者二十八人以前件如前將士父母等皆因喪亂不知所歸在于軍中為日亦久夫孝而仁者可與言忠信而忠信者可以全義勇豈有責其忠信使之義勇而不勸之孝慈恤以仁惠今軍中有父母者皆共分衣食先其父母寒餒日甚未嘗有辭其將士父母等伏望各量事給其衣食則義有所存恩有所及俾人感勸實在于此謹録狀上請收飬孤弱狀上元元年上來大夫當軍孤弱小兒都七十六人張季秀等三十九人無父母周國良等三十七人有父兄在軍以前件狀如前小兒等無父母者鄉國淪陷親戚俱亡誰家可歸傭丐未得有父兄者其父兄自經艱難久從征戌多以忠義遭逢誅賊有遺孤弱子不忍棄之力相恤飬以至今日乞令諸將有孤兒投軍者許收驅使有孤弱子弟者許令存飬當軍小兒先取回殘及回易雜利給飬謹録狀上舉吕著作狀寶應元年奏故荆南節度觀察使江陵尹兼御史大夫吕諲姪男季重右見任祕書省著作郎以前件狀吕某立身無私歷官清儉身沒之後家無餘財長男幼小未了家事前件姪質性純厚識理通敏仁孝之性不慙古人自其疾甚不視事向五六十日軍府之事皆季重咨問事無大小處之無情以臣所見季重不獨為賢子弟今時榖湧貴道路多虞漂流異鄉無以自給伏望天恩與季重便近州一正員官令其恤飬孤幼謹録奏聞伏聽勑旨奏免科率狀廣德二年奏勑依當州準勑及租庸等使徴率錢物都計一十三萬六千三百八十八貫八百文一十三萬二千四百八十貫九百文嶺南西原賊未破州已前三千九百七貫九百足賊退後徴率以前件如前臣自到州見庸租等諸使文牒令徴前件錢物送納臣當州𬒳西原賊屠陷賊停留一月餘日焚燒糧儲屋宅俘掠百姓男女驅殺牛馬老少一州幾盡賊散後百姓歸復十不存一資産皆無人心嗷嗷未有安者若依諸使期限臣恐坐見亂亡今來未敢徴率伏待進止又嶺南諸州冦盜未盡臣州是嶺北界守捉處多若臣州不安則湖南皆亂伏望天恩自州未破巳前百姓久負租稅及租庸等使所有徴率和市雜物一切放免自州破巳後除正租正庸及準格式合進奉徴納者請據見在戶徴送其餘科率並請放免容其見在百姓産業稍成逃亡歸復似可存活即請依常例處分伏碩陛下以臣所奏下議有司苟若臣所見愚僻不合時政千亂紀度事涉虛妄忝官尸祿欺上罔下是臣之罪合正典刑謹録奏聞奏免科率等狀永泰二年奏勑依當州奏永泰元年配供上都錢物總一十三萬二千六百三十三貫三十五文四萬一千二十六貫四百八十九文請據見在堪差科徴送九萬一千六百六貫五百四十六文配率請放免以前件如前臣當州前年陷賊一百餘日百姓𬒳焚燒殺掠幾盡去年又賊逼州界防捍一百餘日賊攻永州陷邵州臣州獨全者為百姓捍賊今年賊過桂州又團練六七十日丁壯在軍中老弱餽糧餉三年已來人實疲苦臣一州當嶺南三州之界守捉四十餘處嶺南諸州不與賊戰每年賊動臣州是境上之州若臣州陷破則湖南為不守之地在于徴賦稍合優矜今使司配率錢物多于去年一倍巳上州縣徴納送者多于去年二分已下申請矜減使司未許伏望陛下以臣所奏令有司類會諸經賊陷州據合差科户臣當州每年除正租正庸外更合配率幾錢庶免使司隨時加減庶免百姓每歲不安其今年輕貨及年支米等臣請準狀處分謹録奏聞論舜廟狀永泰二年奏勑依右謹按地圗舜陵在九疑之山舜廟在太陽之溪舜陵古老以失太陽溪今不知處秦漢巳來置廟山下年代寖逺祠宇不存每有詔書令州縣致祭奠酹荒野恭命而巳豈有盛德大業百王師表殁于荒裔陵廟皆無臣謹遵舊制于州西山上已立廟訖特乞天恩許蠲免近廟一兩家令嵗時拂灑示為恆式豈獨表聖人至德及于萬代實欲彰陛下玄澤及于無窮謹録奏聞舉處士張季秀狀永泰二年奏勑依臣州僻在嶺隅其實邉裔土風貪于貨賄舊俗多習史事獨季秀能介直自全退守廉讓文學為業不求人知寒餒切身彌更守分貴其所尚願老山林臣切以兵興巳來人皆趨競苟利分寸不愧其心則如季秀者不可不加褒異臣特望天恩令州縣取其穩便與造草舍十數間給水田一兩頃免其當戶徭役令得保遂其志此實聖朝旌退讓之道亦為士庶識廉耻之方謹録奏聞唐元次山文集卷第十
