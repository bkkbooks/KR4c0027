front:
  text: 唐元次山文集拾遺
  hash: sha256:c61a403047e519cc4f99a4f6d6d0502ca420db60adc1f5379472c55d5b9cb56d
  markers:
  - {type: page-break, offset: 0, content: '', id: KR4c0027_SBCK_012-1a}
body:
  text: 縣令針古今所貴有土之官當其選授何嘗不難為其動靜是人禍福為其噓吸作人寒燠煩則人怨猛則人懼勿以賞罰因其喜怒太寬則慢豈能行令太簡則踈難與為政既明且斷直焉無情清而且惠果然必行或曰關由上官事不自我辭讓而去有何不可誰欲字人贈君此針豈獨書紳可以銘心五規出規元子門人叔將出逰三年及還元子問之曰爾去我久矣何以異乎諾曰叔將始自山中至長安見權貴之盛心憤然切悔比年于空山窮谷與夫子甘飢寒愛水木而巳不數月自王公大夫卿相近臣之門無不至者及一年有向與歡宴過之可弔有始賀拜侯已聞就誅豈不裂封疆土未識豈無印綬懷之未暖其客得祿位者隨死得金玉者皆孥參逰宴者或刑或免叔將之身如犬逃者五六似鼠藏者八九當其時環望天地如置在杯斗之中元子聞之嘆曰叔將汝何思而為乎汝若思為社稷之臣則非正直不進非忠讜不言雖手足斧鉞口能出聲猶極忠言與氣偕絶汝若思為祿位之臣猶當避赫赫之路晦顯顯之機如下廄粟馬齒食而巳汝忽然望權勢而往自致身于刑禍之方得筋骨載肉而歸幸也大矣二三子以叔將為戒乎處規州舒吾問元子曰吾聞子多矣意將何為對曰雲山幸不求吾是林泉又不責吾非熙然能自全順時而老可矣復安為哉舒吾曰元子其過誤乎其太矯也吾厭世人飾言以由道藏智以全璞退身以顯行設機以樹名吾子由之使我何信元子俯而謝之滕許大夫友元子聞不應舒吾之説乃曰嗟嗟元子少辭者耶何不曰使吾得所處但如山林不見吾是非吾將娭音稀往也以子為飾言藏智退身設機何不曰如此豈不多于盜權竊位蒙汙萬物富貴始及而刑禍促之者乎元子謝不及季川問曰兟兟凡之别稱義載尓雅終不復二論兟有意乎于戲季川吾有言則自是言逹則人非吾安能使吾身之有是而令他人之有非至於聞聞也哉戲規元子友倚于雲丘之顛戲牧兒曰爾為牧歌當不責爾暴牧兒歌去乃暴他田田主鞭之啼而冤元子啼不止召其父而止之元子友真卿聞之書過于元子曰嗟嗟次山苟戲小兒俾陷鞭焉而蒙冤之彼牧兒望次山猶臺隸不敢干其主及苟戲乃或與次山猶仇讎斯豈慎德也歟吾聞君子不苟戲無似非如何惑一兒使不知所以蒙過此非苟戲似非之非者耶惡不必易此元子報真卿曰于戲吾獨立于空山之上戲歌牧兒得過幾不可免彼行于世上有愛憎相忌是非相反名利相奪禍福相從至于有蒙戮辱者焉得不因苟戲似非世兒惑之以及者乎真卿吾當以戲為規心規元子病逰世歸于商餘山中以酒自肆有醉歌里夫公聞之音多元子之酒請歌之歌曰元子樂矣俾和者曰何樂亦然何樂亦然我曰我雲我山我林我泉又曰元子樂矣俾和者曰何樂然爾何樂然爾我曰我鼻我目我口我耳歌已矣夫公曰自樂山林可也自樂耳目何哉人誰無此元子引酒當夫公曰勸君此杯酒緩飲之聽我説子行于丗間目不隨人視耳不隨人聽口不隨人語鼻不隨人氣其甚也則須封包裹塞不爾有滅身亡家之禍傷汙毁辱之患生焉雖王公大人亦不能自主口鼻耳目夫公何思之不熟耶時規乾元己亥漫叟待詔在長安時中行公掌制在中書中書有醇酒時得一醉醉中叟誕曰願窮天下鳥獸蟲魚以充殺者之心願窮天下醇酎美色以充欲者之心中行公聞之歎曰子何思不盡耶何不曰願得如九州之地者億萬分封君臣父子兄弟之爭國者使人民免賊虐殘酷者乎何不曰碩得布帛錢貨珍寶之物溢于王者府藏滿將相權勢之家使人民免飢寒勞苦者乎叟聞公言退而記之授于學者用為時規惡圎元子家有乳母為圎轉之器以悅嬰兒嬰兒喜之母使為之聚孩孺助嬰兒之樂友人公植者聞戲兒之器諸見之及見之趍焚之責元子曰吾聞古之惡圎之士歌曰寧方為皂不圎為卿寧方為汚辱不圎為顯榮其甚者則終身不仰視曰吾惡天圎或有喻之以天大無窮人不能極逺視四垂因謂之圎天不圎也對曰天縱不圎為人稱之我亦惡焉次山奈何任造圓轉之器恣令悅媚嬰兒少喜之長必好之教兒學圖且陷不義躬自戲圎又失方正嗟嗟次山入門愛嬰兒之樂圎出門當愛小人之趍圎吾安知次山異日不言圎行圎動圎靜圎以終身乎吾豈次山之友也元子召季川謂曰吾自嬰兒戲圎公植尚辱我言絶忽乎吾與汝圎以應物圎以趍時非圎不預非圎不為公植其操矛戟刑我乎惡曲元子時與鄰里會曲全當時之歡以順長老之意歸泉上叔盈問曰向夫子曲全其歡道然也苟為爾乎元子曰叔盈視吾曲其心以徇財利曲其行以希名位當過吾吾苟全一歡于鄰里無惡然可也東邑有全直之士聞元子對叔盈恐曰吾聞元次山約其門人曰無惡我之小曲真惛鄙惡辭也吾輩全直三十年未嘗曲氣以轉聲曲辭以逹意曲步以便往曲視以回目猶患于古人古人有惡曲者不曲臂以取物不曲膝以便坐見天下有曲于君曲于民曲于鬼神者往劫而死之今元次山苟曲言矣強全一歡以為不喪其直慁哉若能苟曲于鄰里強全一歡豈不能苟曲于鄉縣以全言行苟能曲于鄉縣豈不能苟曲於邦國以彰名譽能苟曲于邦國豈不能苟曲于天下以揚德義若言行名譽德義皆顯豈有鍾鼎不入門權位不在已乎嗚呼曲為之小為大之漸曲為之也有何不可姦邪凶惡其囮音由乎元子聞之頌曰吾以顔貌曲全一歡全直君子之惡我如此猶有過于此者何以自免水樂説元子于山中尤所耽愛者有水樂水樂是南磳之懸水淙淙然聞之多久于耳尤便不至南磳即懸庭前之水取欹曲竇缺之石髙下承之水聲少似聽之亦便訂司樂氏或有將元子水樂説于司樂氏樂官聞之謂元子曰能和分五音韻諧水聲可傳之來請觀學元子辭之使門人以南磳及庭前懸水指之樂氏醜惡慢罵曰韻瞶多矣焉有聽而云樂乎此言聞元子元子謝曰次山病餘惛固自順于空山窮谷偶有懸水淙石冷然便耳醉甚或與酒徒戲言呼為水樂不防君子過聞而來實汚辱君子之車僕樂官去季川問曰尚兟謝樂官不亦過甚曰然吾為汝訂之汝豈不知彼為司樂之官老矣八音教其心五聲傳其耳不得異聞則以為錯亂紛惑甚不可聽况懸水淙石宫商不能合律吕不能主變之不可會之無由此全聲也司樂氏非全士安得不甚謝之嗟乎司樂氏欲以金石之順和絲竹之流妙宫商角羽豐然迭生以化全士之耳猶以懸水淙石激淺注深清瀛浥溶不變司樂氏之心嗚呼天下誰為全士能愛夫全聲也浪翁觀化并序浪翁山野浪老也聞元子亦浪然在山谷病中能記水石草木蟲豸之化亦來説常所化凡四説有無相化浪翁曰隂陽之氣化為四時四時之行化為萬物萬物形全是無化有萬物形盡是有化無此有無相化之説有化無浪翁曰人或云我立于東西望萬里目極則無人我兩忘終世相無此有化無之説無化有浪翁曰人或云我來于南北行萬里至無不有人我兩求終世相有此無化有之説化相化浪翁曰吾觀化于無也何無不有吾觀化于有也何有不無有無更化日以相化化言何極化言何窮時化元子聞浪翁説化化無窮極因論諭曰翁亦未知時之化也多于此乎曰時焉何化我未之記元子曰于戲時之化也道德為嗜欲化為險薄仁義為貪暴化為凶亂禮樂為耽淫化為侈靡政教為煩急化為苛酷翁能記于此乎時之化也夫婦為溺惑所化化為犬豕父子為惛欲所化化為禽獸兄弟為猜忌所化化為讎敵宗戚為財利所化化為行路朋友為世利所化化為市兒翁能記于此乎時之化也大臣為威權所恣忠信化為姦謀庶官為禁忌所拘公正化為邪佞公族為猜忌所限賢哲化為庸愚人民為征賦所傷州里化為禍邸姦凶為恩幸所迫厮皂化為將相翁能記于此乎時之化也山澤化為井陌或曰盡於草木原野化為狴犴或曰殫于鳥獸江湖化為鼎鑊或曰暴于魚鱉祠廟化為宫寢或曰數于祠禱翁能記于此乎時之化也情性為風俗所化無不作狙狡詐誑之心聲呼為風俗所化無不作諂媚僻淫之亂顔容為風俗所化無不作姦邪蹙促之色翁能記於此乎世化浪翁聞元子説時化嘆曰吾昔聞世化可説又異于此昔世之化也天地化為斧鑕日月化為豺虎山澤化為州里草木化為宗族風雨化為邸舍雪霜化為衣裘呻吟化為常聲糞汚化為梁肉一息化為千嵗烏犬化為君子元子惑之浪翁曰子不聞往昔世之化也四海之內巷戰門鬬斷骨腐肉萬里相藉天地非斧鑕也耶人民暗夜盜起求食晝逰則死傷相及日月非虎豺也耶人民相與寄身命于絶崖深谷之一底始能聲呼動息山澤非州里也耶人民奔走非深林薈叢不能藏蔽草木非宗族也耶人民去鄉國入山海千里一息力盡暫休風雨非邸舍也耶人民相持於死傷之中祼露而行霜雪非衣裘也耶人民勞苦相冤瘡痍相痛老弱孤獨相苦死亡不能相救呻吟非常聲也耶人民多飢餓溝瀆病傷道路糞汚非梁肉也耶人民奔亡潛伏戈矛相拂前傷後死免而存者一息非千歲也耶僵王腐卿相枕路隅鳥獸讓其骨肉烏犬非君子也耶唐元次山文集拾遺終
