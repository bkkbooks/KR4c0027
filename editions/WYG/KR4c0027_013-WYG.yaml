body:
  text: 劉侍御月夜讌㑹序兵興已來十一年矣獲與同志歡醉達旦詠歌取適無一二焉乙巳嵗彭城劉靈源在衡陽逢故人或有在者日昔相㑹第歡逺遊始與諸公待月而笑語竟與諸公愛月而歡醉詠歌夜久賦詩言懐於戲文章道喪葢久矣時之作者煩雜過多歌兒舞女且相喜愛系之風雅誰道是耶諸公嘗欲變時俗之淫靡為後生之規範今夕豈不能道達情性成一時之美乎送孟校書往南海序平昌孟雲卿與元次山同州里以辭學相友㡬二十年次山今罷守舂陵雲卿始典校芸閣於戲材業次山不如雲卿辭賦次山不如雲卿通和次山不如雲卿在次山又詡然求進者也誰言時命吾欲聴之次山今且未老雲卿少次山六七嵗雲卿名聲滿天下知巳在朝廷及次山之年雲卿何事不可至勿隨長風乗興蹈海勿愛羅浮往而不歸南海幕府有樂安任鴻與次山最舊請任公為次山一白府主趣資裝雲卿使北歸慎勿令徘徊海上諸公第醉歌送之送譚山人歸雲陽序吾於九疑之下賞愛泉石今㡬三年能扁舟數千里來遊者獨雲陽譚子譚子文學隠名山野隠身雲陽之阿世如君何牧犢愛雲陽之宰峻公不出南岳三十年今得雲陽一峯譚子又在焉彼真可家之者耶子去為吾謀於牧犢近峻公有泉石老樹夀藤縈垂水可灌田一夫火可燒種菽果近泉可為十數間茅舍所詣纔通小船則吾往而家矣此邦舜祠之竒怪陽華之殊異潓泉之勝絶見峻公與牧犢一二説之松竹滿庭水石滿堂石魚負樽鳬舫運觴醉送譚子歸于雲陽漫叟元次山序别崔曼序漫叟年將五十與時世不合垂三十年愛惡之聲紛紛人間博陵崔曼惑叟所為遊而辨之數月未去㑹潭州都督張正言薦曼為屬邑長將行叟謂曰叟異時乃山林一病民耳宜不相㒺行矣勿惑吾子有才業且明辯又方年少必能樹勲庸垂名聲若求先達賢異能相扙拭正在張公張公往年在西城王人能用其一言遂開城千里威震絶域張公往在淮南逡巡指麾萬夫風従遭逢猜疑弛而不為今海内兵革未息張公必為時用吾子勉之所相規者所宜緩步富貴従容謀畫少節酒平氣槩耳送王及之容州序乾元中漫叟浪家于瀼溪之濵以耕釣自全而巳九江之人未相喜愛其意似懼叟衣食之不足耳叟亦不促促而従之有王及者異夫鄉人焉以文學相求不以羇旅見懼以相安為意不以可否自擇及於叟也如是之多叟在春陵及能相従遊嵗餘而去將行規之曰叟愛及者也無惑叟言及方壯可强藝業勿以遊方為意人生若不能師表朝廷即當老死山谷彼區區於財貨之末局局於權勢之門縦得鍾鼎亦胡顔受納行矣自愛耿容州歡於叟者及到容州為叟謝主人聞幕府野次久矣正宜收擇謀夫引信才士有如及也能収引乎二三子賦送逺之什以系此云問進士永泰二年通州問第一問天下興兵今十二年矣殺傷勞辱人似未厭控强兵據要害者外以奉王命為辭内實理車甲招賔客樹爪牙國家亦因其所利大者王而相之亞者公侯尚不滿望今欲散其士卒使歸鄉里收其器械納之王府隨其才分與之禄位欲臨之以威武則力未能制欲責之以辭譲則其心未喻若捨而不問則未覩太平秀才通明古今才識傑異天下之兵須解蒼生須致仁夀其策安出子其昌言第二問往年天下太平仕者非累資序積勞考二十許年不離一尉至于入廊廟總樞轄則當時名聲籍甚者得至焉今商賈賤類臺隸下品數月之間大者上汗卿監小者下辱州縣至於廊廟不無雜人如専經以求進主文而望達者若不困頓於林野則必悽惶於道路今日國家行何道得九流鑑清作何法得僥倖路絶施何令使人自知恥設何教使賢愚自分第三問開元天寳之中耕者益力四海之内髙山絶壑耒耜亦滿人家糧儲皆及數嵗太倉委積陳腐不可挍量忽遇凶年穀猶耗盡當今三河膏壤淮泗沃野皆荆棘已老則耕可知太倉空虛省鼠猶餓至于百姓朝暮不足而諸道聚兵百有餘萬遭嵗不稔將何為謀今欲勸人耕種則喪亡之後人自貧苦寒餒不救豈有生資今欲罷兵息戍則又寇盜猶在尚須防遏使國家用何策得人安俗阜不戰無兵用何謀使縦遇凶年亦無灾患第四問往年粟一斛估錢四百猶貴近年粟一斛估錢五百尚賤往年帛一匹估錢五百猶貴近年帛一匹估錢二千尚賤今耕夫未盡織婦猶在何故往年耕織計時量力勞苦忘倦求免寒餒何故今日甘心寒餒惰遊而巳於戲曩時粟帛至賤衣食至易今日粟帛至貴衣食至難而人心勤惰如此其何故也試一商之欲聞其説第五問古人識貴精通學重兼博不有激發何以相求三禮何篇可刪三傳何者可廢墨氏非樂其禮何以儒家委命此言當乎彼天女天孫不知何物彼日兄月姊弟妹是誰駔儈與傖奴寧分一純將二精何説孤竹之君何姓新城老婦何名棘竹出自何方毒銅産於何國何鄉無水可飲何地臥氷而温何人恩信過于田横何人壯勇等於闗侯何人鑿坏而遁何人終日掃門無淺近之不為悉説次山集巻七欽定四庫全書次山集卷八唐元結撰時議三篇有表臣某言臣自以昏庸無堪逸浪江海陛下忽降公詔逺徵愚臣陛下豈不以凶逆未除盜賊屢起百姓勞苦力用不足將社稷大計與天下圖之者乎荒野賤臣始見軒陛又拘限忌諱不能悉下情以上聞則陛下又安用煩勞車乗招禮賢異臣實不能當君子之羞受小人之辱故編輿皁之説為三篇名曰時議敢以上聞抵冐天威謹伏待罪臣結頓首謹上乾元二年九月日前進士元結表上時議上篇時之議者或相問曰往年逆亂之兵東窮江海南極淮漢西抵秦塞北盡幽都今趙衞之疆悉為盜有凶勇之徒在四方者㡬百餘萬如屯守二京従衞魁帥者不計當時之兵可謂强矣當時人心已不固矣天子獨以數騎僅至靈武引聚餘弱憑陵强寇頓軍岐陽師及渭西曽不踰時竟摧堅鋭復兩京逃降逆類悉收河南州縣今河北隴隂姦逆尚餘今山谷江湖稍多忘命今所在盜賊屢犯州縣今天下百姓咸轉流亡今臨敵將士多喜奔散今賢士君子不求任使天子往在靈武至于鳳翔無今日兵革而能勝敵無今日禁制而無亡命無今日威令而盜賊不起無今日財用而百姓不亡無今日封賞而將士不散無今日朝廷而人思任使何哉豈天子能以弱制强不能以强制弱豈天子能以危求安而忍以未安忘危時之議者或相對曰此非難言甚易言矣天子往年悲恨陵廟為凶逆傷汚怨憤上皇忽南幸巴蜀哀傷宗戚多見誅害驚惶聖躬動息無所是以勤勞不辭親撫士卒與人權位信而不疑渴聞忠直過則喜改如此所以能以弱制强以危求安今天子重城深宮謙和而居冕旒清晨纓佩而朝太官具味當時而食太常修樂和聲而聴軍國機務㕘詳而進萬姓疾苦時或不聞而廏有良馬宫有美女輿服禮物日月以備休符佳瑞相繼而有朝廷歌頌盛徳大業四方貢賦尤異品物公族姻戚喜符帝恩諧臣戲官怡愉天顔而文武大臣至於公卿庶官皆權位爵賞名實之外自已過望此所以不能以强制弱忍以未安忘危若天子能視今日之安如靈武之危事無大小皆若靈武何寇盜强弱可言當天下日無事矣時議中篇時之議者或相謂曰吾聞道路云云説士人共自謀曰昔我奉天子拒凶逆勝敵則家國兩全不勝則家國兩亡所以生死決戰是非極諫今吾屬名位巳重財貨已足爵賞已厚勤勞巳極天下若安吾何苦哉天下若不安吾屬外無仇讐相害内無窮賤相追何苦更當鋒刃以近死乎何苦更忤人主以近禍乎又聞之曰嗚呼吾州里有忠義之者仁信之者方直之者今或有病父老母孤兒寡婦如身能存者力役乞丐凍餒不足況於死者父母妻子人誰哀之又聞曰今天下殘破蒼生危急受賦役者多寡弱貧獨流亡死生悲憂道路亦極矣天下若安我等豈無隴畝以自處若不安我等不復以忠義仁信方直死矣縦有益於我者安則隨之人且如此其然何故時之議者相對曰今國家非欲其然葢失於太明太信而然耳夫太明則見其内情將蔵内情則㒺惑生焉㒺上惑下能今必信信可必矣故太信焉太信之中至姦元惡卓然而存如此使朝廷遂亡公直天下遂失忠信蒼生遂益寃怨如公直亡矣忠信失矣寃怨生矣豈天子大臣之所喜乎將欲理之能無端由吾屬議於野者又何所及時議下篇時之議者或相問曰今天子思安蒼生思滅姦逆思致太平方力圖之非不勤勞於今四年而説者異之何哉時之議者或相對曰如天子所思如説者所異天子大臣非不知之凡有制誥皆嘗言及言雖慇懃事皆不行前後再三頗類諧戲今或有仁恤之詔憂勤之誥人皆族立黨語指而議之其由何哉以言而不行之故也天子不知其然以為言雖不行足堪沮勸嗚呼沮勸之道任明審均當而必行也必不行矣有言何為自太古以來致理與化未有言之不行而能致矣若天子能追行巳言之令必行將來之法且免天下無端雜徭且除天下隨時弊法且去天下拘忌煩令必任天下賢異君子屏斥天下姦邪小人然後推仁信威令與之不惑此帝王常道何為不及管仲論自兵興已來今三年論者多云得如管仲者一人以輔人主當見天下太平矣元子異之曰嗚呼何是言之誤耶彼管仲者人耳正可與議私家畜養之計正可以修鄉里畎澮之事如此仲當少容與焉至如相諸侯材量亦似不足致齊及霸材量極矣使仲見帝王之道興國之禮則天子之國不衰諸侯之國不盛如曰不然請有所説仲之相齊及齊彊富則合請其君恢復王室節正諸侯君若惑之則引禍福以喻之如約諸侯之説君既聴矣然後約諸侯曰今王室將卑諸侯更彊文王風化殘削向盡武王疆域割奪無㡬禮樂不知其由征伐何因而出我是故謹疆域勉日夜望振兵威可臨列國得與諸侯㑹盟一旦能新復天子之正朔更定天子之封畿上奉天子復先王之風化下令諸侯復先公之制度以為何如若皆不従我則以兵臨於魯魯不敢不従則與魯西臨宋鄭宋鄭従則與三國北臨燕衞燕衞従則與諸國西臨秦晉秦晉従則與七國以尺簡約呉楚呉楚従則天下無不従之國然後定約若有果不従者則約従者曰吾屬以禮義尊天子以法度正諸侯使小國不常患弱大國不敢怙彊此誠長世之䇿若天子國亡則諸侯交爭兵戈相臨誰為彊弱則安得世世禮讓相服宗廟血食我是故力勸諸侯尊天子今謀國猶豫宜往問之君不従約則與諸侯率兵伐之分其疆土遷其子孫留百里之地奉其宗社下為諸侯廣子孫之業上為天子除不順之臣何如如此則諸侯誰敢不従然後定天子封畿諸侯疆域輿服器玩禮樂法度征賦貢輸自齊魯節正節正既定乃共盟曰有貳約者當請命天子廢其驕凶以立恭順廢其荒惑以立明哲敢不聴者伐而分之如初約制定於是諸侯先各造邸於天子之都諸侯乃相率朝覲已而従天子齋戒拜宗廟禮畢天子誓曰於戲王室之卑久矣予不敢望皇天后土之所覆載將旦暮皁隸於諸侯不可則願全肌骨下見先王今諸侯不忘先王之大徳不忘先公之忠烈共力正王室俾子主先王宗祀子若昏荒淫虐不納諫諍失先王法度上不能奉宗祀下不能安人民爾諸侯當理爾軍卒修爾矛㦸約爾列國罪予凶惡嗣立明辟予若能日勉孱弱力遵先王法度上奉宗祀下安人民爾諸侯當保爾疆域安爾人民修爾貢賦共予郊祀予有此誓豈云及予將及來世予敢以此誓誓於宗廟予敢以此誓誓於天地諸侯聞天子之誓相率盟曰天子有誓俾我諸侯世世得力扶王室使先王先公徳業永長諸侯其各銘天子之誓傳之後嗣我諸侯重自約曰諸侯有昏惑當如前盟若天子昏惑不嗣虐亂天下諸侯當力共規諷諫諍如甚不可則我諸侯共率禮兵及王之畿復諫諍如初又甚不可進禮兵及王之郊終不可進禮兵及王之官兵及王之宫矣當以宗廟之憂咨之當以人民之怨咨之當以天子昔誓咨之當以諸侯昔盟咨之以不敢欺先王先公告之以不敢欺皇天后土告之然後如天子昔誓如諸侯昔盟使管仲能如此則周之天子未為奴矣諸侯之國則未亡矣秦於天下未至是矣如曰仲才及也君不従也仲智及也時不可也則仲曽是謀也乎君不従之也歟仲曽是為也乎時之不可也歟况今日之兵不可以禮義節制不可以盟誓禁止如仲之輩欲何為矣䆿五計反論元子天寳中曽預讌於諫大夫之座酒盡而無以續之大夫歎曰諫議散冗者貧無以繼酒嗟哉元子醉中議之曰大夫頗能用一謀令大夫尊重如侍中威權等司隸何若大夫問謀對曰得䆿婢一人在人主左右以䆿言先諷則可請有所説大夫不聞古有邰湯一反侯侯家得䆿婢寐則䆿言言則侯輒鞭之如是一嵗婢䆿如故侯無如婢何有夷奴每厭勞辱􅄰則假䆿其言似不怨而若忠信侯聞問之則曰素有䆿病寐中䆿言非所知也引䆿婢自辨辭説云云侯疑學婢鞭之不止髠之鉗之奴䆿愈甚奴於是重窺侯意先事䆿説説侯之過警以禍福侯又無如奴何客有知侯禍機因䆿奴之先扣侯門諫侯以改過免禍侯納客為上賔復方又反其奴命曰䆿良氏子孫世在于邰大夫誠能學奴效婢假䆿言以譏諫人主悔過追誤與天下如新大夫見尊重威權何止侍中司隸大夫乃歎曰嗚呼吾謂今之士君子曽不如邰侯夷奴丐論天寳戊子中元子遊長安與丐者為友或曰君友丐者不太下乎對曰古人鄉無君子則與雲山為友里無君子則與松竹為友坐無君子則與琴酒為友出遊於國見君子則友之丐者今之君子吾恐不得與之友也丐者丐論子能聴乎吾既與丐者相友喻求罷丐友相喻曰子羞吾為丐耶有可羞者亦曽知之未也嗚呼於今之世有丐者丐宗屬於人丐嫁娶於人丐名位於人丐顔色於人甚者則丐權家奴齒以售邪妄丐權家婢顔以容媚惑有自富丐貧自貴丐賤於刑丐命命不可得就死丐時就時丐息至死丐全形而終有不可丐者更有甚者丐家族於僕圉丐性命於臣妾丐宗廟而不取丐妻子而無辭有如此者不為羞哉吾所以丐人之棄衣丐人之棄食提􅑥倚杖在於路傍且欲與天下之人為同類耳不然則無顔容行於人間夫丐衣食貧也以貧乞丐心不慙迹與人同示無異也此君子之道君子不欲全道耶幸不在山林亦宜且􅑥杖隨我作丐者之狀貌學丐者之言辭與丐者之相逢使丐者之無恥庶㡬世始能相容吾子無矯然取不容也於戲丐者言語如斯可為丐論以補時規漫論并序乾元已亥至寳應壬寅䝉時人相誚議曰元次山嘗漫有所為且漫辭官漫聞議云云因作漫論論曰世有規儉大夫持規之徒來問叟曰公漫然何為對曰漫為何似然對曰漫然規者怒曰人以漫指公者是他家惡公之辭何得翻不惡漫而稱漫為漫何簡括漫何操持漫何是非漫不足準漫不足規漫無所用漫無所施漫焉何效漫焉何師公髮巳白無終惑之叟俛首而謝曰吾不意公之説漫而至於此意如所説漫焉足恥吾當於漫終身不羞著書作論當為漫流於戲凡流百氏有定限耶吾自分張獨為漫家規簡之徒則奈我何化虎論都昌縣大夫張粲君英將之官與其友賈徳方元次山别且曰吾邑多山澤可致麕鹿為二賢羞賔客何如及到官書與二友曰待我化行旬月使虎為鹿豺為麕梟為鷓鴣蝦蟇為兔將以豐江外庖㕑豈獨與徳方次山之羞賔客也徳方對曰嗚呼兵興嵗久戰爭日甚生人怨痛何時休息君英之化豈及豺虎將恐虎窟公城豺遊公庭梟集公楹羣蛙匝公而鳴敢以不然之論返化君英賈徳方報君英化虎之論宜豈直望化虎哉次山請商之君英所謂待吾化豺虎然後羞於屬也其意葢欲待朝廷化小人為君子化諂媚為公直化奸逆為忠信化競進為退讓化刑法為典禮化仁義為道徳使天下之人皆涵純樸豈止化虎而羞我哉徳方未量君英耶次山故編所言為化虎之論辯惑二篇有序議者多惑朱公叔第五興先所為故引之作辯惑二篇以喻惑者其意亦欲將辯惑與時人為勸懼之方上篇昔南陽朱公叔為冀州刺史百城長吏多懼罪自去公叔不舉法彈理之聴其去官而已惑者曰公叔才達者也茍能威畏茍能逃罪當下自新之令不問前時之過公叔之為也是哉辯者曰嗚呼先王作法令葢欲禁貪邪絶凶暴使人不得茍免是以惡䝉異世之誅善及子孫之賞若法令不行則無以沮勸茍失沮勸則賞罰何為嗚呼先王懼人民自相侵害故官人以理之加其爵禄使其富貴葢為其能理養人民者也彼乃絶理養之心以殺奪為務去而不理而曰是乎豈有冠冕軒車佩符持節取先王典禮以為盜具將天下法令而為盜資乎致使金寳千嚢財貨百車令彼盜類各為富家公叔不理奈何咨嗟下篇昔第五興先為詔使舉奏刺史二千石䝉削免者甚衆興先以奉使稱職獲遷官焉惑者曰興先能糾劾過惡直哉使臣遷秩次也宜乎辯者曰夫理人貴久其法明其禁使人知常且長也漢家法不常耶禁不長耶何得興先暴將威令急操刑獄使䝉戮辱者如斯多乎若漢家天下法禁皆如冀州四方詔使皆如興先則亂生於令出禍作於遣使誰為惑者聴我商之嗚呼畏陷人於法故先於禁制有抵犯者理而刑之示其必常也人始知懼先王欲人自新故為善者賞之俾人勸而無懼然後乃理所以施賞罰於人民令似衣冠不可脱去如此慇懃乃能措刑殺致太平耳故曰賞善而不罰惡則亂罰惡而不賞善亦亂賞罰不行與過差必止若如此漢家之法在乎興先之為是也乎衆人之惑喻乎喻友天寳丁亥中詔徵天下士人有一藝者皆得詣京師就選相國晉公林甫以草野之士猥多恐洩漏當時之機議於朝廷曰舉人多卑賤愚瞶五拜反不識禮度恐有􅀈良士反言汙濁聖聴於是奏待制者悉令尚書長官考試御史中丞監之試如常吏如吏部試詩賦論䇿巳而布衣之士無有第者遂表賀人主以為野無遺賢元子時在舉中將東歸鄉人有苦貧賤者欲留長安依託時權徘徊相謀因諭之曰昔世已來共尚丘園潔白之士葢為其能外獨自全不和不就飢寒切之不為勞苦自守窮賤甘心不辭忽天子有命聘之𤣥纁束帛以先意薦論擁篲以導道欲有所問如咨師傳聴其言則可為規戒考其行則可為師範用其材則可為經濟與之權位乃社稷之臣君能忘此而欲隨逐駑駘入棧􅇫中食下廏藖麧上侯辨反下下沒反為人後騎負皁隸受鞭䇿耶人生不方正忠信以顯榮則介潔靜和以終老鄉人於是與元子偕歸於戲貴不専權㒺惑上下賤能守分不茍求取始為君子因喻鄉人得及林甫言意可存編為喻友次山集巻八欽定四庫全書次山集巻九唐元結撰元魯縣墓表天寶十三載元子從兄前魯縣大夫徳秀卒元子哭之哀門人叔盈問曰夫子哭從兄也哀不亦過乎禮歟對曰汝知禮之過而不知情之至叔盈退謂其徒曰夫子之哭元大夫也兼師友之分亦過矣元子聞之召叔盈謂曰吾誠哀過汝所云也元大夫弱無所固壯無所専老無所存死無所餘此非人情人情所耽溺喜愛似可惡者大夫無之如戒如懼如憎如惡此其無情此非有心士君子知焉不知也吾今之哀汝知之焉而不知也嗚呼元大夫生六十餘年而卒未嘗識婦人而視錦繡不頌之何以戒荒淫侈靡之徒也哉未嘗求足而言利茍辭而便色不頌之何以戒貪猥佞媚之徒也哉未嘗主十畝之地十尺之舍十嵗之童不頌之何以戒占田千夫室宇千柱家童百指之徒也哉未嘗皁布帛而衣具五味而食不頌之何以戒綺紈梁肉之徒也哉於戲吾以元大夫徳行遺來世清獨君子方直之士也歟哀丘表乾元庚子元子理兵于有泌之南泌南至徳丁酉為陷邑乾元已亥為境上殺傷勞苦言可極耶街郭亂骨如古屠肆於是收而藏之命曰哀丘或曰次山之命哀丘也哀生人將盡而亂骨不藏者乎哀壯勇已死而名跡不顯者乎對曰非也吾哀凡人不能絶貪争毒亂之心守正和仁讓之分至令吾有哀丘之怨歟左黄州表乾元已亥贊善大夫左振出為黄州刺史下車黄人歌曰我欲逃鄉里我欲去墳墓左公今既來誰忍棄之去於戲天下兵興今七年矣河淮之北千里荒草自闗已東海濵之南屯兵百萬不勝征稅豈獨黄人能使其人忍不去者誰曰不可頌乎後一嵗黄人又歌曰吾鄉有鬼巫惑人人不知天子正尊信左公能殺之於戲近年以來以陰陽變怪將鬼神之道罔上惑下得尊重於當時者日見斯人黄之巫女亦以妖妄得䝉恩澤朝廷不敢問州縣惟其意公忿而殺之則彼可誅戮豈獨巫女如左公者誰曰不可頌乎居三年遷侍御史判金州刺史將去黄黄人多去思故為黄人作表如左氏世系左公厯官及黄之門生故吏與女巫事則南陽左公能悉記之吕公表上元二年置南都於荆州為江陵府使舊相東平吕公為江陵尹兼御史大夫分峽中湖南及武陵澧陽巴陵凡一十七州為荆南節度觀察使公理荆南三年年五十一薨於官嗚呼使公年壽之不將也天其未厭兵革不愛蒼生歟公明不盡人之私惠不取人之愛威不致人之懼令不求人之犯正不刑人之僻直不指人之恥故名不異俗跡不矯時内含端明外與常規其大雅君子全于終始者耶公所以進退其身人不知其道公所以再在台衡人不知其徳頌元化者誰預頌乎於戲公將用於人而不見其用人將得於公而公忘其所得乎結等迹參名業嘗在幕下將紀盛徳示於來世故刻金石留於此邦惠公禪居表沂樊水二百餘里有湧溪入溪八九里有蛇山之陽是惠公禪居禪師以無情待人之有情以有為全已之無欲各因其性分莫不與善知人困窮喻使耕織因人災患勸守仁信故閭里相化恥為弋釣日勤種植不五六年沮澤有溝塍荒臯有阡陌桑果竹園如伊洛間所以愛禪師者無全行無全道豈能及此鄉人欲増修塔廟託禪師以求福禪師亦隨人之意而制造焉直門臨溪廣堂背山庭列雙臺修廊夏寒松竹蒼蒼周流清泉岑嶺複抱衆山回旋斯亦曠絶之殊境矣吾以所疑咨於禪師禪師曰我恐人忘善以事誘人及人將善固不以事為累吾以所惑咨於禪師禪師曰公若以惑相問我亦惑於問焉公若無惑我復何對於戲吾漫浪者也焉能盡禪師之意乎縣大夫孟彦深王文淵識名顯當世必能盡禪師之意故命之作贊贊曰聖者忘跡達人化心惠公之妙無得而尋如山出雲如水涵月惠公得之演用不竭無情之化可洽羣黎將引天下同於湧溪夏侯岳州表癸夘嵗岳州刺史夏侯公殁于私家門人弟子愛思不忘願旌遺徳將顯來世㑹予詔許優閒家于樊上故為公作表庚子中公鎮岳州予時為尚書郎在荆南幕府嘗因亷問到公之州其時天下兵興已六七年矣人疲州小比太平時力役百倍公能清正寛恕靜以理之故其人安和而服說為當時法則及公罷歸州里公家與吾相鄰見公在州里與山野童孺與當道辭色均若語是非得喪語夭夀哀樂戀意澹然吾是知道勝於内者物莫能撓徳充於外者事不能誘公之所至其獨有乎於戲公既夀而貴保家全歸於今之世誰不榮羨於公之世嗣與公官則本縣大夫李公狀著之矣舜祠表有唐乙已嵗使持節道州諸軍事守道州刺史元結以虞舜葬於蒼梧之九疑之山在我封内是故申明前詔立祠于州西之山南已而刻石為表於戲孔氏作虞書明大舜徳及生人之至則大舜於生人宜以類乎天地生人奉大舜宜萬世而不厭考大舜南巡之年時巳一百一十二嵗矣自中國至蒼梧亦㡬有萬里蒼梧山谷深險可懼帝竟入而不回至今山下之人不知帝居之宫帝葬之陵嗚呼在有虞氏之世人民可奪其君耶人民於大舜能忘而不思耶何為來而不歸何故死於空山吾實惑而作表來者遊於此邦登乎九疑誰能不惑也歟崔潭州表乙已嵗潭州刺史崔灌去官州人衡州司功㕘軍鄭浰為鄉人某等請余為崔公作表公前在澧州謠頌之聲達于朝廷褒異之詔與人為程及領此州在今日能使孤老寡弱無悲憂單貧困窮安其鄉富豪強家無利害賈人就食之類各得其業職役供給不匱人而當於有司若非清亷而信正直而仁則不能至於觀察御史中丞孟公奏課又第一㑹國家以犬戎為虞未即徵拜使蒼生正暍於歇反而去其庥廕使蒼生正渇而敝其清源時艱道逺州人等不得詣闕寃訴且欲刻石立表以彰盛徳嗚呼刺史有土官也千里之内品刑之屬不亦多乎豈可令凶豎暴類貪夫奸黨以貨權家而至此官如崔公有者豈獨真刺史耳鄭浰之為豈茍媚其君而私於州里耶蓋懼清亷正直之道弱於時俗君子遺愛之心不顯來世故采其意而已矣張處士表永泰丙午中處士張秀卒於戲吾嘗驗古人將老死巖谷逺跡時世者不必其心皆好山林若非介直方正與時世不合必識髙行逺獨與時世不合不然則剛褊傲逸與時世不合彼若遭逢不容則身不足以為禍將家族以隨之至於傷汚毁辱何足說者故使之矯然絶世逃其不容直為逸民竟為退士枕石飲水終身而已當時之君欲以禄位招之有土之官欲以厚禮處之彼驚懼抗絶而去時之見能如此所以尤髙尚焉嗚呼處士與時不合者耶而未能矯然絶世遭以禮法相簡不見容悲夫菊圃記舂陵俗不種菊前時自逺致之植於前庭牆下及再來也菊已無矣徘徊舊圃嗟嘆久之誰不知菊也芳華可賞在藥品是良藥為蔬菜是佳蔬縱須地趍走猶宜徙植修養尚忍蹂踐至盡不愛惜乎於戲賢士君子自植其身不可不慎擇所處一旦遭人不愛重如此菊也悲傷奈何於是更為之圃重畦植之其地近讌息之堂吏人不此奔走近登望之亭旌麾不此行列縱參歌妓菊非可惡之草使有酒徒菊為助興之物為之作記以託後人并録藥經列於記後廣宴亭記樊水東盡其南乃樊山北鮮津吏欲於鮮上而為候舍漫叟家於樊上不醉則閒乃相其地形驗之圖記故實為宴遊之處縣大夫馬公登之歎曰謝公贈伏武昌詩云樊山開廣宴非此地耶吾欲因而修之命曰廣宴亭何如漫叟頌之曰古人將修廢遺尤異之事為君子之道於戲天下有廢遺尤異之事如此亭者誰能修而旌之天將厭悔往乎使公方壯而有是心也當裁蓄簡扎待為之頌故作此廣宴記殊亭記癸卯中扶風馬向兼理武昌以明信嚴㫁惠正為理故政不待時而成於戲若明而不信嚴而不㫁惠而不正雖欲理身終不自理况於人哉公能令人理使身多暇招我畏暑且為凉亭亭臨大江復出山上佳木相蔭常多清風巡回極望目不厭逺吾見公才殊政殊迹殊為此亭又殊因命之曰殊亭斵石刻記立于亭側庶㡬來者無所惑焉右溪記道州城西百餘步有小溪南流數十步合營溪水抵兩岸悉皆怪石歌嵌盤屈不可名狀清流觸石洄懸激注休木異竹埀陰相蔭此溪若在山野則宜逸民退士之所遊處在人間可為都邑之勝境靜者之林亭而置州已來無人賞愛徘徊溪上為之悵然乃疏鑿蕪穢俾為亭宇植松與桂兼之香草以禆形勝為溪在州右遂命之曰右溪刻銘石上彰示來者刺史㕔記天下太平方千里之内生植齒類刺史乃存亡休慼之係天下兵興方千里之内能保黎庶能攘患難在刺史爾凡刺史若無文武才略若不清亷肅下若不明惠公直則一州生類皆受災害於戲自至此州見井邑丘墟生人㡬盡試問其故不覺涕下前輩刺史或有貪猥惽弱不分是非但以衣服飲食為事數年之間蒼生蒙以私欲侵奪兼之公家驅迫非姦惡強富殆無存者問之耆老前後刺史能恤養貧弱専守法令有徐公履道李公廙而已遍問諸公善或不及徐李惡有不堪說者故為此記與刺史作戒自置州已來諸公改授遷絀年月則舊記存焉茅閣記乙已平昌孟公鎮湖南將二嵗矣以威惠理戎旅以簡易肅州縣刑政之下則無撓人故居方多閒時與賔客嘗欲因亭引望以紓逺懐偶愛古木數株重覆城上遂作茅閣蔭其清陰長風寥寥入我軒檻扇和爽氣滿於閣中世傳衡陽暑濕鬱蒸休息於此何為不然今天下之人正苦大熱誰似茅閣蔭而庥之於戲賢人君子為蒼生之庥蔭不如是耶諸公歌詠以長之俾茅閣之什得系嗣於風雅者矣九疑圖記九疑山方二千餘里四州各近一隅世稱九峰相似望而疑之謂之九疑亦云舜登九峰疑禹而悲從臣有作九悲之歌因謂之九疑九峰殊極髙大逺望皆可見也彼如嵩華之峻崎衡岱之方廣在九峰之下磊磊然如布碁石者可以百數中峰之下水無魚鱉林無鳥獸如蟬蠅之類聴之亦無往往見大谷長川平田深淵杉松百圍榕栝並之青莎白沙洞穴丹崖寒泉飛流異竹雜華回映之處似藏人家實有九水出於中山四水流灌於南海五水北注合為洞庭若度其髙卑比洞庭南海之岸直上可二三百里不知海内之山如九疑者㡬焉或曰若然者兹山何不列於五嶽對曰五帝之前封疆尚隘衡山作嶽已出荒服今九疑之南萬里臣妾國門東望不見涯際西行㡬里未盡邊陲當合以九疑為南嶽以崑崙為西嶽衡陽之輩聴逸者占為山封君表作園囿耳但苦當世議者拘限常情牽引古製不能有所改剏也如何故圖九峰略載山谷傳於好事以旌異之如山中之往跡峰洞之名稱為人所傳說者並隨方題記庶㡬觀者易之時永泰丙午中也寒亭記在江華縣永泰丙午中巡屬縣至江華縣大夫瞿令問咨曰縣南水石相映望之可愛相傳不可登臨俾求之得洞穴而入棧險以通之始得構茅亭於石上及亭成也所以階檻憑空下臨長江軒楹雲端上齊絶顛若旦暮景氣煙靄異色蒼蒼石墉含映水木欲名斯亭狀類不得敢請名之表示來世於是于亭上為商之曰今大暑登之疑天時將寒炎烝之地而清凉可安不合命之曰寒亭歟乃為寒亭作記刻之亭背次山集巻九欽定四庫全書次山集巻十唐元結撰為董江夏自陳表臣某言月日勑使某官某乙至賜臣制書示臣云云伏見詔㫖感深驚懼臣豈草木不知天心頃者潼闗失守皇輿不安四方之人無所繫命及永王承制出鎮荆南婦人童子忻奉王教意其然者人未離心臣謂此時可奮臣節王初見臣謂臣可任遂授臣江夏郡太守近日王以冦盜侵偪總兵東下旁牒郡縣皆言巡撫今諸道節度以為王不奉詔兵臨郡縣疑王之議聞於朝廷臣則王所授官有兵防禦鄰郡並邑疑臣順王旬日之間置身無地臣本受王之命為王奉詔王所授臣之官為臣許國忠正之分臣實未虧蒼黄之中死㡬無所不圖今日得達聖聴今臣年六十老母在堂縱未能奉義捐生則豈忍兩忘忠孝臣少以文學為諸生所多中年自頥逸在山澤聖明無事甘為外臣無何以鄙僻之故反為人知遂汚官次以至今日臣又頃年貶謫罪未昭洗今所授官復越班秩罷歸待罪是臣之分今陛下以王室艱難寄臣方面亦以忘身許國誓於皇天伏惟陛下念臣懇至謹因勑使某官奉表以聞臣某云云謹言辭監察御史表上元元年進臣某言臣伏奉某月日勑除臣監察御史裏行依前充山南東道節度㕘謀忽承天澤不勝慶喜負荷恩任伏増憂懼臣在至徳元年舉家逃難生㡬於死出自賊庭逺如海濵敢望冠冕陛下過聴疑臣有才謀可用謂臣以忠正可嘉枉以公詔徵臣延問當時之事言未可取榮寵已殊事未可行授任過次其時以康元狡逆陛下憂勞臣亦不辭疲駑奉宣聖㫖招集士卒師旅未成又逢張瑾姦凶再驚江漢臣恐陛下憂無制變遂曽表請用兵陛下嘉臣懇愚頻降恩詔聖私殊甚特加超擢至今臣自布衣未踰數月官㕘風憲任兼戎旅今不勞兵革凶豎伏辜臣不可終以無能茍安非望自姦臣逆命於今六年愧無寸能茍求禄位分符佩印不知慚羞戮辱及之死將不悔陛下忍而從者其可勝言臣才弱識下非智無謀循涯顧分實自知恥臣老母多病又無弟兄漂流殊鄉孤弱相養伏願陛下矜臣愚鈍不合齒於朝列念臣老母令臣得以奉養則聖朝無辱官之士山澤有純孝之臣不任悃欵之至謹遣某官奉表陳請以聞臣云云謹言為吕荆南謝病表臣某言臣自去秋疾疹以至今日轉加羸弱庶事不理某月日附某官口奏請替某月日又進狀陳情未蒙允許伏増憂懼陛下應以臣久㑹驅策未忍替臣臣實憂陛下方隅切須鎮守臣不能起止四十餘日艱虞之際實慮變生今淮西敗散唐鄧危急在臣病廢豈敢偷安伏望天恩即與臣替儻餘生尚在得至闕庭犬馬之心死生願畢不勝懇款之至謹遣某官奉表陳乞以聞云云請節度使表寶應元年進臣某言臣自以愚弱無堪逺跡江湖全身之外無所冀望陛下過聴徵臣顧問今臣起家數月之内官忝臺省爾來三嵗無益効用愧恥之甚在臣無踰臣竊以荆南是國家安危之地伏願陛下不輕易任人陛下若獨任武臣則州縣不理若獨任文吏則戎事多闕自兵興已來今八年矣使戰争未息百姓勞弊多因任使不當致使敗亡伏惟陛下審擇重臣即日鎮撫令陛下上游之地救愚臣不逮之急謹遣某官奉表以聞乞免官歸養表臣某言臣以為才不稱任位過其量不自知分禍辱皆及臣才不知人量實褊僻踰越秩次忝辱衣冠人亦有慙臣自知愧臣少以愚弱不願為吏書學自業老於儒家今迹在軍中日預戎事此過臣才分近於禍辱者矣臣常恐荒浪失於禮法自逸山澤預於生類今穢汚臺省紊亂時憲此過臣才分近於禍辱者矣伏惟陛下察臣才分不令亂官則貪冒茍進之徒自臣知恥陛下若官不失人則天下自理故曰天下理亂繫之官人臣以為官人之難無敢易者陛下焉可易於臣哉臣無兄弟老母久病所願免官奉養生死願足上不敢汚陛下朝列是臣之忠下不欲貽老母憂懼是臣之孝願全忠孝於今日免禍辱於將來伏惟陛下許臣免官許臣奉養在臣慶幸無以比喻謹遣某官奉表陳請以聞云云謝上表廣徳二年道州進臣某言去年九月勑授道州刺史屬西戎侵軼至十二月臣始於鄂州授勑牒即日赴任臣州先被西原賊屠陷節度使已差官攝刺史兼又聞奏臣在道路待恩命者三月臣以五月二十二日到州上訖耆老見臣俯伏而泣官吏見臣以無菜色城池井邑但生荒草登髙極望不見人煙嶺南數州與臣接近餘㓂蟻聚尚未歸降臣見招輯流亡率勸貧弱保守城邑畬種山林冀望秋後少可全活臣愚以為今日刺史若無武畧以制暴亂若無文才以救疲弊若不清廉以身率下若不變通以救時須一州之人不叛則亂將作矣豈止一州者乎臣料今日州縣堪征稅者無㡬已破敗者實多百姓戀墳墓者蓋少思流亡者乃衆則刺史宜精選謹擇以委任之固不可拘限官次得之貨賄出之權門者也凡授刺史特望陛下一年問其流亡歸復㡬何田疇墾闢㡬何二年問畜養比初年㡬倍可稅比初年㡬倍三年計其功過必行賞罰則人皆不敢冀望僥倖茍有所求臣實孱弱辱陛下符節陛下必當謹擇臣固宜廢歸山野供給井稅臣不任懇欵之至謹遣某官奉表陳謝以聞再謝上表永泰二年進臣某言某伏奉某月日勑再授臣道州刺史以某月日到州上訖臣前日在官雖百姓不至流亡而歸復者十無一二雖冦盜不犯邊鄙而不能兵救鄰州雖賦斂僅能供給而有司不無罪狀雖人吏似從教令而風俗未能移易臣又多病不無假故水旱灾沴每歲不免疾疫死傷臣州尤甚以臣自訟合抵刑憲聖朝寛貸猶宜奪官陛下過聽重有授任伏恐守亷讓者以臣為茍安禄位抱公直者以臣為内懐私僻有材識者辱臣於臺𨽻之下用刑罰者罪臣於程式之中臣所以不敢即日辭免待陛下按驗虚實然後歸罪有司今四方兵革未寜賦斂未息百姓流亡轉甚官吏侵尅日多實不合使凶庸貪猥之徒凡弱下愚之類以貨賂權勢而為州縣長官伏望陛下特加察問舉其功過必行賞罰以安蒼生誰不自私臣實不敢所言狂直朝夕待罪不任懇款之至謹遣某官奉表陳謝廣德二年賀赦表臣某言伏奉某月日赦宣示百姓訖伏惟陛下以慈惠馭兆庻以謙讓化天下凡所赦宥皆允人望凡所敦勸皆合大經生識之類不勝大幸臣方領陛下州縣守陛下符節不得稱慶下位蹈舞闕庭不任歡戀之至永泰元年賀赦表臣某言某月日恩赦至州宣示百姓訖百姓貧弱者多勞苦日久忽䝉惠澤更相喜賀歡呼忭躍不自禁止伏惟陛下増修典禮𢎞正紀度勞謙慈惠與人更新此實興王之盛烈明主之至德戴履天地誰不慶幸臣方守州縣不得蹈舞闕庭無任歡忻之至請省官狀乾元三年上來大夫唐鄧等州縣官右方城縣舊萬餘戸今二百戸已下其南陽向城等縣更破碎於方城每縣正員官及攝官共有六十人以前件如前自經逆亂州縣殘破唐鄧兩州實為尤甚荒草千里是其疆畎萬寳空虚是其井邑亂骨相枕是其百姓孤老寡弱是其遺人哀而恤之尚恐寃怨肆其侵暴實恐流亡今賊㓂憑凌鎮兵資其給養今河路阻絶郵驛在其供承若不觸事救之無以勞勉其苦為之計者在先省官其方城湖陽等縣正官及攝官并戸口多少具狀如前毎縣伏望量留令并佐官一人餘並望勒停謹録狀上請給將士父母糧狀上元元年上來大夫當軍將二千人父隨子者四人母隨子者二十八人以前件如前將士父母等皆因䘮亂不知所歸在於軍中為日亦久夫孝而仁者可與言忠信而忠信者可以全義勇豈有責其忠信使之義勇而不勸之孝慈恤以仁惠今軍中有父母者皆共分衣食先其父母寒餒日甚未嘗有辭其將士父母等伏望各量事給其衣食則義有所存恩有所及俾人感勸實在於此謹録狀上請收養孤弱狀上元元年上來大夫當軍孤弱小兒都七十六人張季秀等三十九人無父母周國良等三十七人有父兄在軍以前件狀如前小兒等無父母者鄉國淪陷親戚俱亡誰家可歸傭丐未得有父兄者其父兄自經艱難久從征戍多以忠義遭逢誅賊有遺孤弱子不忍棄之力相恤養以至今日乞令諸將有孤兒投軍者許收驅使有孤弱子弟者許令存養當軍小兒先取囘殘及囘易雜利給養謹録狀上舉呂著作狀寳應元年奏故荆南節度觀察使江陵尹兼御史大夫呂諲姪男季童右見任秘書省著作郎以前件狀呂某立身無私歴官清儉身没之後家無餘財長男幼小未了家事前件姪質性純厚識理通敏仁孝之性不慙古人自其疾甚不視事向五六十日軍府之事皆季童諮問事無大小處之無情以臣所見季童不獨為賢子弟今時榖湧貴道路多虞漂流異鄉無以自給伏望天恩與季童便近州一正員官令其恤養孤㓜謹録奏聞伏聽勑㫖奏免科率狀廣徳二年奏勑依當州准勑及租庸等使徴率錢物都計一十三萬六千三百八十八貫八百文一十三萬二千四百八十貫九百文嶺南西原賊未破州已前三千九百七貫九百足賊退後徴率以前件如前臣自到州見庸租等諸使文牒令徴前件錢物送納臣當州被西原賊屠陷賊停留一月餘日焚燒糧儲屋宅俘掠百姓男女驅殺牛馬老少一州幾盡賊散後百姓歸復十不存一資產皆無人心嗷嗷未有安者若依諸使期限臣恐坐見亂亡今來未敢徴率伏待進止又嶺南諸州㓂盜未盡臣州是嶺北界守捉處多若臣州不安則湖南皆亂伏望天恩自州未破已前百姓久負租税及租庸等使所有徴率和市雜物一切放免自州破已後除正租正庸及准格式合進奉徴納者請據見在戸徴送其餘科率並請放免容其見在百姓產業稍成逃亡歸復似可存活即請依常例處分伏願陛下以臣所奏下議有司茍若臣所見愚僻不合時政干亂紀度事渉虚妄忝官尸禄欺上罔下是臣之罪合正典刑謹錄奏聞奏免科率等狀永泰二年奏勑依當州奏永㤗元年配貢上都錢物總一十三萬二千六百三十三貫三十五文四萬一千二十六貫四百八十九文請據見在堪差科徴送九萬一千六百六貫五百四十六文配率請放免以前件如前臣當州前年陷賊一百餘日百姓被焚燒殺掠幾盡去年又賊逼州界防捍一百餘日賊攻永州陷邵州臣州獨全者為百姓捍賊今年賊過桂州又團練六七十日丁壯在軍中老弱餽糧餉三年已來人實疲苦臣一州當嶺南三州之界守捉四十餘處嶺南諸州不與賊戰毎年賊動臣州是境上之州若臣州陷破則湖南為不守之地在於徴賦稍合優矜今使司配率錢物多於去年一倍已上州縣徴納送者多於去年二分已下申請矜減使司未許伏望陛下以臣所奏令有類會諸經賊陷州據合差科戸臣當州毎年除正租正庸外更合配率㡬錢庻免使司隨時加減庻免百姓每歲不安其今年輕貨及年支米等臣請准狀處分謹録奏聞論舜廟狀永㤗二年奏勑依右謹按地圖舜陵在九疑之山舜廟在太陽之溪舜陵古老以失太陽溪今不知處秦漢已來置廟山下年代寖逺祠宇不存毎有詔書令州縣致祭奠酹荒野恭命而已豈有盛德大業百王師表殁於荒裔陵廟皆無臣謹遵舊制於州西山上已立廟訖持乞天恩許蠲免近廟一兩家令歲時拂灑示為恒式豈獨表聖人至德及於萬代實欲彰陛下𤣥澤及於無窮謹録奏聞舉處士張季秀狀永㤗二年奏勑依臣州僻在嶺隅其實邊裔土風貪於貨賂舊俗多習吏事獨季秀能介直自全退守亷讓文學為業不求人知寒餒切身彌更守分貴其所尚願老山林臣切以兵興已來人皆趨競茍利分寸不愧其心則如季秀者不可不加褒異臣特望天恩令州縣取其穩便與造草舍十数間給水田一兩頃免其當戸徭役令得保遂其志此實明朝旌退讓之道亦為士庻識亷耻之方謹録奏聞次山集巻十欽定四庫全書次山集巻十一唐元結撰縣令箴古今所貴有土之官當其選授何嘗不難為其動靜是人禍福為其噓噏作人寒燠煩則人怨猛則人懼勿以賞罰因其喜怒太寛則慢豈能行令太簡則踈難與為政既明且斷直焉無情清而且惠果然必行或曰關由上官事不自我辭讓而去有何不可誰欲字人贈君此箴豈獨書紳可以銘心五規出規元子門人叔將出遊三年及還元子問之曰爾去我久矣何以異乎諾曰叔將始自山中至長安見權貴之盛心憤然切悔比年於空山窮谷與夫子甘飢寒愛水木而巳不数月自王公大夫卿相近臣之門無不至者及一年有向與歡宴過之可弔有始賀拜侯已聞就誅豈不裂封疆土未識豈無印綬懐之未暖其客得禄位者隨死得金玉者皆孥參遊宴者或刑或免叔將之身如犬逃者五六似䑕藏者八九當其時環望天地如置在杯斗之中元子聞之嘆曰叔將汝何思而為乎汝若思為社稷之臣則非正直不進非忠讜不言雖手足斧鉞口能出聲猶極忠言與氣偕絶汝若思為禄位之臣猶當避赫赫之路晦顯顯之機如下廐粟馬齒食而巳汝忽然望權勢而徃自致身於刑禍之方得筋骨載肉而歸幸也大矣二三子以叔將為戒乎處規州舒吾問元子曰吾聞子多矣意將何為對曰雲山幸不求吾是林泉又不責吾非熈然能自全順時而老可矣復安為哉舒吾曰元子其過誤乎其太矯也吾厭世人餙言以由道藏智以全璞退身以顯行設機以樹名吾子由之使我何信元子俛而謝之滕許大夫友元子聞不應舒吾之説乃曰嗟嗟元子少辭者耶何不曰使吾得所處但如山林不見吾是非吾將娭音稀徃也以子為飾言藏智退身設機何不曰如此豈不多於盜權竊位䝉汙萬物富貴始及而刑禍促之者乎元子謝不及季川問曰兟兟凡之别稱義載爾雅終不復二論兟有意乎於戲季川吾有言則自是言逹則人非吾安能使吾身之有是而令他人之有非至於聞聞也哉戲規元子偶倚于雲丘之顛戲牧兒曰爾為牧歌當不責爾暴牧兒歌去乃暴他田田主鞭之啼而寃元子啼不止召其父而止之元子友真卿聞之書過於元子曰嗟嗟次山茍戲小兒俾陷鞭焉而蒙寃之彼牧兒望次山猶臺𨽻不敢干其主及茍戲乃或與次山猶仇讎斯豈慎徳也歟吾聞君子不茍戲無似非如何惑一兒使不知所以蒙過此非茍戲似非之非者耶惡不必易此元子報真卿曰於戲吾獨立於空山之上戯歌牧兒得過㡬不可免彼行於世上有愛憎相忌是非相反名利相奪禍福相從至於有蒙戮辱者焉得不因茍戲似非世兒惑之以及者乎真卿吾當以戲為規心規元子病遊世歸于商餘山中以酒自肆有醉歌里夫公聞之􅀈音多元子之酒請歌之歌曰元子樂矣俾和者曰何樂亦然何樂亦然我曰我雲我山我林我泉又曰元子樂矣俾和者曰何樂然爾何樂然爾我曰我鼻我目我口我耳歌已矣夫公曰自樂山林可也自樂耳目何哉人誰無此元子引酒當夫公曰勸君此杯酒緩飲之聴我說子行于世間目不隨人視耳不隨人聴口不隨人語鼻不隨人氣其甚也則須封包裹塞不爾有滅身亡家之禍傷汙毁辱之患生焉雖王公大人亦不能自主口鼻耳目夫公何思之不熟耶時規乾元已亥漫叟待詔在長安時中行公掌制在中書中書有醇酒時得一醉醉中叟誕曰願從天下鳥獸蟲魚以充殺者之心願窮天下醇酎美色以充欲者之心中行公聞之歎曰子何思不盡耶何不曰願得如九州之地者億萬分封君臣父子兄弟之争國者使人民免賊虐殘酷者乎何不曰願得布帛錢貨珍寶之物溢於王者府藏滿將相權勢之家使人民免飢寒勞苦者乎叟聞公言退而記之授於學者用為時規惡圓元子家有乳母為圓轉之器以恱嬰兒嬰兒喜之母使為之聚孩孺助嬰兒之樂友人公植者聞戲兒之器請見之及見之趨焚之責元子曰吾聞古之惡圓之士歌曰寧方為皁不圓為卿寧方為汚辱不圓為顯榮其甚者則終身不仰視曰吾惡天圓或有喻之以天大無窮人不能極逺視四乖因謂之圓天不圓也對曰天縱不圓為人稱之我亦惡焉次山奈何任造圓轉之器恣令悦媚嬰兒少喜之長必好之教兒學圓且陷不義躬自戲圓又失方正嗟嗟次山入門愛嬰兒之樂圓出門當愛小人之趨圓吾安知次山異日不言圓行圓動圓靜圓以終身乎吾豈次山之友也元子召季川謂曰吾自嬰兒戲圓公植尚辱我言絶忽乎吾與汝圓以應物圓以趨時非圓不預非圓不為公植其操矛㦸刑我乎惡曲元子時與鄰里㑹曲全當時之懽以順長老之意歸泉上叔盈問曰向夫子曲全其懽道然也茍為爾乎元子曰叔盈視吾曲其心以徇財利曲其行以希名位當過吾吾茍全一懽於鄰里無惡然可也東邑有全直之士聞元子對叔盈恐曰吾聞元次山約其門人曰無惡我之小曲真惛鄙惡辭也吾輩全直三十年未嘗曲氣以轉聲曲辭以達意曲步以便往曲視以回目猶患於古人古人有惡曲者不曲臂以取物不曲膝以便坐見天下有曲於君曲於民曲於鬼神者往刦而死之今元次山茍曲言貌強全一懽以為不喪其直慁哉若能茍曲於鄰里強全一懽豈不能茍曲於鄉縣以全言行茍能曲於鄉縣豈不能茍曲於邦國以彰名譽能茍曲於邦國豈不能茍曲於天下以揚徳義若言行名譽徳義皆顯豈有鍾鼎不入門權位不在已乎嗚呼曲為之小為大之漸曲為之也有何不可姦邪凶惡其㘥音由乎元子聞之頌曰吾以顔貌曲全一懽全直君子之惡我如此猶有過於此者何以自免水樂說元子於山中尤所躭愛者有水樂水樂是南磳之懸水淙淙然聞之多久於耳尤便不至南磳即懸庭前之水取欹曲竇缺之石髙下承之水聲少似聴之亦便訂司樂氏或有將元子水樂說於司樂氏樂官聞之謂元子曰能和分五音韻諧水聲可傳之來請觀學元子辭之使門人以南磳及庭前懸水指之樂氏醜惡慢罵曰韻瞶多矣焉有聴而云樂乎此言聞元子元子謝曰次山病餘惽固自順於空山窮谷偶有懸水淙石冷然便耳醉甚或與酒徒戲言呼為水樂不防君子過聞而來實汚辱君子之車僕樂官去季川問曰向兟謝樂官不亦過甚曰然吾為汝訂之汝豈不知彼為司樂之官老矣八音教其心五聲傳其耳不得異聞則以為錯亂紛惑甚不可聴况懸水淙石宫商不能合律吕不能主變之不可㑹之無由此全聲也司樂氏非全士安得不甚謝之嗟乎司樂氏欲以金石之順和絲竹之流妙宫商角羽豐然遞生以化全士之耳猶以懸水淙石激淺注深清瀛浥溶不變司樂氏之心嗚呼天下誰為全士能愛夫全聲也浪翁觀化并序浪翁山野浪老也聞元子亦浪然在山谷病中能記水石草木蟲豸之化亦來說常所化凡四說有無相化浪翁曰陰陽之氣化為四時四時之行化為萬物萬物形全是無化有萬物形盡是有化無此有無相化之說有化無浪翁曰人或云我立於東西望萬里目極則無人我兩忘終世相無此有化無之說無化有浪翁曰人或云我來於南北行萬里至無不有人我兩求終世相有此無化有之說化相化浪翁曰吾觀化於無也何無不有吾觀化於有也何有不無有無更化日以相化化言何極化言何窮時化元子聞浪翁說化化無窮極因論諭曰翁亦未知時之化也多於此乎曰時焉何化我未之記元子曰於戲時之化也道徳為嗜慾化為險薄仁義為貪暴化為凶亂禮樂為耽淫化為侈靡政教為煩急化為苛酷翁能記於此乎時之化也夫婦為溺惑所化化為犬豕父子為惽慾所化化為禽獸兄弟為猜忌所化化為讎敵宗戚為財利所化化為行路朋友為世利所化化為市兒翁能記於此乎時之化也大臣為威權所恣忠信化為姦謀庶官為禁忌所拘公正化為邪佞公族為猜忌所限賢哲化為庸愚人民為征賦所傷州里化為禍邸姦兇為恩幸所迫厮皁化為將相翁能記於此乎時之化也山澤化為井陌或曰盡於草木原野化為狴犴或曰殫於鳥獸江湖化為鼎鑊或曰暴於魚鼈祠廟化為宫􅃦或曰數於祠禱翁能記於此乎時之化也情性為風俗所化無不作狚狡詐誑之心聲呼為風俗所化無不作諂媚僻淫之辭顔容為風俗所化無不作姦邪蹙促之色翁能記於此乎世化浪翁聞元子說時化嘆曰吾昔聞世化可說又異於此昔世之化也天地化為斧鑕日月化為豺虎山澤化為州里草木化為宗族風雨化為邸舍雪霜化為衣裘呻吟化為常聲糞汚化為梁肉一息化為千嵗烏犬化為君子元子惑之浪翁曰子不聞往昔世之化也四海之内巷戰門鬬㫁骨腐肉萬里相藉天地非斧鑕也耶人民暗夜盜起求食晝遊則死傷相及日月非豺虎也耶人民相與寄身命於絶崖深谷之底始能聲呼動息山澤非州里也耶人民奔走非深林薈叢不能藏蔽草木非宗族也耶人民去鄉國入山海千里一息力盡暫休風雨非邸舍也耶人民相持於死傷之中裸露而行霜雪非衣裘也耶人民勞苦相寃瘡痍相痛老弱孤獨相苦死亡不能相救呻吟非常聲也耶人民多饑餓溝瀆病傷道路糞汚非梁肉也耶人民奔亡濳伏戈矛相拂前傷後死免而存者一息非千嵗也耶僵王腐卿相枕路隅鳥獸讓其骨肉烏犬非君子也耶次山集巻十一欽定四庫全書次山集巻十二唐元結撰􅝓亭銘有序浯溪之口有異石焉髙六十餘丈周迴四十餘步西面在江口東望峿臺北臨大淵南枕浯溪唐亭當乎石上異木夾户疎竹傍簷瀛洲言無由此可信若在亭上目所厭者逺山清川耳所厭者水聲松吹霜朝厭者寒日方暑厭者清風於戲厭不厭也厭猶愛也命曰􅝓亭旌獨有也銘曰功名之位貴得茅土林野之客所耽水石年將五十始有吾亭愜心自適與世忘情亭傍石上篆刻此銘峿臺銘有序浯溪東北二十餘丈得怪石焉周行三百餘步從未申至丑寅崖壁斗絶左屬回鮮前有磴道髙八九十尺下當洄潭其勢硱磳半出水底蒼然泛泛若在波上石巔勝異之處悉為亭堂小峯歁竇其間松竹掩映軒户畢皆幽竒於戲古人畜憤悶與病於時俗者力不能築髙臺以瞻眺則必山顛海畔伸頸歌吟以自暢達今取兹石將為峿臺蓋非愁怨乃所好也銘曰湘淵清深峿臺陗陖登臨長望無逺不盡誰厭朝士覊牽局促借君此臺一縱心目陽崖礱琢如瑾如珉作銘刻之彰示後人東崖銘有序峿臺西南支危髙逈在峿亭為東崖下可行坐八九人其為形勝與石門石屏亦猶宫羽之相資也銘曰峿臺蒼蒼西崖雲端亭午崖下清陰更寒可容枕席何事不安水樂銘有序元子於山中尤所耽愛者有水樂水樂是南磳之懸水淙淙然聞之多久於耳尤便不至南磳即懸庭前之水取欹曲竇缺之石髙下承之水聲少似聴之亦便銘曰烟纔通寒淙淙隔山風考鼓鍾文編序天寶十二載漫叟以進士獲薦名在禮部㑹有司考校舊文作文編納於有司當時叟方年少在顯名跡切恥時人襲邪以取進姦亂以致身徑欲填陷穽於方正之路推時人於禮讓之庭不能得之故優游於林壑怏恨於當世是以所為之文可戒可勸可安可順侍郎楊公見文編歎曰以上第汚元子耳有司得元子是賴叟少師友仲行公公聞之諭叟曰於戲吾常恐直道絶而不續不虞公於子相續如縷明年有司於都堂策問羣士叟竟在上第爾來十五年矣更經喪亂所望全活豈欲跡㕘戎旅茍在冠冕觸踐機危以為榮利蓋辭謝不免未能逃命故所為之文多退讓者多激發者多嗟恨者多傷閔者其意必欲勸之忠孝誘以仁惠急于公直守其節分如此非救時勸俗之所須者歟叟在此州今五年矣地偏事簡得以文史自娛乃次第近作合於舊編凡二百三首分為十巻復命曰文編示門人弟子可傳之於筐篚耳叟之命稱則著於自釋云不録時大厯三年丁未中冬也送張𤣥武序乙未中詔吳興張公為𤣥武縣大夫公舊友河東栁濳夫裴季安扶風竇伯明趙郡李長源河南元次山將辭讌言悉以言贈上有勸仁惠䘏勞苦之風下有惜離異戒行役之諭元子聞之中有所指國家將日極太寧乖休八荒故自近年兵出滇外訂者或曰西南少疲是以天子特有命也將天之命斯未易然於戲蜀之遺民化於秦漢純古之道其由未知無置此焉姑取廢也如徳以涵灌義以封植其教遲逺其人迎喁至乎不可固未必也則曰保仁以敦養流惠以懐恤知其所勞示其所安無以醜之當可然也濳夫聞之中興不樂嘆曰吾嘗與朋友有四方之異不甚感人如今之心多問其故對曰嗟嗟子能有是言也吾故感焉行有規矣多無曰我四十於此無曰我時禄位下哉公乃復曰當不失於二公之意為異年觀㑹之方也已敢戒行役敢自清慎終不貽朋友之憂何如於是醉歌中堂極樂而已諸公有贈遞相編次讓容州表臣結言臣伏奉今月二十二日勑授臣使持節都督容州諸軍事守容州刺史中丞充本管經畧守捉使四月十六日勑到二十一日發付本道行營臣實愚弱謬當寄任奉詔之日不獲憂懼臣聞孝於家者忠於國以事君者無所隠臣有至切不敢不言臣實一身奉養老母醫藥飲食非臣不喜臣暫違離則憂悸成疾臣又多病近日加劇前在道州黽勉六嵗實無政理多是假名頻請停官使司不許今臣所屬之州陷賊嵗久頽城古木逺在炎荒管内諸州多未賔伏行營野次向十餘年在臣一身為國展効死當不避敢憚艱危但以老母念臣疾疹日久時方大暑南逾大山舉家漂泊寄在湖上單車將命赴於賊庭臣將就路老母悲泣聞者悽愴臣心可知臣欲扶持版輿南之合浦則老母氣力難於逺行臣欲奮不顧家則母子之情禽畜猶有臣欲久辭老母則又汚辱名教臣欲便不之官又恐稽違詔命在臣肝腸如煎如燭昔徐庶心亂先主不逼令伯陳情晉武允許君臣國家萬代為規伏惟陛下以孝理萬姓慈育生民在臣情志實堪矜愍臣每讀前史見吳起遊宦噬臂不歸温嶠奉使絶裾而去常恨不逢斯人使之殊死臣所以冒犯聖㫖乞停今授待罪私門長得奉養供給井稅臣之懇願塵黷天威不勝惶恐謹遣某官奉表陳讓以聞次山集巻十二
