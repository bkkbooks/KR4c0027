front:
  text: 其甚
  hash: sha256:ab273c30ff66376c5b6edf21650a543717f184db125cc14b56c131625e81761e
body:
  text: 也不如草木此意多顯於元子者或曰訂如是他丁反不如則不如也不如如者止於此乎元子於是系之於人事縯以淺反之於此喻始為七不如不如之義始極也第一元子以為人之毒也毒於鄉毒於國毒於鳥獸毒於草木不如毒其形毒其命毒其姻戚毒其家族者爾於戲毒可頌也乎哉毒有甚焉何如第二元子以為人之媚也媚於時媚於君媚於朋友媚於鄉縣不如媚於廏媚於室媚於市肆媚於道路者爾於戲媚可頌也乎哉媚有甚焉何如第三元子以為人之詐也詐於忠詐於信詐於仁義詐於正直不如詐於愚詐於弱詐於貧賤詐於退讓者爾於戲詐可頌也乎哉詐有甚焉何如第四元子以為人之惑也惑於邪惑於佞惑於姦惡惑於兇暴不如惑於狂惑於誕惑於翫弄惑於諧戲者爾於戲惑可頌也乎哉惑有甚焉何如第五元子以為人之貪也貪於權貪於位貪於取求貪於聚積不如貪於德貪於道貪於閑和貪於靜順者爾於戲貪可頌也乎哉貪有甚焉何如第六元子以為人之溺也溺於聲溺於色溺於圓曲溺於妖妄不如溺於仁溺於讓溺於方直溺於忠信者爾於戲溺可頌也乎哉溺有甚焉何如第七元子以為人之忍也忍於毒忍於媚忍於詐惑忍於貪溺不如忍於貧忍於苦忍於棄汚忍於病廢者爾於戲忍可頌也乎哉忍有甚焉何如訂古五篇有序天寶癸巳元子作訂古訂古前世君臣父子兄弟夫婦朋友之道於戲上古失之中古亂之至於近世有窮極凶惡者矣或曰欲如之何對曰將如之何吾且聞之訂之嗟之傷之泣而恨之而已也第一吾觀君臣之間且有猜忌而聞疑懼其由禪讓革代之道誤也故後世有刼簒廢放之惡興焉嗚呼即有孤弱將安託哉即有功業將安保哉第二吾觀父子之際且有悲感而聞痛恨其由聽讒受亂之意惑也故後世有幽毒囚殺之患起焉嗚呼即有深慈將安興哉即有至孝將安訴哉第三吾觀兄弟之中且有鬬爭而聞殘忍其由分國異家之教薄也故後世有陰謀誅戮之害生焉嗚呼即有友悌將安用哉即有恭順將安全哉第四吾觀夫婦之道且有寃怨而聞嫌妬其由耽淫惑亂之情多也故後世有滅身亡家之禍發焉嗚呼即有信義將安及哉即有柔順將安守哉第五吾觀朋友之義且有邪詐而聞忌患其由趨勢近利之心甚也故後世有窮凶極害之刑生焉嗚呼即有節分將安與哉即有方正將安容哉自述三篇有序天寶庚寅元子初習靜于商餘人聞之非非曰此在者也見則茫然無幾人聞之是是曰此學者也見則猗然及三年人聞之參參曰此隱者也見則崖然有惑而問曰子其隱乎對曰吾豈隱者邪愚者也窮而然爾或者不喻遂為述時命以辯之先曾為述居一篇因刋而次之總命曰自述述時昔隋氏逆天地之道絶生人之命使怨痛之聲滿于四海四海之内隋人未老隋社未安而隋國已亡何哉奢淫暴虐昏惑而已烝人苦之上訴皇天皇天有命於我國家六葉于兹高皇至勤文皇至明身鑒隋室不敢滿溢清儉之深聽察之至仁惠之極泱泱洋洋為萬代則聖皇承之不言而化四十餘年天下太平禮樂化於戎夷慈惠及於草木雖奴隷齒類亦能誦周公孔父之書説陶唐虞夏之道至於歌頌謳吟婦人童子皆紓性情美辭韻指詠時物與絲竹諧會綺羅當稱况世貴之士博學君子其文學聲望安得不顯聞於當時也哉故冠冕之士傾當時大利軒車之士富當時大農由此知官不勝人逸於司領使秩次不能損又休罷以抑之尚駢肩累趾授任不暇予愚愚者亦當預焉日覺抵塞厭於無用乃以因慕古人清和藴純周周仲仲瘱於計反然全真上全忠孝下盡仁信内順元化外娭大和足矣如戚促蚩諸稱脂反封䝉遏滅慕為朝貴心所不喜亦由金可鎔不可使為汙腐水可濁不可使為塵糞然已鄙語曰愚者似直弱者似仁予殆有之夫復何疑述命元子嘗問命於清惠先生先生曰子欲知命不如平心平心不如忘情喏如酌反敬言也曰幸先生教之先生曰夫平心能正是非忘情能滅有無子何先焉曰請先忘情先生曰子見草木乎子見天地乎草木無心也天地無情也而四時自化雨露自均根柢自深枝幹自茂如是天地豈醜授而成哉草木豈憂求而生哉人之命也亦由是矣若夭若壽若貴若賤烏可強哉不可強也不可強也不如忘情忘情當學草木嗚呼上皇強化天下天下化之養之以道德道德偽薄天下亦從而偽薄嗚呼後王急濟天下天下從之救之以權宜權宜侈惡天下亦從而侈惡故赴貪徇紛急之風以至于今聖賢者兢兢然猶傷命性愚惑者慁慁然遂忘家國其由不審不通醜授憂求而已子不喻乎述居天寶庚寅元子得商餘之山山東有谷曰餘中谷東有山曰少餘山谷中有田可耕藝者三數夫一夫百畝有泉停浸可畦稻者數十畝泉東南合肥溪溪源在少餘山下溪流出谷與潨職隆反水合滙于滍將成所居故人李才聞而來會乃歎曰吾未始知夫子之所至焉今知之矣吾聞在貧思富在賤思貴人之常情也聖賢所有然而知貧賤不可茍免富貴不可茍取上順時命乗道御和下守虚澹修已推分稱君子者始不公乎乃相與占山泉闢榛莽依山腹近泉源始為亭廡始作堂宇因而習靜適自保閑夫人生於世如行長道所行有極而道無窮奔走不停夫然何適予當乗時和望年豐耕藝山田兼備藥石與兄弟承歡於膝下與朋友和樂於琴酒寥然順命不為物累亦自得之分在於此也次山集巻五欽定四庫全書次山集巻六唐
