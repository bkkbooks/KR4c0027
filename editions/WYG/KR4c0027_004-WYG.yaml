  hash: sha256:27216ecf57b220ee2d6fba07456de1e6f35e24983f43e8c514fc001451e8edeb
body:
  text: 癸卯歳漫叟授道州刺史道州舊四萬餘户經賊已來不滿四千大半不勝賦税到官未五十日承諸使徴求符牒二百餘封皆曰失其限者罪至貶削於戲若悉應其命則州縣破亂刺史欲焉逃罪若不應命又即獲罪戾必不免也吾將守官靜以安人待罪而已此州是舂陵故地故作舂陵行以達下情軍國多所需切責在有司有司臨郡縣刑法競欲施供給豈不憂徴斂又可悲州小經亂亡遺人實困疲大鄉無十家大族命單羸朝餐是草根暮食是木皮出言氣欲絶意速行步遲追呼尚不忍况乃鞭扑之郵亭傳急符來往跡相追更無寛大恩但有迫促期欲令鬻兒女言發恐亂隨悉使索其家而又無生資聽彼道路言怨傷誰復知去冬山賊來殺奪幾無遺所願見王官撫養以惠慈奈何重驅逐不使存活為安人天子命符節我所持州縣忽亂亡得罪復是誰逋緩違詔令䝉責固所宜前賢重守分惡以禍福移亦云貴守官不愛能適時顧惟孱弱者正直當不虧何人采國風吾欲獻此辭賊退示官吏有序癸卯歳西原賊入道州焚燒殺掠幾盡而去明年賊又攻永州破邵不犯此州邊鄙而退豈力能制敵歟蓋䝉其傷憐而已諸使何為忍苦徴斂故作詩一篇以示官吏昔歳逢太平山林二十年泉源在庭户洞壑當門前井税有常期日晏猶得眠忽然遭世變數歳親戎旃今來典斯郡山夷又紛然城小賊不屠人貧傷可憐是以陷鄰境此州獨見全使臣將王命豈不如賊焉今彼徴斂者迫之如火煎誰能絶人命以作時世賢思欲委符節引竿自刺船將家就魚麥歸老江海邊遊右溪勸學者小溪在城下形勝堪賞愛尤宜春水滿水石更殊怪長山勢囘合井邑相縈帶石林繞舜祠西南正相對階庭無爭訟郊境罷守衞時時溪上來勸引辭學輩今誰不務武儒雅道將廢豈忘二三子旦夕相勉勵遊潓泉示泉上學者顧吾漫浪久不欲有所拘毎到潓泉上情性可安舒草堂在山曲澄瀾涵階除松竹蔭幽徑清源湧坐隅築塘列圃畦引流灌時蔬復在郊郭外正堪靜者居愜心則自適喜尚人或殊此中若可安不佩銅虎符石魚湖上作有序潓泉南上有獨石在水中狀如遊魚魚凹處修之可以䝻舉魚反酒水涯四匝多欹石相連石上堪人坐水能浮小舫載酒又能繞石魚洄流乃命湖曰石魚湖鐫銘於湖上顯示來者又作詩以歌之吾愛石魚湖石魚在湖裏魚背有酒樽繞魚是湖水兒童作小舫載酒勝一杯座中令酒舫空去復滿來湖岸多欹石石下流寒泉醉中一盥漱快意無比焉金玉吾不須軒冕吾不愛且欲坐湖畔石魚長相對宴湖上亭作廣亭蓋小湖湖亭實清曠軒窻幽水石怪異尤難狀石樽能寒酒寒水宜初漲岸曲坐客稀杯浮上揺漾逺風入簾幕淅瀝吹酒舫欲去未囘時飄飄正堪望酣興思共醉促酒更相向舫去若驚鳬溶瀛滿湖浪朝來暮忘返暮歸獨惆悵誰肯愛林泉從吾老湖上引東泉作東泉人未知在我左山東引之傍山來垂流落庭中宿霧含朝光掩映如殘虹有時散成雨飄灑隨清風衆源發淵竇殊怪皆不同此流又高懸􅡶􅡶孚袁反在長空山林何處無兹地不可逢吾欲解纓佩便為泉上翁登白雲亭出門上南山喜逐松徑行窮高欲極逺始到白雲亭長山繞井邑登望宜新晴洲渚曲湘水縈囘隨郡城九疑千萬峯嵺嵺天外青煙雲無逺近皆傍林嶺生俯視松竹間石水何幽清涵映滿軒户娟娟如鏡明何人病惛濃積醉且未醒與我一登臨為君安性情潓陽亭作有序初得潓泉則為亭於泉上因開簷霤又得石渠泉渠相宜亭更加好以亭在泉北故命之曰潓陽亭問吾常讌息泉上何處好獨有潓陽亭令人可終老前軒臨潓泉憑几潄清流外物自相擾淵淵還復休有時出東户更欲簷下坐非我意不行石渠能留我峯石若鱗次欹乖復旋囘為我引潓泉泠泠簷下來天寒宜泉温泉寒宜大暑誰到潓陽亭其心肯思去夜讌石魚湖作風霜雖慘然出遊熙天正平聲登臨日暮歸置酒湖上亭高燭照泉深光華溢軒楹如見海底日曈曈日始明徒紅反始欲生夜寒閉窗户石澑何清泠若在深洞中半崖聞水聲醉人疑舫影呼指遞相驚何故有雙魚隨吾酒舫行醉昏能誕語勸醉能忘情坐無拘忌人勿限醉與醒招陶別駕家華陽作海内厭兵革騷騷十二年華陽洞中人似不知亂焉誰能家此地終老可自全草堂背巖洞幾峰軒户前清渠匝庭堂出門仍灌田半崖盤石徑高亭臨極顛引望見何處逶迤隴北川杉松幾萬株蒼蒼滿前山巖高曖華陽飛澑何潺潺洞深迷逺近但覺多洄淵晝遊興未盡日暮不欲眠探燭飲洞中醉昏漱寒泉始知天下心耽愛各有偏陶家世高逸公忍不獨然無或畢婚嫁竟為俗務牽題孟中丞茅閣小山為郡城隨水能縈紆亭亭最高處今是西南隅杉大老猶在蒼蒼數十株垂陰滿城上枝葉何扶疎乃知四海中遺事誰謂無及觀茅閣成始覺形勝殊憑軒望熊湘雲榭連蒼梧天下正炎熱此然冰雪俱客有在中坐頌歌復何如公欲舉遺材如此佳木歟公方庇蒼生又如斯閣乎請達謡頌聲願公且踟蹰劉侍御月夜讌會我從蒼梧來將耕舊山田踟蹰為故人且復停歸船日夕得相從轉覺和樂全愚愛涼風來明月正滿天河漢望不見幾星猶粲然中夜興欲酣改坐臨清川未醉恐天旦更歌促繁絃歡娯不可逢請君莫言旋別孟校書吾聞近南海乃是魑魅鄉忽見孟夫子歡然遊此方忽喜海風來海帆又欲長漂漂隨所去不念歸路長君有失母兒愛之似阿陽始解隨人行不欲離君傍相勸早旋歸此言慎勿忘別何員外誰能守清躅誰能嗣世儒吾見何君饒為人有是夫黜官二十年未曾暫崎嶇終不病貧賤寥寥無所拘忽然逢知已數月領官符猶是尚書郎收賦來江湖人皆悉蒼生隨意極所須比盜無兵甲似偷又不如公能獨寛大使之力自輸吾欲探時謡為公伏奏書但恐抵忌諱未知肯聽無不然且相送醉歡於坐隅窊樽詩巉巉小山石數峰對窊亭窊石堪為樽狀類不可名巡囘數尺間如見小蓬瀛樽中酒初漲始有島嶼生豈無日觀峰直下臨滄溟愛之不覺醉醉卧還自醒醒醉在樽畔始為吾性情若以形勝論坐隅臨郡城平湖近堦砌逺山復青青異木幾十株枝條冒簷楹盤根滿石上皆作龍蛇形酒堂貯釀器户牖皆罌缾此樽可常滿誰是陶淵明登九疑第二峰九疑第二峰其上有仙壇杉松映飛泉蒼蒼在雲端何人居此處云是魯女冠不知幾百歳讌坐餌金丹相傳羽化時雲鶴滿峯巒婦中有高人相望空長歎宿洄溪翁宅長松萬株遶茅舍怪石寒泉近簷下老翁八十猶能行將領兒孫行拾稼吾羨老翁居處幽吾愛老翁無所求時俗是非何足道得似老翁吾即休石魚湖上醉歌有序漫叟以公田米釀酒因休暇則載酒於湖上時取一醉歡醉中據湖岸引臂向魚取酒使舫載之徧飲坐者意疑倚巴丘酌於君山之上諸子環洞庭而坐酒舫泛泛然觸波濤而往來者乃作歌以長之石魚湖似洞庭夏水欲滿君山青山為樽水為沼酒徒厯厯坐洲島長風連日作大浪不能廢人運酒舫我持長瓢坐巴丘酌飲四坐以散愁宿無為觀九疑山深幾千里峰谷崎嶇人不到山中舊有仙姥家十里飛泉遶丹竈如今道士三四人茹芝鍊玉學輕身霓裳羽蓋傍臨壑飄飄似欲來雲鶴無為洞口作無為洞口春水滿無為洞傍春雲白愛此踟蹰不能去令人悔作衣冠客洞傍山僧皆學禪無求無欲亦忘年欲問其心不能問我到此中得無悶朝陽巖下歌朝陽巖下湘水深朝陽洞口寒泉清零陵城郭夾湘岸巖洞幽奇當郡城荒蕪自古人不見零陵徒有先賢傳水石為娯安可羨長歌一曲畱相勸説洄溪招退者在州南江華縣長松亭亭滿四山山間乳竇流清泉洄溪正在此山裏乳水松膏常灌田松膏乳水田肥良稻苗如蒲米粒長麋色如珈玉液酒酒熟猶聞松節香溪邊老翁年幾許長男頭白孫嫁女問言只食松田米無藥無方向人語浯溪石下多泉源盛暑大寒冬大温屠蘇宜在水中石洄溪一曲自當門吾今欲作洄溪翁誰能住我舍西東勿憚山深與地僻羅浮尚有葛仙翁宿丹崖翁宅扁舟欲到瀧口湍春水湍瀧上水難投竿來泊丹崖下得與崖翁盡一歡丹崖之亭當石顛破竹半山引寒泉泉流掩映在木杪有若白鳥飛林間往往隨風作霧雨濕人巾履滿庭前丹崖翁愛丹崖棄官幾年崖下家兒孫棹船抱酒甕醉裏長歌揮釣車吾將求退與翁遊學翁歌醉在魚舟宫吏隨人往未得却望丹崖慙復羞欸乃曲五首有序大厯丁未中漫叟以軍事詣都使還州逢春水舟行不進作欸乃五曲舟子唱之蓋欲取適於道路耳詞曰偶存名跡在人間順俗與時未安閒來謁大官兼問政扁舟却入九疑山湘江二月春水平滿月和風宜夜行唱橈欲過平陽戍守吏相呼問姓名千里楓林煙雨深無朝無暮有猿吟停橈靜聽曲中意好是雲山韶濩音零陵郡北湘水東浯溪形勝滿湘中溪口石顛堪自逸誰能相伴作漁翁下瀧船似入深淵上瀧船似欲昇天瀧南始到九疑郡應絶高人乗興船次山集巻四欽定四庫全書次山集巻五唐元結撰引極三首有序引極興也喻也引之言演極之言盡演意盡物引興極喻故曰引極思元極天曠􅀈莫郎反兮杳泱烏朗反茫氣浩浩兮色蒼蒼上何有兮人不測積清寥兮成元極彼元極兮靈且異思一見兮藐忙招反難致思不從兮空自傷心慅蘇遭反􅻺兮意惶懹思假翼兮鸞鳳乗長風兮上羾古送反揖元氣兮本深實餐至和兮永終日望仙府山鑿落兮眇嶔岑雲溶溶兮木棽棽中何有兮人不覩逺欹差兮閟仙府彼仙府兮深且幽望一至兮藐無由望不從兮知如何心混混兮意渾和思假足兮虎豹超阻絶兮凌趠諸教反詣仙府兮從羽人餌五靈兮保清真懷潛君海浩淼兮汩洪溶流藴藴兮濤洶洶下何有兮人不聞深溢漭兮居潛君彼潛君兮聖且神思一見兮藐無因思不從兮空踟蹰心囘迷兮意縈紆思假鱗兮鯤龍激沆湖浪反浪兮奔從拜潛君兮索𤣥寶佩元符兮軌皇道演興四首有序商餘山有太靈古祠傳云豢龍氏祠大帝所立祠在少餘西乳之下邑人修之以祈田予因為招祠訟閔之文以演興辭曰招太靈招太靈兮山之顛山屹􅙣兮水淪漣祠之䄤洛代反墮壞也兮眇何年木脩脩兮草鮮鮮嗟魑魅兮淫厲自古昔兮崇祭禧太靈兮端清予願致夫精誠久愵奴厯反兮㤝㤝處龍反招捃􅀈郎丁反兮呼風風之聲兮起飅飅吹𤣥雲兮散而浮望太靈兮儼而安澹油溶兮都清閑初祀山之乳兮葺太祠木孫為桷兮木母榱雲纓為􅦲莫到反門樞之横梁兮愚木栭洞淵禪兮揭巍巍塗木蘭兮蒔市之反糅蔫被弱草兮禘礿聯仡許訖反渾洪兮馥闐闐管化石兮洞刳天翹修釤兮棹蕪殳靈巫􅀈力軌反兮舞顒干薦天􅀈羊至反字音皆未詳兮酒陽泉獻水芸兮飯霜秈相然反與太靈兮千萬年訟木魅登高峯兮俯幽谷心悴悴倉卒反兮念羣木見樗栲兮相陰覆憐梫榕上七林下余封兮不豐茂見榛梗之森梢閔樅橎上土恭下甫元兮合蠧槢以八反橈橈女教反兮未堅椲韋鬼反桹桹力唐反兮可屈樒美畢反林樽上而寸下兹損兮不香拔丰茸兮已實豈元化之不均兮非雨露之偏殊諒理性之不等於順時兮不如瘱於計反吾心以㝠想終念此兮不怡佁徒充反以書義考之當作侗予莫識天地之意兮願截惡木之根傾梟獍之古巢取闕童以為薪割大木使飛焰徯枯腐之燒焚實非吾心之不仁惠也豈恥夫善惡之相紛且欲畚三河之膏壤禆濟水之清漣將封灌乎善木令橚橚息逐反以梴梴丑然反尚畏乎衆善之未茂兮為衆惡之所挑凌思聚義以為曹令敷扶以相勝取方所以柯如兮吾將出於南荒求壽藤與燔木吾將出於東方祈有德而來歸輔神檉與堅香且憂顒之翩翩又愁㺠以主反之奔馳及陰陽兮不和惡此土之失時令神檉兮不茂使堅香兮不滋重嗟惋兮何補毎齋心以精意切援祝於神明冀感通於天地猶恐衆妖兮木魅魍魎兮山精上誤感於靈心經紿于言兮不聽敢引佩以指水誓吾心兮自明閔岭中郎丁反登羣山以延想吾獨閔乎岭中彼岭中兮何有有天含之玉峰殊閟絶之極顛上聞産乎翠茸欲採之以將壽眇不知夫所從大淵藴藴兮絶嶘士眼反岌岌非梯梁以通險當無路兮可入彼猛毒兮曹聚必憑託乎阻脩常儗儗兮伺人又如何兮不愁彼妖精兮變怪必假見於風雨常閃閃而伺人又如何兮不苦欲仗仁兮託信將徑往兮不難久懹懹以㥄惋上力膺下鳥段却遲迴而永歎懼太靈兮不知以予心為永惟若不可乎遂已吾終保夫直方則必䝉皮篻莫招反以為矢絃母筱以周反以為弧化毒銅以為㦸刺棘竹以為殳得猛烈之材獲與之而並驅且舂刺乎惡毒又引射夫妖怪盡羣類兮使無令善仁兮不害然後採梫榕以駕深收樅橞胡桂反兮梯險躋予身之飄飄承予步之􅀈􅀈以冉反入岭中而登玉峰極閟絶而求翠茸將吾壽兮隨所從思未得兮馬如龍獨翳蔽於山顛久低囘而愠瘀空仰訟於上𤣥彼至精兮必應寧古有而今無將與身而皆亡豈言之而已乎七不如七篇有序元子常自愧不如孩孺不如宵寐又不如病又不如醉有思慮不如靜而閒有喜愛不如忘其情及
