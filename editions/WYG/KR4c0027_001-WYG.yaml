  hash: sha256:51a75f4634dfa8598a0a1436da0b7764830edd1f3a97661222387da2fe2b38d1
body:
  text: 唐元結撰補樂歌十首有序自伏羲氏至于殷室凡十代樂歌有其名亡其辭考之傳記而義或存焉嗚呼樂聲自太古始百世之後盡無一作亡古音嗚呼樂歌自太古始百世之後遂無一作亡古辭今國家追復純古列祠往帝歲時薦享則必作樂而無雲門咸池韶夏之聲故探其名義以補之誠不足全化金石反正宫羽而或存之猶乙乙㝠㝠有純古之聲豈幾乎司樂君子道和焉爾凡十篇十有九章各引其義以序之命曰補樂歌網罟伏羲氏之樂歌也其義蓋稱伏羲能易人取禽獸之勞吾人苦兮水深深網罟設兮水不深吾人苦兮山幽幽網罟設兮山不幽右網罟二章章四句豐年神農氏之樂歌也其義蓋稱神農教人種植之功猗太帝兮其智如神分草實兮濟我生人猗太帝兮其功如天均四時兮成我豐年右豐年二章章四句雲門軒轅氏之樂歌也其義蓋言雲之出潤益萬物如帝之德無所不施𤣥雲溶溶兮垂雨濛濛類我聖澤兮涵濡不窮𤣥雲漠漠兮含映愈光類我聖德兮溥被無方右雲門二章章四句九淵少昊氏之樂歌也其義蓋稱少昊之德淵然深遠聖德至深兮蘊蘊一作奫奫如淵生類娭娭許其反兮孰知其然右九淵一章章四句五莖顓頊氏之樂歌也其義蓋稱顓頊得五德之根莖植植萬物兮滔滔根莖五德涵柔兮渢渢舊音容别本房戎切而生其生如何兮秞秞以周反天下皆自我君兮化成右五莖一章章七句六英高辛氏之樂歌也其義蓋稱帝嚳能總六合之英華我有金石兮擊考崇崇一作撃拊淙淙與汝歌舞兮上帝之風由六合兮英華渢渢我有絲竹兮韻和泠泠與汝歌舞兮上帝之聲由六合兮根底嬴嬴右六英二章章六句咸池陶唐氏之樂歌也其義蓋稱堯德至大無不備全元化油油兮孰知其然至德汩汩兮順之以先元化浘浘音尾兮孰知其然至道泱泱兮由之以全右咸池二章章四句大韶有虞氏之樂歌也其義蓋稱舜能紹先聖之德森森羣象兮日見生成欲聞朕初兮𤣥封㝠㝠洋洋至化兮日見深柔欲聞涵濩兮大淵油油右大韶二章章四句大夏有夏氏之樂歌也其義蓋稱禹治水其功能大中國茫茫下土兮乃生九州山有長岑兮川有深流茫茫下土兮乃均四方國有安人兮野有封疆茫茫下土兮乃歌萬年上有茂功兮下戴仁天右大夏三章章四句大濩有殷氏之樂歌也其義蓋稱湯救天下濩然得所萬姓苦兮怨且哭不有聖人兮誰濩育聖人生兮天下和萬姓熈熈兮舞且歌右大濩二章章四句二風詩有序天寳丁亥中元子以文辭待制闕下著皇謨三篇二風詩十篇將欲求干司匭氏以裨天監㑹有司奏待制者悉去之于是歸于州里後三歲以多病習靜于商餘山病間遂題括存之此亦古之賤士不忘盡臣之分耳其義有論訂之治風詩五篇古有仁帝能全仁明以封天下故為至仁之詩二章猗皇至聖兮至惠至仁德施蘊蘊紆文反蘊蘊如何不全不缺莫知所貺猗皇至聖兮至儉至明化流瀛瀛瀛瀛如何不虢許杲反不􅀈字與音皆未詳莫知其極右至仁四韻十二句古有慈帝能保靜順以涵萬物故為至慈之詩二章至化之深兮猗猗娭娭如煦如吹如負如持而不知其慈故莫周莫止靜和而止至化之極兮瀛瀛溶溶如涵如封如隨如從而不知其功故莫由莫巳順時而理右至慈四韻十四句古有勞王能執勞儉以大功業故為至勞之詩三章至哉勤績不盈不延誰能頌之我請頌焉於戲勞王勤亦何極濟爾九土山川溝洫至哉儉德不豐不敷誰能頌之我請頌夫於戲勞王儉亦何深戒爾萬代奢侈荒淫至哉茂功不升不圯誰能頌之我請頌矣於戲勞王功亦何大去爾兆庶洪湮災害右至勞六韻二十四句古有正王能正慎恭和以安上下故為至正之詩一章為君之道何以為明功不濫賞罪不濫刑讜言則聴諂言不聴王至是然可為明焉右至正四韻八句古有理王能守清一以致無刑故為至理之詩一章理何為兮系修文德加之清一莫不順則意彼刑法設以化人致使無之而化益純所謂代刑以道去殺嗚呼嗚呼人不斯察右至理三韻十二句亂風詩五篇古有荒王忘戒慎道以逸豫失國故為至荒之詩一章國有世謨仁信勤歟王實惛荒終亡此乎焉有力恣諂惑而不亡其國嗚呼亡王忍為此心敢正亡王永為世箴右至荒三韻十句古有亂王肆極凶虐亂亡乃巳故為至亂之詩二章嘻乎王家曾有凶王中世失國豈非驕荒復復之難令則可忘嘻乎亂王王心何思暴淫虐惑無思不為生人寃怨言何極之右至亂二韻十二句古有虐王昏毒狂忍無惡不及故為至虐之詩二章夫為君上兮慈順明恕可以化人忍行昏恣獨樂其身一徇所欲萬方悲哀於斯而喜當云乎哉夫為君上兮兢慎儉約可以保身忍行荒惑虐暴於人前世失國如王者多於斯不寤當如之何右至虐四韻十八句古有惑王用姦臣以虐外寵妖女以亂内内外用亂至於崩亡故為至惑之詩二章賢聖為上兮必儉約戒身鑒察化人所以保福也如何不思荒恣是為上下隔塞人神怨奰平放反敖惡無厭不畏顛墜聖賢為上兮用必賢正黜姦佞之臣所以長久也如何反是以為亂矣寵邪信惑近佞好䛕廢嫡立庶忍為禍謨右至惑六韻二十句古有傷王以崩盪之餘無惡不為也亂亡之由固在累積故為至傷之詩一章夫何傷乎傷王乎欲何為乎將蠧枯矣無人救乎蠧枯及矣不可救乎嗟傷王自為人君變為人奴為人君者忘戒此乎右至傷二韻十二句二風詩論客有問元子曰子著二風詩何也曰吾欲極帝王理亂之道系古人規諷之流曰如何也夫至理之道先之以仁明故頌帝堯為仁帝安之以慈順故頌帝舜為慈帝成之以勞儉故頌夏禹為勞王修之以敬慎故頌殷宗為正王守之以清一故頌周成為理王此理風也夫至亂之道先之以逸惑故閔太康為荒王壞之以苛縱故閔夏桀為亂王覆之以淫暴故閔殷紂為虐王危之以用亂故閔周幽為惑王亡之累於積故閔周赧為傷王此亂風也訂曰子頌善上不及羲軒湯武閔惡又不及始皇哀靈焉可稱極帝王理亂之道對曰於戲吾敢言極極其中道者也吾且不曰著斯詩也將系規諷乎如羲軒之道也久矣誰能師尊如湯武之德吾則不敢頌為規法過於是也吾子審之次山集巻一欽定四庫全書次山集巻二唐元結撰
