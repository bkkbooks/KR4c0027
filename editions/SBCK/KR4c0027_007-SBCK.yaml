front:
  text: 唐元次山文集卷第七
  hash: sha256:dab29e8f074e2840022ca4392cd1bc73f50e51e379eb9508ce7de139cbc2f551
  markers:
  - {type: page-break, offset: 0, content: '', id: KR4c0027_SBCK_007-1a}
body:
  text: 與韋尚書書乾元二年韋陟為禮部尚書東都留守某月日前進士元結頓首尚書公閣下結每聞賢卿大夫䏻以至公之道推引君子使名聲徳業相繼稱顯則思見之若不以至公之道推引士君子使禍惡凶辱同日更受則不思見之結􅀁以年四十足不入扵公卿之門身不齒扵利祿之士豈忘榮顯盖懼汚辱昨者有詔使結得詣京師至汝上逢山􅀛亦承詔詣京師結與山􅀛俱得乘郵而来郵長待結頗如􅀛者前日謁見尚書俯拜堦下本望齒乘郵與諸􅀛結待命而退不望尚書不以結齒之扵􅀛以士君子見禮問及詞賦許且休息此結之幸豈結望尚書之意古人􅀁以愛􅀴術之士重山野之客採輿童之誦者盖爲其䏻明古以論今方正而不諱悉人之下情結雖昧扵􅀴術然自山野而來䏻悉下情尚書與􅀦休戚䏻無問乎事有在尚書力及䏻不行乎結頓首與李相公書乾元二年李揆爲中書侍郎平章事月日新授右金吾兵曹參軍攝監察御史元結頓首相公執事某性愚弱本不敢干時求進十餘年間在山野過爲知已猥見稱譽辱在郷選名汚上第退而知耻更自委順亦數年矣中逢䘮亂奔走江海當死復生見有今日林壑不保敢思祿位忽枉公詔命詣京師州縣發遣不得辝避三四千里煩勞公車始命蹈舞帝庭即日辭命擔囊乞丐復歸海濵今則過次授官又令􅀅命謀人軍者誰曰易乎相公見某但禮文拜揖之外無􅀁問焉忽然狂妄男子不稱任使坐招敗辱相公如何某􅀁以盡􅀁知見聞扵左右不審相公以為可否如曰不可合正典刑欺上罔下是某之罪謹奉詔書及章服待命屏外某頓首與韋洪州書上元二年韋為洪州刺史江西觀察使某月日荆南節度判官水部貟外郎兼殿中侍御史元結頓首某聞古之賢逹居權位也令當世頌其徳後世師其行何以言之在分君子小人察視邪正使無􅁈濫而無憤痛耳某不䏻逺􅂑古人請以端公賢公中丞為喻前者􅀗接端公餘論某甞議及中丞某以為賞中丞之功未當論中丞之􅁈至濫端公不知情至泣涕交流豈不為有􅁈濫未申而生此憤痛某扵端公頗為親故官又差肩曾不垂問便即責使冤濫者豈獨中丞而巳乎憤痛者豈獨端公而巳乎􅀁以至遣使者試以自明端公前牒則請不交兵端公後牒則請速交兵如此豈端公自察辨誤耶有小人惑亂端公耶端公又云荆南􅀅士侵暴端公豈䏻保荆南􅀅士必侵暴乎豈䏻保淮西􅀅士必不侵暴乎端公少垂察問某又聞泗上鄰家之事請說以自喻昔泗上有鄰家有朋友逰者闘之逰東家則曰公之友賢䏻益主人西家之友愚䏻損主人逰西家則曰公之友智䏻譽主人東家之友狡䏻毁主人見其友亦如闘主人之論扵是鄰家之友相惡􅀅相害鄰家之翁怒􅀅相絶里有正信之士為辯之然後鄰家通歡鄰友相善荆南與江西猶鄰家也某其友乎逰者方相閗誰為正信之士一為辯之某敢以此書獻端公閣下與吕相公書某月日某官某再拜相公閣下某嘗見時人不䏻自守性分俛仰扵傾奪之中低徊扵名利之下至有傷汚毁辱之患滅身亡家之禍則欲劇為之箴扵身豈願踰性分􅂑禍辱而忘自箴者耶某性荒浪無拘限毎不䏻節酒與人相見􅆘在一室不䏻無歡扵醉醉歡之中不䏻無過少不學為吏長又著書論自􅆘昔天下太平不敢絶世業亦欲求文學之官職貟散冗者為子孫計耳自兵興以来此望亦絶何㢤某一身奉親奔走萬里􅀁望飲啄承歡膝下今則辱在官以逾其性分觸禍辱機兆者日未無之某又三世單貧年過四十弱子無母年未十􅀊􅀌生嫁娶者一人相公視某敢以身徇名利者乎有如某者以身徇名利齒扵奴􅀠尚可羞而况士君子也歟某甚愚鈍又無功勞自布衣歴官不十月官至尚書郎向三嵗官未削人多相榮某實自憂相公忍令某漸至畏懼而死甚令必受禍辱而巳某前後􅀁言相公似未見信故籍􅁓筆煩凟門下某再拜與何員外書永泰中何昌􅁉為戸部員外月日次山白何夫子執事皮弁時俗廢之乆矣非好古君子誰䏻存之忽蒙見贈驚喜無喻次山漫浪者也苦不愛便事之服時世之巾昔年在山野曾作愚巾凡裘異扵制度凡裘領緇界緇縁緇帶其餘皆􅄄帶聮後縫中腰前繫愚巾頂方帶方垂方緇葛為之玄絲為緌次山自衣帶巾裘雖不為時人大惡亦嘗辱其嗤誚方欲雜古人衣帶以自免辱贈及皮弁與凡裘正相宜若風霜􅃤然出行林野次山則戴皮弁衣凡裘若大暑蒸濕出見賔客次山則戴愚巾衣野服野服大抵緇􅄄布􅁑爲之也腰擔爲裳短􅁭爲衣裳下及􅋰衣垂及膝下不審夫子異時歸休􅆘在山野䏻水戴此者不乎若以爲宜當各造一副送徃元次山白篋中集序元結作篋中集􅂉問曰公􅀁集之詩何以訂之對曰風雅不興㡬及千􅀊溺扵時者世無人㢤嗚呼有名位不顯年夀不􅀅獨無知音不見稱顯死而巳矣誰云無之近世作者更相㳂襲拘限聲病喜尚形似且以流易爲辭不知䘮扵雅正然㢤彼則指詠時物會諧絲竹與歌兒舞女生汚惑之聲扵私室可矣若令方直之士大雅君子聴而誦之則未見其可呉興沈于運獨挺扵流俗之中强攘扵巳溺之後窮老不惑五十餘年凡􅀁爲文皆與時異故朋友後生稍見師效䏻似􅀋者有五六人扵戯自沈公及二三子皆以正直而無祿位皆以忠信而乆貧賤皆以仁譲而至䘮亡異扵是者顯榮當世誰爲辯士吾欲問之兵興扵今六嵗人皆務武斯焉誰嗣巳長逝者遺文散失方祖師者不見近作盡篋中􅀁有總編次之命曰篋中集且欲傳之親故兾其不忘扵今凡七人詩二十二首時乾元三年也别韓方源序昔元次山與韓方源别于啇餘約不終嵗復相見扵此山忽八年扵今始􅀗相見悲歡之至言可極耶次山與方源昔年俱順扵山谷有終焉之意今方源得如其心次山汚其冠冕次山一顧方源再三漸羞時復飲酒求其安家今方源欲安家肥陽次山方理兵九江相醉相辭不必如昔年之約此情豈易然者耶乙未之前次山有元子乙未之後次山有猗玕子戊戌中次山有浪􅀃悉贈方源庶方源見次山之意别王佐卿序癸卯嵗京兆王契佐卿年四十六河南元結次山年四十五時次山湏浪逰呉中佐卿湏日去西蜀對酒欲别此情易耶在少年時握手􅀏别雖逺不恨以天下無事志氣猶壯今與佐卿年近五十又逢戰争未息相去萬里欲强笑别其可得乎與佐卿去者有清河崔異與次山徃者有彭城劉灣相醉相留㡬日江畔主人鄂州刺史韋延安令四座作詩命予為序以送逺云劉侍御月夜讌㑹序兵興巳来十一年矣􅀗與同志歡醉達旦詠歌􅂑􅆘無一二焉乙巳嵗彭城劉靈源在衡陽逢故人或有在者曰昔相㑹第歡逺逰始與諸公待月而􅀏語竟與諸公愛月而歡醉詠歌夜乆賦詩言懐扵戯文章道䘮盖乆矣時之作者煩雜過多歌兒舞女且相喜愛系之風雅誰道是耶諸公嘗欲變時俗之淫靡為後生之規範今夕豈不䏻道逹情性成一時之羙乎送孟校書徃南海序平昌孟雲卿與元次山同州里以辭學相友㡬二十年次山今罷守舂陵雲卿始典挍芸閣扵戯材業次山不如雲卿辭賦次山不如雲卿通和次山不如雲卿在次山又詡然求進者也誰言時命吾欲聴之次山今且未老雲卿少次山六七嵗雲卿名聲滿天下知已在朝廷及次山之年雲卿何事不可至勿随長風乘興蹈海勿愛羅浮徃而不歸南海幕府有樂安任鴻與次山最舊請任公為次山一白府主趣資装雲卿使北歸慎勿令徘徊海上諸公第醉歌送之送譚山人歸雲陽序吾扵九疑之下賞愛泉石今㡬三年䏻扁舟數千里来逰者獨雲陽譚子譚子文學􅀮名山野􅀮身雲陽之何世如君何牧犢愛雲陽之宰峻公不出南岳三十年今得雲陽一峰譚子又在焉彼真可家之者耶子去爲吾謀扵牧犢近峻公有泉山山石老􅀣夀藤縈垂水可灌田一夫火可燒種菽粟近泉可爲十數間茅舍􅀁詣􅂊通小船則吾徃而家矣此􅀖舜祠竒恠陽華之殊異潓泉之勝絶見峻公與牧犢一二􅀃之松竹滿庭水石滿堂石魚􅀒樽鳬舫運觴醉送譚子歸于雲陽漫叟元次山序别崔曼序漫叟年􅀅五十與時丗不合垂三十年愛惡之聲紛紛人間􅀶陵崔曼惑叟􅀁為逰而辨之數月未去㑹潭州都督張正言薦曼為属邑長􅀅行叟謂曰叟異時乃山林一病民耳宜不相罔行矣勿惑吾子有才業且明辯又方年少必䏻􅀣勲庸垂名聲若求先逹賢異䏻相抆拭正在張公張公徃年在西城主人䏻用其一言遂開城千里威震絶城張公徃在淮南逡巡指麾萬夫風􅀙遭逢猜疑馳而不為今海内兵革未息張公必為時用吾子勉之􅀁相規者􅀁宜緩歩富貴􅀙容謀畫少節酒平氣㮣耳送王及之容州序乾元中漫叟浪家于瀼溪之濵以耕釣自全而巳九江之人未相喜愛其意似懼叟衣食之不足耳叟亦不促促而􅀙之有王及者異夫郷人焉以文學相求不以覉旅見懼以相安為意不以可否自擇及扵叟也如是之多叟在舂陵及䏻相從逰嵗餘而去􅀅行規之曰叟愛及者也無惑叟言及方壯可强藝業勿以逰方為意人生若不䏻師表朝廷即當老死山谷彼驅驅扵財貨之末局局扵權􅀔之門縱得鍾􅂦亦胡顔受納行矣自愛耿容州歡扵叟者及到容州為叟謝主人聞幕府野次乆矣正宜􅀵擇謀夫引信才士有如及也䏻􅀵引乎二三子賦送逺之什以系此云問進士永泰二年道州問第一問天下興兵今十二年矣殺傷勞辱人似未猒控强兵據要害者外以奉王命為辭内實理車甲招賔客􅀣爪牙􅀦家亦因其􅀁利大者王而相之亞者公侯尚不滿望今欲散其士卒使歸郷里收其器械納之王府隨其才分與之祿位欲臨之以威武則力未䏻制欲責之以辭讓則其心未喻若捨而不問則未覩太平秀才通明古今才識傑異天下之兵湏觧蒼生湏致仁夀其䇿安出子其昌言第二問徃年天下太平仕者非累資序積勞考二十許年不離一尉至于入廊廟總樞轄則當時名聲籍甚者得至焉今商賈賤􅀋臺􅀠下品數月之間太者上汚卿監小者下辱州縣至扵廊廟不無雜人如專􅀴以求進主文而望逹者若不困頓扵林野則必悽惶扵道路今日􅀦家行何道得九流鑑清作何法得僥倖路絶施何令使人自知耻設何教使賢愚自分第三問開元天寳之中耕者益力四海之内髙山絶壑耒耜亦滿人家粮儲皆及數嵗太倉委積陳腐不可校量忽遇凶年榖猶耗盡當今三河膏壤淮泗沃野皆荆棘已老則耕可知太倉空虚雀䑕猶餓至于百姓朝暮不足而諸道聚兵百有餘萬遭嵗不稔􅀅何為謀今欲勸人耕種則䘮亡之後人自貧苦寒餒不救豈有生資今欲罷兵息戌則又冦盗猶在尚湏防遏使􅀦家用何䇿得人安俗阜不戰無兵用何謀使縦遇凶年亦無灾患第四問徃年粟一斛估錢四百猶貴近年粟一㪷估錢五百尚賤徃年帛一匹估錢五百猶貴近年帛一匹估錢二千尚賤今耕夫未盡織婦猶在何故徃年耕織計時量力勞苦忘倦求免寒餒何故今日甘心寒餒惰逰而巳扵戯曩時粟帛至賤衣食至易今日粟帛至貴衣食至難而人心勤惰如此其何故也試一啇之欲聞其􅀃第五問古人識貴精通學重兼博不有激發何以相求三禮何篇可刪三傳何者可廢墨氏非樂其禮何以儒家委命此言當乎彼天女天孫不知何物彼日兄月姉弟妹是誰駔儈與傖奴寧分一純􅀅二精何􅀃􅀌竹之君何姓新城老婦何名棘竹出自何方毒銅産扵何􅀦何郷無水可飲何地卧氷而温何人恩信過扵田横何人壯勇等扵關羽何人鑿坯而遁何人終日掃門無淺近之不為悉說唐元次山文集卷第七
