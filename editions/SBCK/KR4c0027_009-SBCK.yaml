front:
  text: 唐元次山文集卷第九
  hash: sha256:00c483aeeab430cf28ccf0c8c131882e2c4f8eee87776388415f993c8b5be2c5
  markers:
  - {type: page-break, offset: 0, content: '', id: KR4c0027_SBCK_009-1a}
body:
  text: 元魯縣墓表天寳十三年元子􅀙兄前魯縣大夫徳秀卒元子􅂘之哀門人叔盈問曰夫子哭􅀙兄也哀不亦過乎禮與對曰汝知禮之過而不知情之至叔盈退謂其徒曰夫子之􅂘元大夫也兼師友之分亦過矣元子聞之召叔盈謂曰吾誠哀過汝􅀁云也元大夫弱無􅀁固壮無􅀁專老無􅀁存死無􅀁餘此非人情人情􅀁耽溺喜愛似可惡者大夫無之如戒如懼如憎如惡此其無情此非有心士君子知焉不知也吾今之哀汝知之焉而不知也嗚呼元大夫生六十餘年而卒未嘗識婦人而視錦繡不頌之何以戒荒􅁋侈靡之徒也㢤未嘗求足而言利苟辭而便色不頌之何以戒貪猥侫媚之徒也㢤未嘗主十畝之地十尺之舎十嵗之童不頌之何以戒占田千夫室宇千柱家童百指之徒也㢤未嘗皂布帛而衣具五味而食不頌之何以戒綺紈梁肉之徒也㢤扵􅃧吾以元大夫徳行遺来世清獨君子方直之士也歟哀丘表乾元庚子元子理兵于有泌之南泌南至徳丁酉為䧟邑乾元巳亥為境上殺傷勞苦言可極耶街郭亂骨如古屠肆扵是収而藏之命曰哀丘􅂉曰次山之命哀丘也哀生人􅀅盡而亂骨不藏者乎哀壮勇巳死而名跡不顯者乎對曰非也吾哀凢人不䏻絶貪争毒亂之心守正和仁譲之分至今吾有哀丘之怨歟左黄州表乾元巳亥賛善大夫左振出為黄州刺史下車黄人歌曰我􅁒迯郷里我􅁒去墳墓左公今既来誰忍棄之去扵􅃧天下兵興今七年矣河淮之北千里荒草自關已東海濵之南屯兵百萬不勝征稅豈獨黄人䏻使其人忍不去者誰曰不可頌乎後一􅀊黄人又歌曰吾郷有􅀑巫惑人人不知天子正尊信左公䏻殺之扵􅃧近年以来以隂陽變怪􅀅􅀑神之道罔上惑下得尊重扵當時者日見欺人黄之巫女亦以妖妄得蒙恩澤朝廷不敢問州縣惟其意公忿而殺之則彼可誅戮豈獨巫女如左公者誰曰不可頌乎居三年遷侍御史判金州刺史􅀅去黄黄人多去思故為黄人作表如在氏世系左公厯官及黄之門生故吏與女巫事則南陽左公䏻悉記之吕公表上元二年置南都扵荆州為江􅁜府使舊相東平吕公為江􅁜尹兼御史大夫分峽中湖南及武􅁜灃陽巴陵凡一十七州為荆南節度觀察使公理荆南三年年五十一薨于官嗚呼使公年夀之不􅀅也天其未猒兵革不愛蒼生歟公明不盡人之私惠不取人之愛威不致人之懼令不求人之犯正不刑人之僻直不指人之恥故名不異俗跡不矯時内含端明外與常規其大雅君子全扵終始者耶公所以進退其身人不知其道公􅀁以再在台衡人不知其徳頌元化者誰預頌乎扵􅃧公􅀅用扵人而不見其用人􅀅得扵公而公忘其􅀁得乎結等迹參名業嘗在幕下􅀅紀盛徳示扵来世故刻金石留扵此􅀖惠公禪居表泝樊水二百餘里有湧溪入溪八九里有蛇山之陽是惠公禪居禪師以無情待人之有情以有為全已之無欲各因其性分莫不與善知人困窮喻使耕織因人灾患勸守仁信故閭里相化恥為弋釣日勤種植不五六年沮澤有溝塍荒皐有阡陌桑果竹園如伊洛間􅀁以愛禪師者無全行無全道豈䏻及此郷人欲増􅁱塔廟託禪師以求福禪師亦随人之意而制造焉直門臨溪廣堂背山庭列雙臺脩廊夏寒松竹蒼蒼周流清泉岑嶺􅃨抱衆山囬旋斯亦曠絶之殊境矣吾以􅀁疑咨扵禪師禪師曰我恐人忘善以事誘人及人􅀅善固不以事為累吾以􅀁惑咨扵禅師禅師曰公若以惑相問我亦惑扵問焉公若無惑我復何對扵􅃧吾漫浪者也焉䏻盡禅師之意乎縣大夫孟彦深王文淵識名顯當世必䏻盡禅師之意故命之作賛賛曰聖者忘跡逹人化心惠公之妙無得而尋如山出雲如水􅆂月惠公得之演用不竭無情之化可洽群􅀺􅀅引天下同扵湧溪夏侯岳州表癸卯嵗岳州刺史夏侯公殁于私家門人弟子愛思不忘願旌遺徳􅀅顯来世㑹予詔許優閑家于樊上故為公作表庚子中公鎮岳州予時為尚書郎在荆南幕府嘗因㢘問到公之州其時天下兵興巳六七十年矣人疲州小比太平時力役百倍公䏻清正寛恕静以理之故其人安和而服説為當時法則及公罷歸州里公家與吾相鄰見公在州里與山野童孺與當道辭色均若語是非得䘮語夭夀哀樂戀意澹然吾是知道勝扵内者物莫䏻撓徳充扵外者事不歸扵今之世誰不榮羡扵公之世嗣與公官則本縣􅀎誘公之􅀁至其獨有乎扵戲公既夀而貴保家全大夫李公状著之矣舜祠表有唐乙已嵗使持節道州諸軍事守道州刺史元結以虞舜塟扵蒼梧之九疑之山在我封内是故申明前詔立祠于州西之山南巳而刻石為表扵􅃧孔氏作虞書明大舜徳及生人之至則大舜扵生人宜以􅀋乎天地生人奉大舜宜萬世而不猒考大舜南廵之年時巳一百一十二嵗矣自中國至蒼梧亦㡬有萬里蒼梧山谷深險可懼帝竟人而不囬至今山下之人不知帝居之宫帝塟之􅁜嗚呼在有虞氏之世人民可奪其君耶人民扵大舜䏻忘而不思耶何為來而不歸何故死扵空山吾實惑而作表来者逰扵此􅀖登乎九疑誰䏻不惑也歟崔潭州表乙巳嵗潭州刺史崔灌去官州人衡州司功叅軍鄭浰為郷人某等請余為崔公作表公前在澧州謡頌之聲逹于朝廷褒異之詔與人為程及領此州在今日䏻使􅀌老寡弱無悲憂單貧困窮安其郷冨豪強家無利害賈人就食之􅀋各得其業職役供給不匱人而當扵有司若非清㢘而信正直而仁則不䏻至於觀察御史中丞孟公奏課又第一㑹􅀦家以犬戎為虞未即徴拜使蒼生正暍扵歇反而去其庥􅄻使蒼生正渇而敝其清源時艱道逺州人等不得詣闕􅁈訴且欲刻石立表以彰盛徳扵􅃧刺史有土官也千里之内品刑之屬不亦多乎豈可令㐫竪􅁀􅀋貪夫姦黨以貨權家而至此官如崔公有者豈獨真刺史耳鄭浰之爲豈苟媚其君而私扵州里耶盖懼清㢘正直之道溺扵時俗君子遺愛之心不顯来世故采其意而已矣張䖏士表永㤗丙午中䖏士張秀卒扵戲吾嘗驗古人􅀅老死巖谷逺跡時世者不必其心皆好山林若非介直方正與時丗不合必識髙行獨與時丗不合不然則剛褊傲逸與時世不合彼若遭逢不容則身不足以爲禍􅀅家族以随之至扵傷汚毁辱何足說者故使之矯然絶丗逃其不容直爲逸民竟爲退士枕石飲水終身而巳當時之君欲以禄位招之有土之官􅁒以厚禮䖏之彼驚惧抗絶而去時之見䏻如此􅀁以􅀹髙尚焉嗚呼䖏士與時不合者耶而未䏻矯然絶世遭以禮法相檢不見容悲夫菊圃記舂􅁜俗不種菊前時自逺致之植扵前庭墻下及􅂯来也菊已無矣徘􅆦舊圃嗟歎乆之誰不知菊也芳華可賞在藥品是良藥爲􅂼菜是佳􅂼縦湏地趍走猶宜徙植脩養而忍蹂踐至盡不愛惜乎扵􅃧賢士君子自植其身不可不慎擇􅀁䖏一旦遭人不愛重如此菊也悲傷柰何扵是更為之圃重畦植之其地近讌息之堂吏人不此奔走近登望之亭旌麾不此行列縦參歌妓菊非可惡之草使有酒徒菊為助興之物為之作記以託後人并錄藥􅀴列扵記後廣宴亭記樊水東盡其南乃樊山北鮮津吏􅁒扵鮮上而為􅀱舎漫叟家于樊上不醉則閑乃相其地形驗之圖記故實為宴逰之䖏縣大夫馬公登之歎曰謝公贈伏武昌詩云樊山開廣宴非此地耶吾􅁒因而脩之命曰廣宴亭何如漫叟頌之曰古人将修廢遺􅀹異之事為君子之道扵戯天下有廢遺􅀹異之事如此亭者誰䏻脩而旌之天􅀅猒悔徃乎使公方壮而有是心也當裁畜簡扎待為之頌故作此廣宴記殊亭記癸卯中扶風馬向兼理武昌以明信嚴㫁惠正為理故政不待時而成扵戯若明而不信嚴而不㫁惠而不正雖欲理身終不自理况扵人㢤公䏻令人理使身多暇招我畏暑且為凉亭亭臨大江復出山上佳木相䕃常多清風巡囬極望目不猒逺吾見公才殊政殊跡殊為此亭又殊因命之曰殊亭斵石刻記立于亭側庶㡬来者無􅀁惑焉右溪記道州城西百餘歩有小溪南流數十歩合營溪水抵兩岸悉皆怪石欹嵌盤屈不可名状清流觸石洄懸激注休木異竹垂隂相䕃此溪若在山野則宜逸民退士之􅀁逰䖏在人間可為都邑之勝境静者之林亭而置州已来無人賞愛徘􅆦溪上為之悵然乃䟽鑿蕪􅁾俾為亭宇植松與桂兼之香草以禆形勝為溪在州右遂命之曰右溪刻銘石上彰示来者刺史􅆹記天下太平方千里之内生植齒􅀋刺史乃存亡休慼之係天下兵興方千里之内䏻保􅀺庶䏻攘患難在刺史爾凢刺史若無文武才略若不清㢘肅下若不明惠公直則一州生􅀋皆受灾害扵戯自至此州見井邑丘墟生人㡬盡試問其故不覺涕下前軰刺史􅂉有貪猥惽弱不兮是非但以衣服飲食爲事數年之間蒼生蒙以私􅁒侵奪兼之公家驅迫非姦惡強冨殆無存者問之耆老前後刺史䏻恤養貧弱專守法令有徐公履道李公廙而巳遍問諸公善􅂉不及徐李惡有不堪說者故爲此記與刺史作戒自置州巳来諸公改授遷絀年月則舊記存焉茅閣記乙已平昌孟公鎮湖南􅀅二􅀊矣以威惠理戎旅以簡易肅州縣刑政之下則無撓人故居方多閑時與賔客嘗􅁒因亭引望以紓逺懐偶愛古木數株重覆城上遂作茅閣䕃其清隂長風寥寥入我軒檻扇和爽􅂔滿扵閣中世傳衡陽暑濕欝烝休息扵此何為不然今天下之人正苦大􅀬誰似茅閣䕃而庥之扵戯賢人君子為蒼生之庥䕃不如是耶諸公歌詠以長之俾茅閣之什得系嗣扵風雅者矣九疑圖記九疑山方二千餘里四州各近一隅世􅁛九峯相似望而疑之謂之九疑亦云舜登九峯疑禹而悲􅀙臣有作九悲之歌因謂之九疑九峯殊極髙大逺望皆可見也彼如嵩華之峻﨑衡岱之方廣在九峯之下磊磊然如布棊石者可以百數中峯之下水無魚鼈林無鳥獸如蝉蠅之􅀋聴之亦無徃徃見大谷長川平田深淵杉松百圍榕栝並之青莎白沙洞穴丹崖寒泉飛流異竹雜華囬映之䖏似藏人家實有九水出扵中山四水流灌扵南海五水北注合為洞庭若度其髙卑比洞庭南海之岸直上可二三百里不知海内之山如九疑者㡬焉􅂉曰若然者茲山何不列扵五嶽對曰五帝之前封疆尚隘衡山作嶽已出荒服今九疑之南萬里臣妾國門東望不見涯際西行㡬里未盡邉陲當合以九疑為南嶽以崑崙為西嶽衡陽之軰聴逸者占為山封君表作園囿耳但苦當世議者拘限常情牽引古製不䏻有􅀁改剏也如何故圖九峯略載山谷傳扵好事以旌異之如山中之徃跡峯洞之名􅁛為人􅀁傳説者並随方題記庶㡬觀者易之時永泰丙午中也寒亭記在江華縣永泰丙午中巡屬縣至江華縣大夫瞿令問咨曰縣南水石相映望之可愛相傳不可登臨俾求之得洞穴而入棧險以通之始得構茅亭扵石上及亭成也所以階檻慿空下臨長江軒楹雲端上齊絶顛若旦暮景氣煙靄異色蒼蒼石墉含映水木欲名斯亭状􅀋不得敢請名之表示来丗扵是于亭上為啇之曰今大暑登之疑天時􅀅寒炎烝之地而清凉可安不合命之曰寒亭歟乃為寒亭作記刻之亭背唐元次山文集卷第九
