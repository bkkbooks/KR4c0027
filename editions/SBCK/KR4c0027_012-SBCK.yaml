front:
  text: 唐元次山文集拾遺
  hash: sha256:c61a403047e519cc4f99a4f6d6d0502ca420db60adc1f5379472c55d5b9cb56d
  markers:
  - {type: page-break, offset: 0, content: '', id: KR4c0027_SBCK_012-1a}
body:
  text: 縣令箴古今􅀁貴有土之官當其選授何嘗不難為其動静是人禍福為其嘘噏作人寒燠煩則人怨猛則人懼勿以賞罰因其喜怒太寛則慢豈䏻行令太簡則踈難與為政既明且㫁直焉無情清而且恵果然必行􅂉曰闗由上官事不自我辭譲而去有何不可誰欲字人贈君此箴豈獨書紳可以銘心五規出規元子門人叔􅀅出逰三年及還元子問之曰爾去我乆矣何以異乎諾曰叔􅀅始自山中至長安見權貴之盛心憤然切悔比年扵空山窮谷與夫子甘飢寒愛水木而巳不數月自王公大夫卿相近臣之門無不至者及一年有向與歡宴過之可弔有始賀拜侯已聞就誅豈不裂封疆土未識豈無印綬懐之未暖其客得禄位者随死得金玉者皆孥參逰宴者􅂉刑或免叔􅀅之身如犬逃者五六似䑕藏者八九當其時環望天地如置在杯斗之中元子聞之嘆曰叔􅀅汝何思而為乎汝若思為社稷之臣則非正直不進非忠讜不言雖手􅁕斧􅃏口䏻出聲猶極忠言與氣偕絶汝若思為禄位之臣猶當避赫赫之路晦顯顯之機如下廐粟馬齒食而巳汝忽然望權勢而徃自致身扵刑禍之方得䈥骨載肉而歸幸也大矣二三子以叔􅀅為戒乎處規州舒吾問元子曰吾聞子多矣意􅀅何為對曰雲山幸不求吾是林泉又不責吾非熈然䏻自全順時而老可矣復安為㢤舒吾曰元子其過誤乎其太矯也吾厭世人飾言以由道蔵智以全璞退身以顯行設機以􅀣名吾子由之使我何信元子俛而謝之滕許大夫友元子聞不應舒吾之􅀃乃曰嗟嗟元子少辭者耶何不曰使吾得􅀁處但如山林不見吾是非吾􅀅娭音稀徃也以子為飾言藏智退身設機何不曰如此豈不多扵盗權竊位蒙汙萬物富貴始及而刑禍促之者乎元子謝不及季川問曰兟兟凡之别称義載尓雅終不復二論兟有意乎扵戯季川吾有言則自是言逹則人非吾安䏻使吾身之有是而令他人之有非至於聞聞也㢤戯規元子友􅀝于雲丘之顛戯牧兒曰爾為牧歌當不責爾暴牧兒歌去乃暴他田田主鞭之啼而􅁈元子啼不止召其父而止之元子友真卿聞之書過扵元子曰嗟嗟次山苟戯小兒俾䧟鞭焉而蒙􅁈之彼牧兒望次山猶臺􅀠不敢干其主及苟戯乃􅂉與次山猶􅄷讎斯豈慎徳也歟吾聞君子不苟戯無似非如何惑一兒使不知􅀁以蒙過此非苟戯似非之非者耶惡不必易此元子報真卿曰扵戯吾獨立扵空山之上戯歌牧兒得過㡬不可免彼行扵世上有愛憎相忌是非相反名利相奪禍福相􅀙至扵有蒙戮辱者焉得不因苟戯似非世兒惑之以及者乎真卿吾當以戯爲規心規元子病逰世歸于商餘山中以酒自肆有醉歌里夫公聞之音多元子之酒請歌之歌曰元子樂矣俾和者曰何樂亦然何樂亦然我曰我雲我山我林我泉又曰元子樂矣俾和者曰何樂然尔何樂然尔我曰我鼻我目我口我耳歌已矣夫公曰自樂山林可也自樂耳目何㢤人誰無此元子引酒當夫公曰勸君此杯酒緩飲之聴我􅀃子行于丗間目不随人視耳不随人聴口不随人語鼻不随人氣其甚也則湏封包裹塞不爾有滅身亡家之禍傷汙毁辱之患生焉雖王公大人亦不䏻自主口鼻耳目夫公何思之不熟耶時規乾元己亥漫叟待詔在長安時中行公掌制在中書中書有醇酒時得一醉醉中叟誕曰願窮天下鳥獸蟲魚以充殺者之心願窮天下醇酎美色以充欲者之心中行公聞之歎曰子何思不盡耶何不曰願得如九州之地者億萬分封君臣父子兄弟之爭􅀦者使人民免賊虐殘酷者乎何不曰􅂅得布帛錢貨珍寳之物溢扵王者府藏滿􅀅相權􅀔之家使人民免饑寒勞苦者乎叟聞公言退而記之授扵學者用為時規惡圎元子家有乳母為圎轉之器以悅嬰兒嬰兒喜之母使為之聚孩孺助嬰兒之樂友人公植者聞戯兒之噐諸見之及見之趍焚之責元子曰吾聞古之惡圎之士歌曰寧方為皁不圎為卿寧方為汚辱不圎為顯榮其甚者則終身不仰視曰吾惡天圎或有喻之以天大無窮人不䏻極逺視四垂因謂之圎天不圎也對曰天縦不圎為人称之我亦惡焉次山奈何任造圓轉之器恣令悅媚嬰兒少喜之長必好之教兒學圖且䧟不義躬自戯圎又失方正嗟嗟次山入門愛嬰兒之樂圎出門當愛小人之趍圎吾安知次山異日不言圎行圎動圎静圎以終身乎吾豈次山之友也元子召季川謂曰吾自嬰兒戯圎公植尚辱我言絶忽乎吾與汝圎以應物圎以趍時非圎不預非圎不為公植其操矛㦸刑我乎惡曲元子時與鄰里會曲全當時之懽以順長老之意歸泉上叔盈問曰向夫子曲全其懽道然也苟爲爾乎元子曰叔盈視吾曲其心以狥財利曲其行以希名位當過吾吾苟全一懽扵鄰里無惡然可也東邑有全􅀡之士聞元子對叔盈恐曰吾聞元次山約其門人曰無惡我之小曲真惽鄙惡辭也吾軰全直三十年未嘗曲氣以轉聲曲辭以逹意曲歩以便徃曲視以囬目猶患扵古人古人有惡曲者不曲臂以取物不曲膝以便坐見天下有曲扵君曲扵民曲扵􅀑神者往劫而死之今元次山苟曲言矣强全一懽以爲不喪其直慁㢤若䏻苟曲扵鄰里强全一懽豈不䏻苟曲扵郷縣以全言行苟䏻曲扵郷縣豈不䏻苟曲於邦􅀦以彰名譽䏻苟曲扵􅀖􅀦豈不䏻苟曲扵天下以􅀭徳義若言行名譽徳義皆顯豈有鍾􅂦不入門權位不在已乎嗚呼曲為之小為大之漸曲為之也有何不可姦邪凶惡其㘥音由乎元子聞之頌曰吾以顔貌曲全一懽全直君子之惡我如此猶有過扵此者何以自免水樂􅀃元子扵山中􅀹􅀁躭愛者有水樂水樂是南磳之懸水淙淙然聞之多乆扵耳􅀹便不至南磳即懸庭前之水􅂑欹曲竇缺之石髙下承之水聲少似聴之亦便訂司樂氏或有將元子水樂􅀃扵司樂氏樂官聞之謂元子曰䏻和分五音韻諧水聲可傳之来請觀學元子辭之使門人以南磳及庭前懸水指之樂氏醜惡慢罵曰韻瞶多矣焉有聴而云樂乎此言聞元子元子謝曰次山病餘惽固自順扵空山窮谷偶有懸水淙石冷然便耳醉甚或與酒徒戯言呼為水樂不防君子過聞而来實汚辱君子之車僕樂官去季川問曰尚兟謝樂官不亦過甚曰然吾為汝訂之汝豈不知彼為司樂之官老矣八音教其心五聲傳其耳不得異聞則以為錯亂紛惑甚不可聴况懸水淙石宫商不䏻合律吕不䏻主變之不可㑹之無由此全聲也司樂氏非全士安得不甚謝之嗟乎司樂氏欲以金石之順和絲竹之流妙宫商角羽豐然迭生以化全士之耳猶以懸水淙石激淺注深清瀛浥溶不變司樂氏之心嗚呼天下誰為全士䏻愛夫全聲也浪翁觀化并序浪翁山野浪老也聞元子亦浪然在山谷病中䏻記水石草木蟲豸之化亦來􅀃常􅀁化凡四􅀃有無相化浪翁曰隂陽之氣化為四時四時之行化為萬物萬物形全是無化有萬物形盡是有化無此有無相化之說有化無浪翁曰人􅂉云我立扵東西望萬里目極則無人我兩忘終世相無此有化無之􅀃無化有浪翁曰人􅂉云我来扵南北行萬里至無不有人我兩求終世相有此無化有之􅀃化相化浪翁曰吾觀化扵無也何無不有吾觀化扵有也何有不無有無更化日以相化化言何極化言何窮時化元子聞浪翁􅀃化化無窮極因論諭曰翁亦未知時之化也多扵此乎曰時焉何化我未之記元子曰扵戯時之化也道徳為嗜慾化為險薄仁義為貪暴化為凶亂禮樂為眈淫化為侈靡政教為煩急化為苛酷翁䏻記扵此乎時之化也夫婦爲溺惑􅀁化化爲犬豕父子爲惽慾􅀁化化爲禽獸兄弟爲猜忌􅀁化化爲讎敵宗戚爲財利􅀁化化爲行路朋友爲世利􅀁化化爲市兒翁䏻記扵此乎時之化也大臣爲威權所恣忠信化爲姦謀庶官爲禁忌􅀁拘公正化爲邪佞公族爲猜忌􅀁限賢哲化爲庸愚人民爲征賦所傷州里化爲禍邸姦兇爲恩幸􅀁迫厮皁化爲􅀅相翁䏻記扵此乎時之化也山澤化爲井陌􅂉曰盡於草木原野化爲狴犴或曰殫扵鳥獸江湖化爲􅂦鑊􅂉曰暴扵魚鼈祠廟化爲宫寢或曰數扵祠禱翁䏻記扵此乎時之化也情性為風俗􅀁化無不作狙狡詐誑之心聲呼為風俗􅀁化無不作謟媚僻淫之亂顔容為風俗􅀁化無不作姦邪蹙促之色翁䏻記於此乎世化浪翁聞元子􅀃時化嘆曰吾昔聞世化可􅀃又異扵此昔世之化也天地化為斧鑕日月化為豺虎山澤化為州里草木化為宗族風雨化為邸舍雪霜化為衣裘呻吟化為常聲糞汚化為梁􅁏一息化為千嵗烏犬化為君子元子惑之浪翁曰子不聞徃昔世之化也四海之内巷戰門鬬㫁骨腐肉萬里相藉天地非斧鑕也耶人民暗夜盗起求食晝逰則死傷相及日月非虎豺也耶人民相與􅀉身命扵絶崖深谷之一底始䏻聲呼動息山澤非州里也耶人民奔走非深林薈叢不䏻藏蔽草木非宗族也耶人民去郷國入山海千里一息力盡暫休風雨非邸舍也耶人民相持於死傷之中祼露而行霜雪非衣裘也耶人民勞苦相􅁈瘡痍相痛老弱􅀌獨相苦死亡不䏻相救呻吟非常聲也耶人民多飢餓溝瀆病傷道路糞汚非梁肉也耶人民奔亡潜伏戈矛相拂前傷後死免而存者一息非千􅀊也耶僵王腐卿相枕路隅鳥獸讓其骨肉烏犬非君子也耶唐元次山文集拾遺終
