front:
  text: 唐元次山文集卷第五
  hash: sha256:8b449ba60d016b7750349245b2dbb42406838460945077ff9f8e06e7c1b49785
  markers:
  - {type: page-break, offset: 0, content: '', id: KR4c0027_SBCK_005-1a}
body:
  text: 引極三首有序引極興也喻也引之言演極之言盡演意盡物引興極喻故曰引極思元極天曠漭莫朗反兮杳泱鳥朗反茫氣浩浩兮色蒼蒼上何有兮人不測積清寥兮成元極彼元極兮靈且異思一見兮藐忙招反難致思不從兮空自傷心慅蘇遭反􅻺兮意惶懹思假翼兮鸞鳯乘長風兮上羾古送反揖元氣兮本深實湌至和兮永終日望仙府山鑿落兮眇嶔岑雲溶溶兮木棽棽中何有兮人不覩逺欹差兮閟仙府彼仙府兮深且幽望一至兮藐無由望不從兮知如何心混混兮意渾和思假足兮虎豹超阻絶兮凌趠諸教反詣仙府兮􅀙羽人餌五靈兮保清真懐潜君海浩淼兮汩洪溶流藴藴兮濤洶洶下何有兮人不聞深溢漭兮居潜君彼潜君兮聖且神思一見兮藐無因思不􅀙兮空踟蹰心囘迷兮意縈紆思假鱗兮鯤龍激沆湖浪反浪兮奔􅀙拜潜君兮索玄寳佩元符兮􅁤皇道演興四首有序啇餘山有太靈古祠傳云豢龍氏祠大帝􅀁立祠在少餘西乳之下邑人修之以祈田予因為招祠訟閔之文以演興辭曰招太靈招太靈兮山之顛山屹􅙣兮水淪漣祠之䄤洺代反堕壞也兮眇何年木脩脩兮草鮮鮮嗟魑魅兮淫厲自古昔兮崇􅀕禧太靈兮端清予願致夫精誠乆愵奴歷反兮㤝㤝處龍反招捃郎丁反兮呼風風之聲兮起飀飀吹玄雲兮散而浮望太靈兮儼而安澹油溶兮都清閑􅀄祀山之乳兮葺太祠木孫為桷兮木母榱雲纓為􅦲莫到反門樞之横梁兮愚木㧫洞淵禪兮掲巍巍􅂗水蘭兮蒔市之反糅焉􅀍弱草兮禘礿聮仡許訖反渾洪兮馥闐闐管化石兮洞刳天翹脩釤兮掉蕪殳靈巫力軌反兮舞顒于薦天羊至反字音皆未詳兮酒陽泉獻水芸兮飯霜秈相然反與太靈兮千萬年訟木魅登髙峯􅀆俯幽谷心悴悴倉卒反兮念群木見樗栲兮相隂覆憐梫榕上七林下余封兮不豐茂見榛梗之森梢閔樅橎上土恭下甫元兮合蠧槢以八反橈橈女教反兮未堅椲韋􅄦反桹桹力唐反兮可屈樒羙五反樽上而寸下兹損兮不香抜丰茸兮巳實豈元化之不均兮非雨露之偏殊諒理性之不等扵順時兮不如瘱扵計反吾心以􅄀想終念此兮不怡佁徒充反以書義考之當作侗予莫識天地之意兮願截惡木之根傾梟獍之古巢􅂑御名童以為薪割大木使飛熖徯枯腐之燒焚實非吾心之不仁惠也豈耻夫善惡之相紛且欲畚三河之膏壤禆濟水之清漣􅀅封灌乎善木令橚橚息逐反以梃梃丑然反尚畏乎衆善之未茂兮為衆惡之􅀁挑凌思聚義以為曹令敷扶以相勝􅂑方􅀁以柯如兮吾􅀅出扵南荒求夀藤與燔本吾􅀅出扵東方祈有徳而来歸輔神檉與堅香且憂顒之翩翩又愁㺠以王反之奔馳及隂陽兮不和惡此土之失時今神檉兮不茂使堅香兮不滋重嗟惋兮何􅀘每齋心以精意切援祝扵神明冀感通於天地猶恐衆妖兮水魅魍魎兮山精上誤惑扵靈心􅀴紿于言兮不聴敢引佩以指水誓吾心兮自明閔岭中􅀰丁反群山以延想吾獨閔乎岭中彼岭中兮何有有天含之玉峰殊閟絶之極顛上聞産乎翠茸欲採之以􅀅夀眇不知夫􅀁􅀙大淵藴藴兮絶嶘士眼反岌岌非梯梁以通險當無路兮可入彼猛毒兮曹聚必慿託乎阻脩常儗儗兮伺人又如何兮不愁彼妖精兮變恠必假見扵風雨常閃閃而伺人又如何兮不苦欲仗仁兮託信􅀅徑徃兮不難乆懹懹以㥄惋上力膺下鳥段却遲廻而永歎懼太靈兮不知以予心為永惟若不可乎遂巳吾終保夫直方則必蒙皮篻莫招反以為矢絃母筱以周反以為弧化毒銅以為㦸刺􅁄竹以為殳得其甚也不如草木此意多顯扵元子者􅂉曰訂如是他丁反不如則不如也不如如者止扵此乎元于扵是系之扵人事縯以淺反之扵此喻始為七不如不如之義始極也第一元子以為人之毒也毒扵郷毒扵􅀦毒扵鳥獸毒扵草木不如毒其形毒其命毒其姻戚毒其家族者爾扵戯毒可頌也乎㢤毒有甚焉何如第二元子以為人之媚也媚扵時媚扵君媚扵朋友媚扵郷縣不如媚扵厩媚扵室媚扵市肆媚扵道路者爾扵戯媚可頌也乎㢤媚有甚焉何如第三元子以為人之詐也詐扵忠詐扵信詐扵仁義詐扵正直不如詐扵愚詐扵弱詐扵貧賤詐扵退譲者爾扵戯詐可頌也乎㢤詐有甚焉何如第四元子以為人之惑也惑扵邪惑扵佞惑扵姦惡惑扵兇暴不如惑扵狂惑扵誕惑扵翫弄惑扵諧戯者爾扵戯惑可頌也乎㢤惑有甚焉何如第五元子以為人之貪也貪扵權貪扵位貪扵􅂑求貪扵聚積不如貪扵徳貪扵道貪扵閑和貪扵静順者爾扵戯貪可頌也乎㢤貪有甚焉何如第六元子以為人之溺也溺扵聲溺扵色溺扵圎曲溺扵妖妄不如溺扵仁溺扵讓溺扵方直溺扵忠信者爾扵戯溺可頌也乎㢤溺有甚焉何如第七元子以為人之忍也忍扵毒􅃘扵媚忍扵詐惑􅃘扵貪溺不如􅃘扵貧􅃘扵苦􅃘扵棄汚􅃘扵病癈者爾扵戯忍可頌也乎㢤􅃘有甚焉何如訂古五篇有序天寳癸巳元子作訂古訂古前丗君臣父子兄弟夫婦朋友之道扵戯上古失之中古亂之至扵近世有窮極凶惡者矣􅂉曰欲如之何對曰􅀅如之何吾且聞之訂之嗟之傷之泣而恨之而巳也第一吾觀君臣之間且有猜忌而聞疑懼其由禪譲革代之道誤也故後世有刼篡廢放之惡興焉嗚呼即有􅀌弱􅀅安託㢤即有功業􅀅安保㢤第二吾觀父子之際且有悲感而聞痛恨其由聴䜛受亂之意惑也故後世有幽毒囚殺之患起焉嗚呼即有深慈􅀅安興㢤即有至孝􅀅安訴㢤第三吾觀兄弟之中且有闘争而聞殘􅃘其由分國異家之教薄也故後世有隂謀誅戮之害生焉嗚呼即有友悌􅀅安用㢤即有恭順􅀅安全㢤第四吾觀夫婦之道且有􅁈怨而聞嫌妬其由耽淫惑亂之情多也故後世有㓕身亡家之禍發焉嗚呼即有信義􅀅安及㢤即有柔順􅀅安守㢤第五吾觀朋友之義且有邪詐而聞忌患其由趍􅀔近利之心甚也故後世有窮凶極害之刑生焉嗚呼即有節分􅀅安與㢤即有方正􅀅安容㢤自述三篇有序天寳庚寅元子􅀄習静于啇餘人聞之非非曰此狂者也見則茫然無㡬人聞之是是曰此學者也見則猗然及三年人聞之叅叅曰此􅀮者也見則崖然有惑而問曰子其􅀮乎對曰吾豈􅀮者邪愚者也窮而然爾􅂉者不喻遂為述時命以辯之先曾為述居一篇因刋而次之總命曰自述述時昔隋氏逆天地之道絶生人之命使怨痛之聲滿于四海四海之内隋人未老隋社未安而隋􅀦巳亡何㢤奢淫暴虐昏惑而巳烝人苦之上訴皇天皇天有命扵我􅀦家六葉于兹髙皇至勤文皇至明身鑒隋室不敢滿溢清儉之深聴察之至仁惠之極泱泱洋洋爲萬代則聖皇承之不言而化四十餘年天下太平禮樂化扵戎夷慈恵及扵草木雖奴􅀠齒􅀋亦䏻誦周公孔父之書􅀃陶唐虞夏之道至扵歌頌謳吟婦人童子皆抒性情羙辭韻指詠時物與絲竹諧㑹綺羅當稱况世貴之士博學君子其文學聲望安得不顯聞扵當時也㢤故冠冕之士傾當時大利軒車之士富當時大農由此知官不勝人逸扵司領使秩次不䏻損又休罷以抑之尚駢肩累趾授任不暇予愚愚者亦當預焉日覺抵塞猒扵無用乃以因慕古人清和藴純周周仲仲瘱扵計反然全真上全忠孝下盡仁信内順元化外娭大和足矣如戚促􅃖諸稱脂反封蒙遏㓕暮為朝貴心􅀁不喜亦由金可鎔不可使為汙腐水可濁不可使為塵糞然巴鄙語曰愚者似直弱者似仁予殆有之夫復何疑述命元子甞問命扵清恵先生先生曰子欲知命不如平心平心不如忘情喏如酌反敬言也曰幸先生教之先生曰夫平心䏻正是非忘情䏻㓕有無子何先焉曰請先忘情先生曰子見草木乎子見天地乎草木無心也天地無情也而四時自化雨露自均根柢自深枝幹自茂如是天地豈醜授而成㢤草木豈憂求而生㢤人之命也亦由是矣若夭若夀若貴若賤烏可強㢤不可強也不可強也不如忘情忘情當學草木嗚呼上皇強化天下天下化之養之以道徳道徳偽薄天下亦從而偽薄嗚呼後王急濟天下天下從之救之以權宜權宜侈惡天下亦􅀙而侈惡故赴貪徇紛急之風以至于今聖賢者兢兢然猶傷命性愚惑者慁慁然遂忘家國其由不審不通醜授憂求而已子不喻乎述居天寳庚寅元子得啇餘之山山東有谷曰餘中谷東有山曰少餘山谷中有田可耕藝者三數夫一夫百畆有泉停浸可畦稻者數十畝泉東南合肥溪溪源在少餘山下溪流出谷與潨職􅂭反水合匯于滍􅀅成􅀁居故人李才聞而来㑹乃歎曰吾未始知夫子之􅀁至焉今知之矣吾聞在貧思富在賤思貴人之常情也聖賢􅀁有然而知貧賤不可苟免富貴不可苟􅂑上順時命乘道御和下守虚澹修已推分稱君子者始不公乎乃相與占山泉闢榛莾依山腹近泉源始為亭廡始作堂宇因而習静適自保閑夫人生扵世如行長道􅀁行有極而道無窮奔走不停夫然何適予當乘時和望年豐耕藝山田兼僃藥石與兄弟承歡扵膝下與朋友和樂扵琴酒􅋁然順命不為物累亦自得之分在扵此也唐元次山文集第五
