front:
  text: 元集補
  hash: sha256:6752040c60305021a1e59a3010670b3a83265e2584106962085bacaddf0b2244
  markers:
  - {type: page-break, offset: 0, content: '', id: KR4c0027_SBCK_013-1a}
body:
  text: 元集初據郭本上版印成又從唐音丙籖得序二首從别本得詩一首不同者一首為補録于此無錫孫育修識劉侍御月夜宴會并序詩見卷四兵興以來十一年矣獲與同心歡醉達旦詠歌取適無一二焉乙巳嵗彭城劉靈源在衡陽逢故人或有在者曰昔相會第歡逺遊始與諸公待月而笑語竟與諸公愛月而歡醉詠歌夜久賦詩言懷于戲文章道喪蓋久矣時之作者煩雜過多歌兒舞女且相喜愛系之風雅誰道是邪諸公嘗欲變時俗之淫靡為後生之規範今夕豈不能道達情性成一時之美乎送孟校書往南海并序詩見卷四題作别孟校書平昌孟雲卿與元次山同州里以詞學相友幾二十年次山今罷守春陵雲卿始典校藝閣于戲材業次山不如雲卿詞賦次山不如雲卿通知次山不如雲卿在次山又詡然求進者也誰言時命吾欲聽之次山今且未老雲卿少次山六七嵗雲卿聲名滿天下知己在朝廷及次山之年雲卿何事不可至勿隨長風乘興蹈海勿愛羅浮往而不歸南海幕府有樂安任鴻與次山最舊請任公為次山一白府主趣資裝雲卿使北歸慎勿令徘徊海上諸公第作歌送之朝陽巖下歌詩見卷四與此不同朝陽巖下湘水深朝陽洞口寒泉清零陵城郭夾湘岸巖洞幽奇帶郡城荒蕪自古人不見零陵徒有先賢傳水石為娛安可羡長歌一曲留相勸橘井卷四欵乃曲後靈橘無根井有泉世間如夢又千年鄉園不見重歸鶴姓字今為第幾仙風冷露壇人悄悄地間荒徑草綿綿如何躡得蘇君迹白日霓旌擁上天
  hash: sha256:0a47a9d068fbb396ebe6a31c5d9c09c3ca624549e3d9c56951e4999ab4056c44
