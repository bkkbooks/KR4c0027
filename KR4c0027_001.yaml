front:
  text: 唐元次山文集卷第一
  hash: sha256:21249710acb3d2022d561a63e211051c629ed5e643554ce4c609969590730360
  markers:
  - {type: page-break, offset: 0, content: '', id: KR4c0027_SBCK_001-1a}
body:
  text: 贈禮部侍郎元結著翰林編修湛若水校太保武定侯郭勛編𥙷樂歌十首有序自伏羲氏至于殷室凢十代樂歌有其名亡其辭考之傳記而義或存焉嗚呼樂聲自太古始百世之後盡無一作亡古音嗚呼樂歌自太古始百世之後遂無一作亡古辭今國家追復純古列祠徃帝嵗時薦享則必作樂而無雲門咸池韶夏之聲故探其名義以𥙷之誠不足全化金石反正宫羽而或存之猶乙乙冥冥有純古之聲豈㡬乎司樂君子道和焉爾凢十篇十有九章各引其義以序之命曰𥙷樂歌網罟伏羲氏之樂歌也其義盖稱伏羲䏻易人取禽獸之勞吾人苦兮水深深網罟設兮水不深吾人苦兮山幽幽網罟設兮山不幽右網罟二章章四句豐年神農氏之樂歌也其義盖稱神農教人種植之功猗太帝兮其智如神分草實兮濟我生人猗太帝兮其功如天均四時兮成我豐年右豐年二章章四句雲門軒轅氏之樂歌也其義盖言雲之出潤益萬物如帝之徳無所不施玄雲溶溶兮垂雨濛濛類我聖澤兮涵濡不窮玄雲漠漠兮含映愈光類我聖徳兮溥𬒳無方右雲門二章章四句九淵少昊氏之樂歌也其義盖稱少昊之徳淵然深逺聖徳至深兮藴藴一作奫奫如淵生類娭娭許其反兮孰知其然右九淵一章章四句五莖顓頊氏之樂歌也其義盖稱顓頊得五徳之根莖植植萬物兮滔滔根莖五徳涵柔兮渢渢舊音容别本房戎切而生其生如何兮秞秞以周反天下皆自我君兮化成右五莖一章章八句六英髙辛氏之樂歌也其義盖稱帝嚳䏻總六合之英華我有金石兮擊考崇崇一作擊拊淙淙與汝歌舞兮上帝之風由六合兮英華渢渢我有絲竹兮韻和泠泠與汝歌舞兮上帝之聲由六合兮根底嬴嬴右六英二章章六句咸池陶唐氏之樂歌也其義盖稱尭徳至大無不僃全元化油油兮孰知其然至徳汩汩兮順之以先元化浘浘音尾兮孰知其然至道泱泱兮由之以全右咸池二章章四句大韶有虞氏之樂歌也其義盖稱舜䏻紹先聖之徳森森羣象兮日見生成欲聞朕𥘉兮玄封冥冥洋洋至化兮日見深柔欲聞涵濩兮大淵油油右大韶二章章四句大夏有夏氏之樂歌也其義盖稱禹治水其功䏻大中國茫茫下土兮乃生九州山有長岑兮川有深流茫茫下土兮乃均四方國有安人兮野有封疆茫茫下土兮乃歌萬年上有茂功兮下戴仁天右大夏三章章四句大濩有殷氏之樂歌也其義盖稱湯救天下濩然得所萬姓苦兮怨且哭不有聖人兮誰濩育聖人生兮天下和萬姓熈熈兮舞且歌右大濩二章章四句二風詩有序天寳丁亥中元子以文辭待制闕下著皇謨三篇二風詩十篇将欲求于司匭氏以禆天監㑹有司奏待制者悉去之扵是歸于州里後三嵗以多病習靜扵啇餘山病間遂題括存之此亦古之賤士不忘盡臣之分耳其義有論訂之治風詩五篇古有仁帝䏻全仁明以封天下故為至仁之詩二章猗皇至聖兮至惠至仁徳施藴藴紆文反藴藴如何不全不缺莫知所貺猗皇至聖兮至儉至明化流瀛瀛瀛瀛如何不􅉑許杲反不字與音皆未詳莫知其極右至仁四韻十二句古有慈帝䏻保静順以􅉼萬物故為至慈之詩二章至化之深兮猗猗娭娭如煦如吹如負如持而不知其慈故莫周莫止静和而止至化之極兮瀛瀛溶溶如涵如封如随如從而不知其功故莫由莫巳順時而理右至慈四韻十四句古有勞王䏻執勞儉以大功業故為至勞之詩三章至㢤勤績不盈不延誰䏻頌之我請頌焉扵戯勞王勤亦何極濟爾九土山川溝洫至㢤儉徳不豐不敷誰䏻頌之我請頌夫扵戯勞王儉亦何深戒爾萬代奢侈荒淫至㢤茂功不升不圮誰䏻頌之我請頌矣扵戯勞王功亦何大去爾兆庶洪湮災害右至勞六韻二十四句古有正王䏻正慎恭和以安上下故為至正之詩二章為君之道何以為明功不濫賞罪不濫刑讜言則聴謟言不聴王至是然可為明焉右至正四韻八句古有理王䏻守清一以致無刑故為至理之詩一章理何為兮系脩文徳加之清一莫不順則意彼刑法設以化人致使無之而化益純所謂代刑以道去殺嗚呼嗚呼人不斯察右至理三韻十二句亂風詩五篇古有荒王忘戒慎道以逸豫失國故為至荒之詩一章國有世謨仁信勤歟王實惛荒終亡此乎焉有力恣謟惑而不亡其國嗚呼亡王忍為此心敢正亡王永為世箴右至荒三韻十二句古有亂王肆極凶虐亂亡乃巳故為至亂之詩二章嘻乎王家曾有凶王中世失國豈非驕荒復復之難令則可忘嘻乎亂王王心何思暴淫虐惑無思不為生人冤怨言何極之右至亂二韻十二句古有虐王昏毒狂忍無惡不及故為至虐之詩二章夫為君上兮慈順明恕可以化人忍行昏恣獨樂其身一狥所欲萬方悲哀扵斯而喜當云何㢤夫為君上兮兢慎儉約可以保身忍行荒惑虐暴扵人前世失國如王者多扵斯不寤當如之何右至虐四韻十八句古有惑王用姦臣以虐外寵妖女以亂内内外用亂至扵崩亡故為至惑之詩二章賢聖為上兮必儉約戒身鍳察化人所以保福也如何不思荒恣是為上下隔塞人神怨奰平放反敖惡無厭不畏顛墜聖賢為上兮用必賢正黜姦佞之臣所以長乆也如何反是以為亂矣寵邪信惑近佞好䛕廢嫡立庶忍為禍謨右至惑六韻二十句古有傷王以崩盪之餘無惡不為也亂亡之由固在累積故為至傷之詩一章夫何傷乎傷王乎欲何為乎将蠧枯矣無人救乎蠧枯及矣不可救乎嗟傷王自為人君變為人奴為人君者忘戒此乎右至傷二韻十二句二風詩論客有問元子曰子著二風詩何也曰吾欲極帝王理亂之道系古人規諷之流曰如何也夫至理之道先之以仁明故頌帝堯為仁帝安之以慈順故頌帝舜為慈帝成之以勞儉故頌夏禹為勞王脩之以敬慎故頌殷宗為正王守之以清一故頌周成為理王此理風也夫至亂之道先之以逸惑故閔太康為荒王壊之以苛縦故閔夏桀為亂王覆之以淫暴故閔殷紂為虐王危之以用亂故閔周幽為惑王亡之累扵積故閔周赧為傷王此亂風也訂曰子頌善上不及羲軒湯武閔惡又不及始皇哀靈焉可稱極帝王理亂之道對曰扵戯吾敢言極極其中道者也吾且不曰著斯詩也将系規諷乎如羲軒之道也乆矣誰䏻師尊如湯武之徳吾則不敢頌為規法過扵是也吾子審之唐元次山文集卷第一
